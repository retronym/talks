<script type="text/markdown" id="talk-src"># Zinc: incrementality as a language-design concern

**Audience:** maintainers of scalac / dotc, IDEs (Metals, IntelliJ), build tools (sbt, Mill, Bazel, Pants, Gradle). They know the compilers; most don't know Zinc's internals.

**Thesis:** every language feature has an incrementality story, whether or not its designer wrote one down. Incremental soundness is a property of the *compiler's* API summary, which now lives in the compiler repos. So it should be designed, specified and tested alongside each feature, not reverse-engineered from user bug reports years later.

<!-- break -->

**Arc:**

1. What incremental compilation *is*, precisely (so "under/overcompilation" stop being vibes); what Zinc trades away for speed (hashes instead of resolution); and the premise it all rests on: separate ≡ joint compilation.
2. How Zinc approximates it, and three design choices worth arguing about: members vs decls, who computes the hashes, and what a used name is (name kinds).
3. How everyone else does it.
4. Where it breaks: worked examples (implicits, value classes, macros), then a taxonomy.
5. The machinery we maintain: bridge, tests, persisted state.
6. The cheapest incremental compile is the one you skip.
7. Can we prove it? A Lean model.
8. Asks.

**Suggested budget (~60 min):** I 12 · II 10 · III 3 · IV 14 · V 10 · VI 4 · VII 5 · close 2. Cut Part III to a single slide if time is short; Part VII can be a 2-slide teaser.

### Why incrementality matters more for Scala

- **Scala compilers are slow per line.** scalac and dotc process far fewer lines per second than javac. Typing does real work: inference, implicit/given search, overload resolution, macro expansion and inlining. The pipeline also has many more phases before bytecode. (TODO: put one measured number on the slide, e.g. from scala/compiler-benchmark, scalac vs javac on comparable code.)
- **So a full rebuild costs more.** A module rebuild that a Java team shrugs off becomes minutes in Scala, and the edit-compile loop is where users feel it. The same holds in the IDE: Metals and IntelliJ compile through Zinc/BSP.
- **So precision is worth more.** Java build tools can lean on fast compiles plus coarse ABI-jar avoidance (Gradle, Bazel `ijar`). Scala needs fine-grained invalidation inside the module as well. That puts every under/overcompilation bug in this talk on the critical path of daily work.
- **And rounds cost more** (§4): each extra round pays again for typer setup and signature loading, so keeping round counts low matters as much as keeping file counts low.

---

## Part I — First principles

### 1. The contract

- Program = a set of sources $S$. Clean compile $C : \mathcal{P}(S) \to \mathit{Out}$ (classfiles/TASTy + diagnostics).
- Incremental compile $I : (\mathit{State}, S', \Delta) \to (\mathit{Out}', \mathit{State}')$, where $\mathit{State}$ summarises the previous run.
- **Correctness:** up to observational equivalence (bytes modulo known nondeterminism; same diagnostics),

$$I(\mathit{State}, S', \Delta) \equiv C(S')$$

- **Undercompilation:** $I \not\equiv C$, so it is unsound.
- **Overcompilation:** $I \equiv C$ but the recompiled set $R$ is much larger than the minimal $R^*$, so it is sound but slow.
- Users experience both as "sbt is flaky", type `clean`, and stop trusting the tool. Undercompilation is a correctness bug; overcompilation is a perf bug that trains users to throw away the incremental state.

### 2. Summaries as abstractions

- For each class $c$ the compiler extracts $\mathrm{API}(c) = \pi(c)$, a projection of its typed definition.
- A **client** (dependent) of $c$ is a class $d$ whose compilation references $c$: it calls, extends, mentions or pattern-matches on something in $c$. For each $d$ the compiler records the *used names* $U(d)$. The question is always "when $c$ changes, which of its clients must recompile?"
- **Soundness condition** (the one-line slide):

$$\pi_{U(d)}(c) = \pi_{U(d)}(c') \implies C(d \mid c) = C(d \mid c')$$

- In words: $\pi$ must capture *everything a client's compilation can observe*.
- Every undercompilation bug is a counterexample: an observable not in $\pi$.
- Every overcompilation bug is the dual: $\pi$ distinguishes things no client observes (positions, fresh names, iteration order).
- Precision/soundness lattice: coarser $\pi$ gives sound but slow results; finer $\pi$ is fast and correct only if every observable is captured.

<!-- break -->

**Observables are closed under the backend.**

- The client's output is $g(\mathrm{typed}(d))$, and codegen applies functions $f$ to the definitions it references: erasure $E$, name mangling, bridge and forwarder generation, boxing, constant folding.
- If $d$'s output depends on $f(c)$ for one of these, then $\pi(c)$ must determine $f(c)$.
- For an ordinary class, erasure is a function of the *name*, so a name-keyed $\pi$ is enough:

$$E(A) = A$$

- For a value class, erasure is a function of the *contents*, and the name-keyed view breaks (§15b):

$$E(A) = E(\mathrm{underlying}(A))$$

### 3. The algorithm: a fixed point over a dependency graph

$$R_0 = \mathit{changed} \cup \mathrm{dependents}(\mathit{deleted}) \qquad R_{n+1} = \mathrm{inv}(\Delta\mathrm{API}_n) \qquad \text{stop when } \mathrm{inv}(\Delta\mathrm{API}_n) \subseteq R_n$$

The next round recompiles *all* of $\mathrm{inv}(\Delta\mathrm{API}_n)$, including classes from the round just finished; subtracting $R_n$ only decides whether to stop (§4).

```mermaid
flowchart TB
  R0["R₀ = changed sources ∪ dependents of deleted"] --> CMP["Compile Rₙ together (compiler + bridge)"]
  CMP --> D{"API / name hashes<br/>changed?"}
  D -- "no: early cutoff" --> STOP["Done"]
  D -- "yes" --> INV["Invalidate dependents:<br/>inheritance (unfiltered),<br/>memberRef ∩ used names"]
  INV -- "Rₙ₊₁ non-empty" --> CMP
  INV -- "Rₙ₊₁ = ∅" --> STOP
```

- Edges: `memberRef`, `inheritance`, `localInheritance`, `macroExpansion`; plus library dependencies, tracked by classfile/jar stamps.
- **Name hashing:** $\mathrm{API}(c)$ is split into $\{\, n \mapsto \mathit{hash} \,\}$; a `memberRef` client $d$ is invalidated only if $U(d) \cap \mathrm{changedNames}(c) \neq \emptyset$. Inheritance edges bypass the filter.

<!-- break -->

- `UseScope` (`Default`, `Implicit`, `PatMatTarget`) exists because "used name" alone is not enough. This is the first hint that some observables aren't names (§15–16).
- Granularity: source-level (sbt ≤ 0.13) → class-level (Zinc 1.0). Finer nodes give smaller $R$ but more state, and more ways to be wrong.
- Escape hatch: past `transitiveStep` cycles, invalidate everything. The fallback is part of the semantics.
- Key point for this audience: $\pi$ and $U$ are computed *inside the compiler*, by the bridge phases `ExtractAPI` and `ExtractDependencies`. Zinc only does set algebra on them, so **incremental soundness is mostly a compiler property.**

```mermaid
flowchart LR
  subgraph COMPILER["Compiler process (scalac / dotc)"]
    T["typer"] --> XA["ExtractAPI<br/>→ π(c)"]
    T --> XD["ExtractDependencies /<br/>ExtractUsedNames → U(d), edges"]
    T --> BE["backend<br/>→ classfiles"]
  end
  XA -- "AnalysisCallback" --> Z["Zinc: hash, store<br/>Analysis"]
  XD -- "AnalysisCallback" --> Z
  BE --> Z
  Z --> INV["Invalidator<br/>(set algebra on hashes)"]
```

- **Unconditional fallbacks in the invalidator** (`MemberRefInvalidator`) show where name hashing gives up and every `memberRef` client is invalidated:
  - any change to an *implicit* member;
  - any change in a file that *declares a macro*;
  - any change in a file that declares an annotation.

  Each one is a confession that $U(d)$ can't express the dependency (worked examples in §15).

### 4. Rounds: the fixed point in practice, its heuristics, and why incremental can be slower than clean

Each round (Zinc calls it a *cycle*) is a full compiler run over $R_n$:

- typecheck and generate code for $R_n$;
- load signatures of everything else from classfiles/TASTy;
- delete stale products, keeping a backup for transactional rollback;
- merge the new Analysis, diff old and new APIs, compute $R_{n+1}$.

```mermaid
flowchart TB
  A["Round 1: A.scala<br/>(edited: f's result type)"] -- "API of A changed" --> B["Round 2: B<br/>val g = A.f (inferred)"]
  B -- "B's API changed too" --> C["Round 3: clients of B"]
  C -- "round ≥ transitiveStep" --> X["Brute force: transitive<br/>closure of dependents"]
```

<!-- break -->

**Precisely** (`IncrementalCommon.invalidateAfterInternalCompilation`):

$$N_n = \mathrm{inv}(\Delta\mathrm{API}_n) \ \cup\ \mathrm{macroDownstream}(R_n) \ \cup\ \mathrm{collisions} \qquad \text{continue iff } N_n \setminus R_n \neq \emptyset$$

$$R_{n+1} = \begin{cases} N_n & n < \mathtt{transitiveStep} \\ \mathrm{closure}(N_n) \cup R_n & n \ge \mathtt{transitiveStep} \end{cases}$$

- Subtracting $R_n$ is only the stop test. The next round recompiles everything invalidated, so classes from the previous round can come back, and with cycles in the class graph the plain regime need not terminate.
- From `transitiveStep` on, the round set is monotone ($R_{n+1} \supseteq R_n$, closed under dependents). That is what bounds the loop without any assumption about the graph (the Lean plan proves termination this way, §22).
- **Typical round counts:** a body-only change takes 1 round (early cutoff); a signature change takes 2.
- **Inferred types ripple:** a change to the inferred result type of a public `def` changes the API of every unedited class whose own public signature is inferred from it, adding a round per level. Explicit result types on public members are an *incremental-compilation* best practice, not just a style rule: they make interfaces source-determined, which caps a signature change at two rounds and guarantees the result matches a clean build (§22, T3).

<!-- break -->

**The heuristics** (`IncOptions`), each trading precision for a bound on rounds:

| Heuristic | Default | What it does |
|---|---|---|
| `transitiveStep` | 3 | from round 3 on, stop name-filtering: invalidate the *transitive closure* of the round's invalidations, plus the classes just recompiled ("brute-force transitive invalidation") |
| `recompileAllFraction` | 0.5 | if more than half of the sources are invalidated, compile everything in one round |
| macro downstream | always | every round, invalidate macro-bearing classes transitively downstream of anything recompiled (behaviour, not just API, flows into expansions) |
| unconditional invalidation | always | implicit members, files declaring macros or annotations: all `memberRef` clients (§3) |
| initial invalidation | — | tuned on field reports: "include mutual dependencies in initial invalidation" ([sbt/zinc#1284](https://github.com/sbt/zinc/pull/1284)) was reverted ([#1462](https://github.com/sbt/zinc/pull/1462)) after an overcompilation report ([#1420](https://github.com/sbt/zinc/issues/1420)) |

<!-- break -->

**Why an incremental compile can be slower than a clean one.** Rough cost model, with $c_0$ the per-run overhead, $c$ the per-class compile cost and $c_{\mathrm{sig}}$ the cost of loading a dependency's signature:

$$\mathrm{cost}(I) \approx \sum_{n} \big(c_0 + c\,\lvert R_n\rvert + c_{\mathrm{sig}}\,\lvert \mathrm{deps}(R_n) \setminus R_n\rvert\big) + \mathrm{bookkeeping} \qquad \mathrm{cost}(C) \approx c_0 + c\,\lvert S\rvert$$

- **Per-round overhead repeats:**
  - a new compiler run;
  - classpath and symbol loading, i.e. unpickling the signatures of everything $R_n$ touches;
  - a cold JIT if the compiler isn't in a long-lived server;
  - Analysis merge and API diff;
  - classfile backup/restore, and jar rewriting for straight-to-jar output and the pipelining early-output jar.
- **Overlap:** $\sum_n \lvert R_n \rvert$ can exceed $\lvert S \rvert$ when classes recompile in several rounds.

<!-- break -->

- **Lost batch efficiencies:** one big run amortises typer caches, the parallel backend (`-Ybackend-parallelism`) and module-level pipelining. Several small runs don't.
- **A tax on every build:** the extraction phases (`xsbt-api`, `xsbt-dependency`) and Analysis persistence run even on a clean build. So a Zinc clean build is slower than plain `scalac`. (TODO: measure the share with `-Vstatistics` on scala/scala.)
- **Incremental wins only when** $\sum_n \lvert R_n\rvert \ll \lvert S\rvert$ *and* there are few rounds. `recompileAllFraction` is a crude, static estimate of that inequality.

**Implications:**

- Treat *rounds per build* as a first-class metric, alongside files recompiled. The invalidation log already has it.
- Make the escape hatches visible. Today both "Recompiling all sources: …" and "Brute-force transitive invalidation" only appear in debug-level invalidation logs, so users never learn why a one-line edit rebuilt the module.
- Consider a *cost-model* switch to a full compile, predicted from $\lvert R_n\rvert$, round count and measured per-round overhead, instead of a fixed fraction.
- Pipelining and a warm compiler server (sbt server, Bloop, Mill's worker) shrink $c_0$, which moves the break-even point in Zinc's favour.

### 5. Efficiency vs minimality: Zinc deliberately doesn't compute R*

- **True minimality is as expensive as compiling.**

$$d \in R^* \iff C(d \mid \mathit{new}) \neq C(d \mid \mathit{old})$$

  Deciding that exactly means re-running $d$'s compilation, or at least re-running every query $d$ made and comparing the answers. Any practical incremental compiler computes a cheap, sound over-approximation $R \supseteq R^*$.
- **The one place Zinc *is* precise: early cutoff.** After recompiling $R_n$, propagation happens only if the *new* hash differs from the old. Without this, every edit would recompile the transitive dependents, as `make` would. With it, a body-only change stops after one cycle. (*Build Systems à la Carte* calls this early cutoff; §22.)
- **The pattern:** Zinc replaces *resolution* (an expensive semantic question about the new program) with *hash equality over a projection* (cheap and syntactic). Soundness comes from the projection covering everything resolution could depend on (§2). Precision is whatever survives that coarsening.

<!-- break -->

**Zinc's approximations, each trading precision for cost:**

| Zinc does | Instead of (closer to $R^*$) | Saves | Costs (overcompilation) |
|---|---|---|---|
| compares **hashes** of $\pi$ (an `int` API hash, `int` per-name hashes) | structural diff of old vs new API | O(1) compare; small state; no old API kept (`APIUtil.minimize`) | can't tell *compatible* changes (widening, adding a default) from breaking ones; can't explain what changed without `apiDebug`. In theory 32-bit collisions are unsound; in practice negligible per comparison |
| invalidates $d$ if it **uses name $n$** and depends on $c$ | **re-resolve** $d$'s uses of $n$ against the new $c$ (overloads, qualifiers, overriding) | no per-use resolution data stored; no lookups at invalidation time | `size` on any receiver; overloads it never picks (§12) |
| hashes **all defs named $n$** together | per-overload / per-signature keys | additions are visible (§12) | any overload change hits every user of the name |
| **class** nodes, **source-file** recompilation units | member-level nodes | small graph | every class in an invalidated file recompiles |
| **inheritance** edges bypass name filtering, transitively | per-member override analysis | no override tracking | a change to any member reaches every heir |
| **materialises members as seen from $C$** and hashes them (§7–9) | resolve `C#m` through linearization on demand | invalidation never walks the hierarchy | $\sum_c \lvert\mathrm{members}(c)\rvert$ extraction and state; N-fold re-detection |
| `transitiveStep` cap → recompile everything | keep iterating | bounded cycles | rare full rebuilds |

<!-- break -->

**Merkle hashing as the same trade, applied to member resolution** (links to §10).

Today Zinc hashes the *materialised* set of members named $n$ as seen from $C$, after linearization, overriding and `asSeenFrom`. That is *resolution, precomputed and hashed*:

$$h_C(n) = h\big(\mathrm{res}_C(n)\big)$$

The Merkle alternative composes the class's own declarations with its parents' hashes:

$$h'_C(n) = h\Big(\mathrm{decl}_C(n),\ \big\langle (P_i,\ \bar{T}_i,\ h'_{P_i}(n)) \big\rangle_{P_i \in \mathrm{parents}(C)}\Big)$$

```mermaid
flowchart BT
  subgraph TODAY["Today: members materialised per class"]
    A1["A: m, n"]
    B1["B extends A: m, n (copied), p"]
    C1["C extends B: m, n, p (copied), q"]
  end
  subgraph MERKLE["Merkle: decls + parent hashes"]
    A2["A: decls m, n"]
    B2["B: decl p + h(A)"]
    C2["C: decl q + h(B)"]
    C2 --> B2 --> A2
  end
```

<!-- break -->

- **Sound:** $\mathrm{res}_C(n)$ is a function of $C$'s own decls named $n$, its parents with their type arguments $\bar{T}_i$, and the parents' resolutions of $n$. With $h$ treated as injective, $h'_C(n) = h'_{C'}(n) \implies \mathrm{res}_C(n) = \mathrm{res}_{C'}(n)$.
- **Not complete:** inputs can change while $\mathrm{res}_C(n)$ doesn't, e.g. a parent's $n$ that $C$ overrides, or a type-argument change irrelevant to $n$. That gives a little more overcompilation, the *same direction* as every other Zinc approximation.
- **Cheap:** $O(\lvert\mathrm{decls}\rvert + \lvert\mathrm{parents}\rvert)$ per class, memoised per parent. No `asSeenFrom` of every inherited member, and no $\sum \lvert\mathrm{members}\rvert$ state.
- **Possible bonus (hypothesis, check against the invalidation logs):** if Zinc can re-evaluate $C$'s Merkle hash from stored ingredients when a parent changes, clients of $C$ that use $n$ can be invalidated in the *same* cycle as $C$. Today $C$ must first be recompiled to discover that its materialised API changed, which costs one extra cycle per hierarchy level.
- Zinc already uses this pattern for traits: `extraHash` "folds in the parents' later". So Merkle composition is an extension of existing practice, not a new idea.
- **Slogan:** *Merkle hashing is to member resolution what name hashing is to symbol resolution.* Both are sound, hash-based over-approximations that are cheaper than doing the resolution.

### 6. The hidden premise: separate compilation ≡ joint compilation

*(Tangent, but it underpins everything else.)*

An incremental compile **is** a separate compilation: $R$ is compiled from source against the *classfiles/TASTy* of $S \setminus R$. So $I \equiv C$ silently assumes, **byte for byte**:

$$C_{\mathrm{sep}}\big(R \mid \mathrm{out}(S \setminus R)\big) \equiv C_{\mathrm{joint}}(S)\big|_R$$

```mermaid
flowchart TB
  subgraph JOINT["Joint"]
    direction LR
    AS["A.scala"] --> J["compile {A, B}"]
    BS["B.scala"] --> J
    J --> BJ["B.class"]
  end
  subgraph SEP["Separate (= incremental)"]
    direction LR
    AS2["A.scala"] --> CA["compile A"] --> AC["A.class / A.tasty"]
    AC --> CB["compile B against A.class"]
    BS2["B.scala"] --> CB
    CB --> BSC["B.class"]
  end
  BJ -.-|"must be byte-identical"| BSC
```

<!-- break -->

- If that premise fails, the consequences are:
  - *spurious API diffs*, i.e. overcompilation that never converges ("recompiled `B` again, no source change");
  - *semantic* divergence: the program means something different depending on build history;
  - broken JAR-equivalence and remote caches (§21), because a Bazel cache hit and an sbt incremental build disagree on the bytes.
- **Why the two views differ in Scala:**
  - a symbol typed from source and a symbol unpickled from Scala signatures or TASTy are different objects. They differ in flags, completion order, inferred types, companion pairing and annotations;
  - Symbol ids leak into sort keys and fresh names (lambda-lift ordering by `Symbol.id`, [scala/scala3#7661](https://github.com/scala/scala3/issues/7661));
  - flags mutated by later phases leak into output: `InnerClass` access flags differed joint vs separate ([scala/bug#12085](https://github.com/scala/bug/issues/12085) → [scala/scala#9131](https://github.com/scala/scala/pull/9131));
  - still being found: TASTy sharing depends on type identity ([scala/scala3#26551](https://github.com/scala/scala3/issues/26551)); classfile member order and `InnerClasses` differ ([#26552](https://github.com/scala/scala3/issues/26552)); source-file order changes the result ([#10634](https://github.com/scala/scala3/issues/10634));
  - the backend's `companionSymbol` lookup observed stale classfiles ([scala/scala-dev#402](https://github.com/scala/scala-dev/issues/402));
  - reflective calls on structural types break under separate compilation ([scala/bug#11773](https://github.com/scala/bug/issues/11773)).

<!-- break -->

**Java interop multiplies the problem.** scalac has *two independent front ends for Java*, and they must agree:

```mermaid
flowchart LR
  JS["J.java"] --> JP["JavaParsers<br/>(signature-only parse)"] --> S1["Symbols for J<br/>(joint / mixed / pipelined)"]
  JS --> JC["javac"] --> CF["J.class"] --> CP["ClassfileParser"] --> S2["Symbols for J<br/>(separate)"]
  S1 -.-|"must agree"| S2
```

- Constants: `static final` fields not folded to `ConstantType` from source ([scala/bug#5333](https://github.com/scala/bug/issues/5333), [#10410](https://github.com/scala/bug/issues/10410), still open).
- Annotations parsed differently ([scala/bug#5699](https://github.com/scala/bug/issues/5699), [scala/scala3#10788](https://github.com/scala/scala3/issues/10788)).
- Typing differs: `T[]` overriding needs `Array[T with Object]` vs `Array[T]` depending on joint vs separate ([scala/bug#4390](https://github.com/scala/bug/issues/4390)); Java inner classes get path-dependent types only under joint compilation ([scala/bug#11569](https://github.com/scala/bug/issues/11569)); record varargs work separately but not jointly ([scala/scala3#24167](https://github.com/scala/scala3/issues/24167)).
- Every new Java language feature needs a `JavaParsers` port in *both* compilers: records ([scala/bug#11908](https://github.com/scala/bug/issues/11908), [scala/scala3#14846](https://github.com/scala/scala3/issues/14846)), sealed ([scala/bug#12159](https://github.com/scala/bug/issues/12159)), text blocks ([#12290](https://github.com/scala/bug/issues/12290)), value objects ([#13194](https://github.com/scala/bug/issues/13194), open).

<!-- break -->

- **Zinc makes the choice visible:** `CompileOrder` (`Mixed`, `JavaThenScala`, `ScalaThenJava`) chooses which Java view scalac sees. **Pipelining** (`-Ypickle-java`) *always* gives downstream the source view of Java, so pipelined and non-pipelined builds see different symbols for the same Java class.
- **The real invariant:** for every pos test, `compile({A,B})` and `compile(A); compile(B | A.class)` emit identical bytes for `B`, and the same holds with `A` in Java.
- Scala 2 made this a tested property in 2018 (§6a); Scala 3 has started enforcing it mechanically (`DeterminismTest`, [scala/scala3#26553](https://github.com/scala/scala3/pull/26553)).
- partest's `_1`/`_2` convention tests only that separate compilation *works*, not that it gives *identical* output.

#### 6a. Stability as a compiler property: scala-dev#405 and scala3#7661

The work behind [scala/scala-dev#405](https://github.com/scala/scala-dev/issues/405) ("Deterministic Compilation / Reproducible Builds", opened 2017, closed for 2.13.0-M5 in 2018) made the §6 premise an explicit, tested property of scalac. Its working definition of *stable*: the same bytes regardless of

- **source file order**: the order of files on the command line drives type-completion order in a joint compile, so anything sensitive to completion order leaks into the output;
- **partial compilation**: compiling subsets of files separately, file by file, against the others' classfiles. This is joint ≡ separate, the premise of every incremental build.

**Method** ([retronym/scalac-stability](https://github.com/retronym/scalac-stability)): hand-crafted test cases expected to be unstable, plus `scalac-stability-check.sh`, which compiles in normal order, in reverse order and file by file, then diffs the classes with [jardiff](https://github.com/scala/jardiff).

<!-- break -->

**What it found in scalac** (all fixed for 2.13.0-M5):

| Cause | Why the output varied |
|---|---|
| fresh names from per-compilation-unit counters | numbering followed type-completion order; now scoped to the enclosing user-written method |
| `LambdaLift` sorted symbol sets by `Symbol.id` | ids depend on completion order; now a linked set |
| default getters entered into scope as methods were completed | scope order followed completion order; now entered eagerly by the namer |
| parameter-alias computation across inheritance levels | a race between `setAlias` and `alias` during typer; moved after typer |
| mixed-in outer accessors took the mixed-in member's position | that position only exists in a joint compile |
| decl order not recorded in the pickle | mixin decl order differed between joint and separate compiles; the pickler now enters decls in order |
| refinement typing set the `OVERRIDE` flag late | inferred types copying the refinement saw the flag or not, depending on timing; now cleared on copies |

<!-- break -->

**Why users cared:** Bazel users sharing build artifacts through a distributed cache found that non-reproducible output "killed the cache". One team removed quasiquotes to improve hit rates (comment on #405).

**Scala 3 lags behind:**

- [scala/scala3#7661](https://github.com/scala/scala3/issues/7661) ("Fully deterministic compilation (stable compiler output under reordering and separate compilation)") was opened in 2019 as the counterpart to #405, quoting the scalac findings above, and is still open.
- Coverage was `IdempotencyTests` over a handful of `tests/order-idempotency` files.
- In 2026 a `DeterminismTest` ([#26553](https://github.com/scala/scala3/pull/26553)) checking classfile/TASTy stability under recompilation started finding more: TASTy sharing that depends on type identity ([#26551](https://github.com/scala/scala3/issues/26551)) and classfile member order / `InnerClasses` differing under separate compilation ([#26552](https://github.com/scala/scala3/issues/26552)).

<!-- break -->

**Why it belongs in a Zinc talk:**

- Every instability is a spurious API diff waiting to happen, i.e. overcompilation (§16(e)) that can cascade through extra rounds (§4).
- It breaks ABI-jar equivalence and remote caching (§21) for exactly the users who have moved past Zinc.
- Completion-order effects are the global-state back-channel that the purity assumption in the Lean model forbids (§22).

**Ask:** run the stability check (normal order, reverse order, file by file) over the community build for *both* compilers in CI, and treat a diff as a bug in the feature that introduced it.

## Part II — Three design choices worth arguing about: the shape of π, who hashes it, and what a "used name" is

*(Discussion section. Aim to provoke, not to conclude.)*

### 7. What ExtractAPI actually records

- A class's `Structure` (`xsbti.api.Structure`) has three parts, all rendered *as seen from* $C$:
  - `parents`: the *linearized* ancestor types;
  - `declared`;
  - `inherited` $= \mathrm{nonPrivateMembers} \setminus \mathrm{decls}$.

  Scala 2: `internal/compiler-bridge/.../ExtractAPI.scala` `mkStructureWithInherited`; Scala 3: `ExtractAPI.apiClassStructure`.
- Both the class's API hash (`HashAPI.hashStructure0`) and its name hashes cover `inherited`.
- It has been this way since 2009 (Mark Harrah, "linearization instead of parents and add inherited members for structure", [42c5d47b](https://github.com/scala/scala/commit/42c5d47b99f6d4ed215957d784934c3580c36968)).
- The code admits it in the doc comment: the class hash includes parents only by *name*, "so we must ensure changes propagate somehow", followed by a TODO asking whether parent hashes could be used instead.

### 8. Why it's done (what it buys)

- **Locality of dependencies:** a client of `c.m`, where `m` is inherited from `A`, depends on `C`'s API. A change to `A.m` shows up as a change to `C`, so no hierarchy walk is needed at invalidation time.
- **`asSeenFrom`:** in `class B extends A[Int]`, `def f: T` is observed as `f: Int`. Changing only `B`'s extends clause changes the members clients see, with no change to any decl.
- **Linearization:** adding an override in a mixin changes *which* member wins for `C`. A member-level view captures that; a decls-only view would have to recompute the linearization.

### 9. What it costs (what makes it non-local)

- **API(C) depends on C's whole ancestor closure.** Editing `A` changes the API hash and name hashes of *every* descendant. Each descendant then counts as "API changed", which drives another invalidation round over the descendants' clients.

```mermaid
flowchart BT
  B["B extends A"] --> A["A (edited)"]
  C["C extends B"] --> B
  D["D extends B"] --> B
  E["E extends C"] --> C
  UB["clients of B"] -.-> B
  UC["clients of C"] -.-> C
  UE["clients of E"] -.-> E
  classDef hot fill:#f6e4dc,stroke:#b4441f,color:#1d1d1f;
  class A,B,C,D,E hot;
```

- **Duplication of work:** inheritance invalidation is already transitive, so the same change gets re-detected N times, once per subclass. Invalidation logs become hard to explain ("why did `Z` recompile?" → because `Y`'s API changed → because `X` …).

<!-- break -->

- **Size:** state grows with $\sum_c \lvert\mathrm{members}(c)\rvert$, not $\sum_c \lvert\mathrm{decls}(c)\rvert$. Deep or wide hierarchies blow this up: collections, cake pattern, big framework traits, anything extending `java.util.AbstractList`. Analysis size, hashing and extraction time all scale with it.
  - `inherited` is `lazy` in the schema for this reason; laziness was removed and then reverted ([371b374d](https://github.com/scala/scala/commit/371b374db34ade9ef3af927e9b95094995202cf0) / [b9bd9ecb](https://github.com/scala/scala/commit/b9bd9ecb53fbb7209d0bddc033c8dc8cefdca6ec)).
- **Extraction cost on every run:** `members` plus `asSeenFrom` for each compiled class, including members from library parents that can only change when the library jar changes.
- **Overcompilation amplifier:** any nondeterminism in rendering an inherited member (unstable owners, refinement type params: [sbt/zinc#1782](https://github.com/sbt/zinc/pull/1782), [scala/bug#6596](https://github.com/scala/bug/issues/6596)) is multiplied across every subclass.
- Traits make it worse in a different way: trait bodies leak into subclasses (fields, super accessors, mixin forwarders), so there is a separate `extraHash` / "trait breakers" channel for subclasses.

### 10. Alternatives to put on the table

- **Merkle composition** (worked out in §5): $h'_C(n) = h(\mathrm{decl}_C(n), \langle (P_i, \bar{T}_i, h'_{P_i}(n)) \rangle)$.
  - The hash stays non-local, but the *storage* and *computation* become local and memoised. This is what the bridge's TODO suggests.
  - It is a sound over-approximation of today's materialised resolution.
  - Open questions: self-types and refinements as parents; library parents (treat their hash as a constant keyed by the jar stamp); whether per-name composition is precise enough for `asSeenFrom`-heavy code (type-argument changes now move every inherited name).
- **Decls-only + hierarchy-aware invalidation:** record each `memberRef` against the *declaring* owner and the *receiver* type. When `A.m` changes, walk subclasses at invalidation time, the way some other IC systems compute "affected subclasses" (verify Kotlin IC before claiming). This moves `asSeenFrom` and linearization concerns from extraction into the invalidator.
- **Hybrid:** decls-only for classes whose parents are library types (which change only by jar stamp), member-level within the module.

<!-- break -->

**Discussion questions:**

- Is member-level storage a *soundness* requirement or a *convenience*? Which scripted tests break under decls-only?
- What fraction of a real analysis file is `inherited`? (TODO: measure on scala/scala and on a large app before the talk; one number on a slide beats an argument.)
- Scala 3 has TASTy: could $\pi$ be derived from TASTy-level signatures plus a structural parent hash, making it shareable with IDEs and other build tools?

### 11. Who computes the hash? Bridge-side hashing vs projecting into xsbti.api

Today:

```mermaid
flowchart LR
  T1["compiler types"] --> P1["full xsbti.api tree<br/>(incl. inherited)"]
  P1 -- "api(file, classApi)" --> H1["Zinc hashes it"]
  H1 --> M1["minimize: keep a stub,<br/>discard the tree"]
```

Alternative:

```mermaid
flowchart LR
  T2["compiler types"] --> H2["bridge hashes directly,<br/>memoised per symbol"]
  H2 -- "opaque hashes" --> Z2["Zinc invalidator"]
  T2 -- "thin discovery callback" --> DSC["test discovery"]
```

**Today's pipeline** (`AnalysisCallback.api`, then `Incremental.scala`):

1. The bridge projects compiler types into a full `xsbti.api.ClassLike` tree: every member including inherited ones, as seen from the class, with lazy fields.
2. It hands the tree to Zinc via `api(sourceFile, classApi)`.
3. Zinc computes `HashAPI` (the API hash), `NameHashing` (name hashes, partitioned by `UseScope`), and the trait `extraHash` (parents folded in later, already Merkle-style). It sets the `hasMacro` and `isAnnotationDefinition` flags.
4. Zinc then *throws most of the tree away*. Unless `apiDebug` is set, `APIUtil.minimize` keeps a stub with the name, modifiers, annotations, `savedAnnotations`, sealed children, top-level flag and type parameters.
5. `AnalyzedClass` persists the hashes plus that stub.

So for every compiled class, on every run, we build a large object graph mainly so it can be hashed and discarded.

<!-- break -->

**Alternative:** the bridge computes `{apiHash, nameHashes, extraHash, flags}` directly over compiler symbols and types, and sends opaque hashes. Zinc's invalidator already works only on hashes.

**What it buys:**

- **No intermediate representation:** no allocation, laziness or interning of `xsbti.api` trees. (TODO: profile the `xsbt-api` phase and the callback on scala/scala with async-profiler to put a number on it.)
- **Hash what codegen actually sees:** include erased descriptors directly, which closes the §15b class of bugs *by construction* (§2: $\pi$ must determine $E$). Also inline bodies, sealed children and TASTy-level detail, without growing a cross-repo schema.
- **Memoise per symbol per run:** a parent's hash is computed once and reused by every subclass. That gives the Merkle composition of §10 without paying $\sum \lvert\mathrm{members}\rvert$.
- **Less drift (§18):** a new observable becomes a compiler-local change. Today it can need an `xsbti.api` schema change, MiMa review, a Zinc release and two bridge releases.
- **Smaller analysis, faster loads (§20).**

<!-- break -->

**What it costs:**

- **Collateral consumers of the stored API:**
  - test discovery: `xsbt.api.Discovery` walks the minimized `ClassLike` (annotations, parents, `savedAnnotations`) for sbt's `definedTests`;
  - explaining invalidations: `apiDebug`, `APIDiff`, `ShowAPI` "what changed?" diffs;
  - any external tool reading `Analysis.apis` (verify Bloop/Mill/IntelliJ).
- **Mitigations:**
  - a separate thin *discovery* callback (class name, kind, parent names, class/def annotations, main methods — `mainClass` is already a callback), or discovery from classfiles the way JUnit-platform scanners do it;
  - for debugging, the bridge emits a canonical *text rendering* behind a flag and hashes that text, so the diff stays free.
- **Hashing is no longer shared code:** two bridges plus Zinc's Java path (`ClassToAPI`) each hash. Mitigation: a tiny stable `Hasher` in `compiler-interface`, so the compiler decides *what* to hash and Zinc owns *how* hashes are mixed.
  - Producers needn't agree with each other: a class's hash is only ever compared with its own previous hash from the same producer. A compiler-version change already forces a full recompile (`MiniSetup`).
- **The name-hash contract must be written down:** the `UseScope` partition, sealed handling, private-member rules. Arguably a feature (§17, §23).
- **Zinc can no longer fix a hashing bug without a compiler release.** But extraction bugs, which already require one, dominate the bug history (Part IV).

<!-- break -->

**Variant: derive π from outputs, not internals.**

- Hash the classfile ABI (`ijar`-style descriptors, per member) plus the signature payload (Scala sig / TASTy signatures).
- This is compiler-agnostic and erasure-correct by construction. Zinc 2.x's `bytecodeHash` / `transitiveBytecodeHash` already lean this way, replacing timestamps.
- It still needs the compiler for $U(d)$ and for macro observation.

**The trade, stated for the room:** the `xsbti.api` tree is a *general* reflection of the type system that we pay for on every compile, while incremental compilation only needs a *hash* of it. If we optimise for incremental compilation alone, the tree is overhead, and test discovery should get its own narrow channel.

### 12. What is a "used name"? Name kinds and the key space of U

**What ExtractUsedNames records today** (Scala 2 bridge `ExtractUsedNames.scala`; Scala 3 `ExtractDependencies`):

- *Simple, decoded, unqualified* names, per using class, each tagged with a set of `UseScope`s (`Default`, `Implicit`, `PatMatTarget`).
- Names come from:
  - symbols in non-definition position;
  - **names of the types of trees**, including inferred ones (`types-in-used-names-*`, `as-seen-from-*` tests). That's why `C` "uses" `A` in §15b;
  - import selectors;
  - `TypeTree.original`;
  - pre-expansion macro trees (`OriginalTreeAttachments`);
  - pattern-match targets (`PatMatTarget`).
- Synthetic names are normalised: a constructor shows up as `A;init;` in the invalidation log.

<!-- break -->

**The invalidation key is a conjunction.** The name is not tied to its qualifier:

$$d \text{ invalidated by a change in } c \iff d \xrightarrow{\ \mathrm{memberRef}\ } c \ \wedge\ U(d) \cap \mathrm{changedNames}(c) \neq \emptyset$$

- If `d` depends on `c` for any reason and calls `.size` on *anything*, a change to `c.size` invalidates `d`.
- That is precision lost by design.

**Why simple names, not symbols?** Because the dangerous changes are *additions*, and you cannot record a dependency on a symbol that doesn't exist yet:

- a new overload `foo(Int)` changes the resolution of `foo(1)`, which used to pick `foo(Long)`;
- a new member shadows an import (§15a);
- a new override changes linearization (§8).

A name hash covers *all* definitions with that name in `c`, so adding one changes the hash. Simple names are the coarsest key that sees "something named `n` appeared or disappeared", which is a *negative lookup*.

<!-- break -->

**Name kinds: the conflations, and recent Zinc work:**

- **Class vs companion object.** `class A` and `object A` share one `AnalyzedClass`, and their name hashes are merged. Changing `class A.x` recompiles users of `object A.x` ([sbt/zinc#1796](https://github.com/sbt/zinc/issues/1796), open).
- **Inheritance edges had the same conflation:** `object B extends A` looked like `trait B extends A`, so a private change in `A` recompiled subclasses of `trait B` ([sbt/zinc#1795](https://github.com/sbt/zinc/issues/1795), fixed).
- **`AnalysisCallback4`** (commit 0a463347a) adds `ClassRef` (a name plus a `NameKind` of `Term` or `Type`) to dependency edges. It also adds a `usedName` overload carrying `qualifierKinds`: the namespace the name is *selected from* (class, object, or unknown, e.g. for an import selector). Zinc does not consume it yet; it is groundwork for #1796.
- **Still conflated:** whether the *referenced name itself* is a term or a type. A class mentioning only the type `A` is invalidated when the `object A` signature line changes. Cheap in practice, because each member has its own name hash and only the class/object header shares the name `A` (#1796, "related").

<!-- break -->

**The key-space ladder** (each rung is more precise and needs more from the compiler):

| Key | Example | Sound if… | Status |
|---|---|---|---|
| simple name | `x` | name hash covers all defs named `x` | today |
| name × `UseScope` | `x`@Implicit | scope-specific semantics are hashed separately | today (implicits → unconditional) |
| name × qualifier namespace | `x` from `object A` | companions get separate hashes | callback ready, Zinc pending (#1796) |
| name × referenced namespace | type `A` vs term `A` | term and type hashes are separated | open |
| (qualifier class, name) | `A#x` | *failed* lookups are recorded too (extension methods, implicit conversions: `a.foo` resolving elsewhere because `A` *lacks* `foo`) | not attempted |
| symbol | `A#x(I)J` | additions are impossible (closed world) | unsound for Scala |

<!-- break -->

**In the terms of §2 and §22:**

- $U(d)$ is the abstraction of $d$'s query trace, and the name kind is the *key type*.
- Coverage requires every lookup, including failed ones, to map to a recorded key. The qualified rungs are sound only if the compiler also records *misses*: "looked for `foo` in `A`, didn't find it, fell back to an extension". That is a new bridge obligation, and it is exactly where Scala's extension methods, implicit conversions and `Dynamic` make lookup non-local.
- Precision improves monotonically down the ladder, but each rung adds a coverage obligation that an extractor bug can silently violate, turning an overcompilation fix into an undercompilation bug.

**Discussion:**

- Which rung pays for itself? Measure the share of invalidations caused by name collisions on unrelated qualifiers (e.g. `size`, `apply`, `map`) in a large build's invalidation logs.
- Should "failed lookup" be a first-class recorded event in both compilers? It would also make implicit/extension invalidation precise instead of unconditional (§15a).

## Part III — How we got here, and how everyone else does it

### 13. History

Three lanes moved at different speeds: what Zinc computes, where the bridge lives, and how its state is stored. The table gives the dates; the next card picks out the four turning points the rest of the talk builds on.

| Year | Algorithm | Bridge | Persisted state |
|---|---|---|---|
| 2009 | API extraction, member-level `Structure` (Harrah) | compiled from source per Scala version | text format |
| 2013 | name hashing (Kossakowski) | | interned format (Pants) |
| 2016 | class-based dependency tracking | | |
| 2017 | Zinc 1.0 | `compiler-interface` as a Java API | protobuf, relocatable |
| 2020 | pipelining (early output) | Dotty owns its bridge | `VirtualFile` |
| 2023 | | Scala 2 bridge in-tree (2.13.12) | |
| 2024 | macro / inline invalidation fixes | | consistent format; hashes replace timestamps |
| 2026 | Zinc 2.x; companion / inheritance precision | `AnalysisCallback4` | interning fixes |

#### 13a. Four turning points

**1. From a compiler flag to a build-tool library (2008–2013).** scalac's own `-make` mode didn't hold up ("Incremental compilation is broken", [scala/bug#354](https://github.com/scala/bug/issues/354); Java/Scala dependencies, [scala/bug#2889](https://github.com/scala/bug/issues/2889)). Mark Harrah's sbt 0.7–0.10 moved the logic out of the compiler: an API-extraction phase, source-level invalidation, the member-level `Structure` that §7–10 question (2009), and a bridge compiled from source for each Scala version. A standalone Typesafe `zinc` (nailgun) then served Maven, Gradle and Pants.

**2. Precision, one refinement of π and U at a time (2013–2016).** Name hashing by Grzegorz Kossakowski ([`memberRef`/`inheritance`](https://github.com/sbt/zinc/commit/33635302cd73adbaf8c21476828bdae092610bc7), [algorithm](https://github.com/sbt/zinc/commit/e6c04434055657b679cbb50c2a1e6997a657b0f6)) split the API by name (§3). Class-based tracking ([sbt/zinc#86](https://github.com/sbt/zinc/pull/86)) shrank the graph's nodes from files to classes. It also produced the first feature-specific special case: sealed hierarchies needed [their own handling](https://github.com/scala/scala/commit/14a5784fad6537a42cf67ae355122d3462cac1e3) (§16(b)).

<!-- break -->

**3. Zinc as a product for other build tools (2017–2020).** Zinc 1.0 (Lightbend + Scala Center) gave build tools a Java API, protobuf analysis and relocatable, cacheable state ([#216](https://github.com/sbt/zinc/pull/216), [#218](https://github.com/sbt/zinc/issues/218)). `VirtualFile` ([#712](https://github.com/sbt/zinc/pull/712)) and build pipelining ([scalac `-Ypickle-java`](https://github.com/scala/scala/commit/b066d7e6402820879a970d6a88635018b8512dfe), [early output/analysis](https://github.com/scala/scala/commit/7b88ad4e5f2baba971a3461a45a19a090da319f1)) followed. That is the road to Part VI, where hermetic builds skip Zinc altogether.

**4. Ownership moves to the compilers (2020–2026).** Dotty shipped its own bridge from the start (`CompilerInterface2`, [scala/scala3#10607](https://github.com/scala/scala3/pull/10607)), and the Scala 2 bridge moved in-tree in 2.13.12 ([scala/scala#10472](https://github.com/scala/scala/pull/10472)). The consequences are Part V's drift risks. In parallel, state became deterministic (consistent format, [#1326](https://github.com/sbt/zinc/pull/1326); hashes instead of timestamps, [#1430](https://github.com/sbt/zinc/pull/1430); Scala 3 pipelining, [scala/scala3#18880](https://github.com/scala/scala3/pull/18880)). The 2025–26 wave of macro, pattern-match and determinism fixes (§15–16, Notes N1) is the latest chapter.

### 14. Prior art: everyone converged on the same three ideas

ABI summaries · fine-grained use tracking · content addressing.

| System | Summary ($\pi$) | Use tracking ($U$) | Notable |
|---|---|---|---|
| GHC | `.hi` interface fingerprints | per-entity usages | cross-module inlining → unfoldings are part of the interface |
| Kotlin IC | ABI snapshots | lookup tracker (scope, name) | near-isomorphic to name hashing; `inline fun` bodies are ABI |
| Swift driver | `.swiftdeps` | fine-grained provides/depends | same name-filtered fixed point |
| rustc | query fingerprints, red/green | query dependency graph | demand-driven rather than phase-driven |
| Gradle (Java) | class ABI | class-level | historically full recompile on constant change |
| Bazel / Buck | `ijar`/`hjar`, ABI jars | target-level | skip the compiler entirely if ABI bytes are equal |
| TypeScript | `.d.ts` / `.tsbuildinfo` | file + signature hash | project references |

<!-- break -->

**Best practices to extract:**

- Derive summaries from the **same typed trees codegen sees**.
- Make summaries **canonical**: no positions, fresh names or iteration order.
- Treat **cross-module inlining as ABI**.
- Use **content hashes, not timestamps**; make state **relocatable and reproducible**.
- Keep a **differential oracle** (incremental ≡ clean) in CI.
- Log *why* each unit was invalidated.
- Offer a **one-command bug report** for a user who just hit under- or overcompilation, capturing enough state to replay the build as a test (Notes N2).
- Members-vs-decls (§7–10) is a place where systems diverge. Worth a row in the table once verified.

## Part IV — Where it breaks: language features vs incrementality

### 15. Three worked examples: implicits, value classes, macros

One slide each. Show the code, ask the room "what must recompile?", then show what Zinc records and why. All examples come from Zinc's own scripted tests (`zinc/src/sbt-test/`).

**Moral of 14a–c:** in each case the client's compiled output depends on information *not reachable from the names it wrote*. Implicit scope, erased representation and macro observation are the three big leaks, and each needed a special channel bolted onto name hashing.

#### 15a. Implicits: resolution depends on names you never wrote

*Shadowing* (`source-dependencies/implicit-search`):

```scala
// B.scala
object B { implicit val x: Ordering[Int] = ??? }
// A.scala  v1: object A        v2: object A { val x = 1 }
// C.scala
object C { import A._, B._; implicitly[Ordering[Int]] }
```

- Adding an *unrelated, non-implicit* `val x` to `A` shadows `B.x` in `C`'s scope. The implicit is no longer eligible, so resolution silently falls back to `Ordering.Int`, and `C`'s behaviour changes (`???` stops throwing).
- Likely mechanism (verify with the invalidation log): `C`'s used names include `x`, the name of the implicit it selected. Eligibility is name-based, so name hashing happens to model it.

<!-- break -->

*Implicit scope through the type hierarchy* (`companion-object-implicit-scope`):

```scala
trait A; object A { implicit val sad: Pretty[A] = ... }
trait B extends A
class D extends B
object User { implicitly[Pretty[A]].show(new D) }
```

- `User` reaches `A`'s companion through implicit scope; adding an ordinary `def y` to `object A` recompiles 0 files, as it should.
- Removing `sad` must break `User`.

*Modifier as API* (`implicit-params`): making `(implicit y: E)` explicit must break the call site `x(3)`.

<!-- break -->

**What Zinc does:** implicit members get their own name hashes (`UseScope.Implicit`), and **any** change to an implicit member invalidates **all** `memberRef` clients of that class, with no name filtering (`MemberRefInvalidator`).

- That is sound only for classes the client already depends on. The *negative* case is open: a client whose resolution would change because a *new, better* candidate appears somewhere it never referenced. Removing `implicit` isn't noticed ([sbt/zinc#945](https://github.com/sbt/zinc/issues/945)); Scala 3 constructor implicits ([scala/scala3#18309](https://github.com/scala/scala3/issues/18309)).
- Scala 3 `given`s, `using` clauses, and `given` imports (`import A.given`) make implicit scope larger and more structured. Same problem, more surface.

#### 15b. Value classes: erasure makes representation observable

`source-dependencies/value-class-underlying`:

```scala
class A(val x: Int) extends AnyVal      // → class A(val x: Double) extends AnyVal
object B { def foo: A = new A(0) }
object C { val duck = B.foo; println(duck) }
```

- At Scala level, `B`'s API is unchanged (`foo: A`); `B.scala` isn't even edited. At the JVM level, `B.foo()I` becomes `B.foo()D`. `C`'s bytecode still calls the old descriptor, so it fails with `NoSuchMethodError`.

```mermaid
flowchart LR
  C["C.class<br/>invokes B.foo()I"] -- "memberRef: foo" --> B["B.foo : A<br/>(Scala signature unchanged)"]
  B -- "descriptor = E(A)" --> A["A extends AnyVal<br/>underlying: Int → Double"]
  C -. "observes E(A) = E(underlying(A))<br/>without naming x" .-> A
```

<!-- break -->

**In the terms of §2:** $C$'s output contains the descriptor of `B.foo`, so $C$ observes $f(A) = \mathrm{underlying}(A)$:

$$E(\mathrm{sig}_B(\mathit{foo})) = E(A) = E(\mathrm{underlying}(A))$$

- $\pi(B)$ is unchanged, which makes this a counterexample to soundness if $C$'s dependency is keyed only on `B.foo`.
- The observation reaches $A$ *through* $B$'s signature, but it is about $A$'s contents, not about any member of $A$ that $C$ names. $C$ never mentions `x`.

**Fix:** make $\pi(A)$, under the *name* `A`, determine $E(A)$. ExtractAPI adds the underlying type to a value class's ancestor types (comment in `mkStructureWithInherited`), so the hash for name `A` changes.

- This relies on `C` "using" the name `A`. It does, because used names come from *typed* trees, so the inferred type of `duck` counts.
- The expected invalidation log: cycle 1 detects modified names `A`, `A;init;`, `x`; `B` and `C` are both invalidated because both use name `A`; cycle 2 finds nothing further.

<!-- break -->

- `source-dependencies/value-class`: toggling `extends AnyVal` on/off changes erased signatures of every method mentioning `A`. One case flips `null` from legal to illegal (`-> compile` expected); another is a pure binary change that must recompile to *run*.
- **General lesson:** $\pi$ is a *Scala-level* summary, but clients link against *JVM-level* descriptors. Anything that changes erasure without changing the Scala signature needs a hook: value classes, opaque types (do they? discuss), `@specialized`, SAM vs non-SAM, varargs, Java generic signatures.

#### 15c. Macros: the expansion depends on whatever the macro looked at

*Macro inspects a type argument* (`macros/macro-type-change`):

```scala
def hasAnyField[T]: Boolean = macro hasAnyFieldImpl[T]   // reads weakTypeOf[T].members
class A                       // → class A { val hello = "" }
Macros.hasAnyField[A]         // false → must become true
```

- The client names only `A` as a type argument. The macro read `A.members`.
- Fixed by recording type arguments of macro calls as `DependencyByMacroExpansion` ([sbt/zinc#1316](https://github.com/sbt/zinc/pull/1316); Scala 3 port [scala/scala3#23900](https://github.com/scala/scala3/pull/23900)).
- That new edge kind was then silently dropped by the new analysis format until [#1432](https://github.com/sbt/zinc/pull/1432).

```mermaid
flowchart LR
  APP["App: hasAnyField[A]"] -- "memberRef: hasAnyField" --> M["Macros"]
  APP -- "DependencyByMacroExpansion<br/>(type argument)" --> A["A"]
  M -. "expansion reads A.members" .-> A
```

<!-- break -->

*Macro erases its argument's dependency* (`macros/macro-arg-dep`):

```scala
def printTree(arg: Any): String = macro ...   // expands to Literal(arg.tree.toString)
object Client { Provider.printTree(Foo.str) }  // remove Foo.str → Client must fail
```

- After expansion, the tree is a string literal, and the reference to `Foo.str` is *gone*. Dependency extraction must traverse the pre-expansion tree (the macro-expansion attachment), not only what typer left.

*The macro implementation changes:* any change in a file that declares a macro invalidates all clients unconditionally. Clients of a macro defined upstream additionally recompile transitively ([warning + opt-out](https://github.com/sbt/zinc/commit/083b432e9bbd91d5ae8ab4a227b85ccdfdef8e42)), which is sound but expensive ([sbt/zinc#1333](https://github.com/sbt/zinc/issues/1333)).

<!-- break -->

*Scala 3* (quotes reflection can walk anything):

- `macwire`'s `wire[Dep]` reads `Dep`'s constructor; changing it isn't detected ([sbt/zinc#1574](https://github.com/sbt/zinc/issues/1574), [scala/scala3#23852](https://github.com/scala/scala3/issues/23852), [#24969](https://github.com/scala/scala3/pull/24969)).
- Macro annotations' `transform` isn't tracked ([#22999](https://github.com/scala/scala3/issues/22999)).
- Feature request: "make Zinc Scala 3 macro-aware" ([sbt/zinc#1478](https://github.com/sbt/zinc/issues/1478)).

**Discussion:** the principled answer is to **record every symbol the macro observes** by instrumenting `Context`/`Quotes` reflection, and emit those as dependencies of the expansion site. This is a compiler-side change that only the compiler teams can make.

### 16. A taxonomy (organise by kind of observable, not by feature)

**(a) Bodies that are API** — the client's bytecode embeds the implementation.

- Scala 3 `inline`: nested inline calls missed ([scala/scala3#11861](https://github.com/scala/scala3/issues/11861) → [#12931](https://github.com/scala/scala3/pull/12931)); inherited inline defs overcompiled ([62dfdaf6](https://github.com/scala/scala3/commit/62dfdaf6226db9cc4ef42b4534a4fe4904b9fda6)).
- Scala 2 `@inline` + `-opt:inline`: broken from 2018 to 2023 ([sbt/zinc#537](https://github.com/sbt/zinc/issues/537) → [#1310](https://github.com/sbt/zinc/pull/1310)).
- Constant folding (`final val`, Java `static final`).
- Trait bodies mixed into subclasses (`extraHash`).

**(b) Non-local or negative information** — meaning depends on what *else* exists, or on what *doesn't*.

- Sealed children determine exhaustivity; `useOptimizedSealed` broken on 2.13 ([sbt/zinc#1229](https://github.com/sbt/zinc/issues/1229)).
- Implicit/given resolution observes shadowing, implicit scope and the *absence* of a better candidate (§15a).
- Pattern matching observes `unapply` shape and arity: [scala/scala3#26231](https://github.com/scala/scala3/issues/26231) undercompiled in *every* Scala 3 version, giving `NoSuchMethodError` ([#26262](https://github.com/scala/scala3/pull/26262), 3.10.0-RC1).
- SAM conversion adds an inheritance edge the source never spells out ([sbt/zinc#830](https://github.com/sbt/zinc/issues/830) → [scala/scala#10617](https://github.com/scala/scala/pull/10617), [scala/scala3#16996](https://github.com/scala/scala3/pull/16996)).
- Inherited members (§7–10) belong in this category too, and are the *reason* $\pi$ is member-level.

<!-- break -->

**(c) Generated code** — the expansion depends on things the call site never names.

- Macros, def and annotation, Scala 2 and 3 (§15c).

**(d) Synthetic owners** — definitions that don't map 1:1 to source classes.

- Exports ([scala/scala3#11841](https://github.com/scala/scala3/issues/11841)), top-level defs ([#18447](https://github.com/scala/scala3/issues/18447), [#13994](https://github.com/scala/scala3/issues/13994)), package objects, companion pairing.

**(e) Nondeterminism** — $\pi$ changes when nothing observable did (overcompilation).

- Context-bound evidence names ([scala/scala3#19132](https://github.com/scala/scala3/pull/19132)), refinement owners ([sbt/zinc#1782](https://github.com/sbt/zinc/pull/1782)), [scala/scala3#26434](https://github.com/scala/scala3/issues/26434), [#25520](https://github.com/scala/scala3/issues/25520), whitespace changing line numbers ([sbt/zinc#718](https://github.com/sbt/zinc/issues/718)).

**(e′) Erasure and representation** — the JVM descriptor changes while the Scala signature doesn't: value classes (§15b), `@specialized`, varargs, Java generic signatures.

**(f) Cross-language and pipelining** — the two Java front ends (§6); Java sources invalidated every cycle ([#918](https://github.com/sbt/zinc/issues/918), [#867](https://github.com/sbt/zinc/issues/867), [#1819](https://github.com/sbt/zinc/issues/1819)).

**(g) The compiler itself isn't robust to incremental inputs** — stale-symbol crashes ([scala/scala3#17152](https://github.com/scala/scala3/issues/17152), [#13532](https://github.com/scala/scala3/issues/13532)).

### 17. Incrementality is the forgotten dimension of feature design

- A SIP or feature PR covers syntax, typing, erasure, binary compatibility and TASTy compatibility, but never "which new observables does this introduce, and where are they hashed?"
- **Time-to-fix as evidence:** `@inline` + optimizer took 5 years; refinement-owner instability was open for years; Scala 3 patmat existed since 3.0 and was found in 2026.
- **Who finds these:** users of large builds and IDE vendors (IntelliJ runs Zinc in its IC tests, [scala/scala3#21179](https://github.com/scala/scala3/issues/21179)), not feature authors.
- **MiMa analogy:** MiMa made "is this binary compatible?" a mechanical PR-time check. We can do the same for incremental soundness.
- **Determinism is a shared precondition:** unstable synthetic names are both overcompilation bugs and reproducible-build bugs ([scala/scala-dev#405](https://github.com/scala/scala-dev/issues/405)).

## Part V — The machinery we maintain

### 18. The compiler bridge: architecture, relocation, drift

```mermaid
flowchart TB
  subgraph ZINC["sbt/zinc"]
    CI["compiler-interface<br/>(Java xsbti.*, MiMa-checked)"]
    ZC["zinc-core: invalidator, Analysis"]
    ZB["compiler-bridge for Scala ≤ 2.13.11"]
  end
  subgraph S2["scala/scala"]
    B2["scala2-sbt-bridge (2.13.12+)"]
  end
  subgraph S3["scala/scala3"]
    B3["scala3-sbt-bridge"]
  end
  ZB -- implements --> CI
  B2 -- implements --> CI
  B3 -- implements --> CI
  ZC -- "loads bridge into the<br/>compiler's classloader" --> B2
  ZC --> B3
  ZC --> ZB
```

- **Architecture:** `compiler-interface` (Java `xsbti.*`, stable, MiMa-checked) ⟵ *bridge* (compiler-specific: extraction phases + callbacks) ⟵ loaded by Zinc into the compiler's classloader. Originally Zinc shipped bridge *sources* and compiled them on first use per Scala version.

<!-- break -->

**Relocation:**

- 2016: [sbt/zinc#78](https://github.com/sbt/zinc/issues/78) proposes splitting interface and bridge out.
- 2019: first in-tree attempt closed for lack of motivation ([scala/scala#8531](https://github.com/scala/scala/pull/8531)).
- 2020: Scala 3's bridge is in-tree from the start.
- 2023: [scala/scala#10472](https://github.com/scala/scala/pull/10472). Code actions/quick fixes needed lock-step bridge changes; history kept via filter-branch ([80e8df93](https://github.com/scala/scala/commit/80e8df93f854e8bb5ba7971c2af4d85671ccda08)); precompiled bridge ships with 2.13.12 ([forum](https://contributors.scala-lang.org/t/scala-2-13-12-in-source-sbt-compiler-bridge-clarifications/6289)).
- Porting the scripted tests ([scala/scala#10554](https://github.com/scala/scala/pull/10554)) immediately found a missing invalidation ([scala/bug#12887](https://github.com/scala/bug/issues/12887) → [sbt/zinc#1268](https://github.com/sbt/zinc/issues/1268)).

**Benefits:** the bridge evolves with compiler internals; no compile-on-first-use; the people who own the language also own $\pi$.

<!-- break -->

**Drift risks:**

- **Three bridges** (Zinc's for ≤ 2.13.11, scala/scala's, scala3's) and three copies of the scripted suite. Fixes land in one place:
  - forward-ports ([scala/scala#10542](https://github.com/scala/scala/pull/10542));
  - Zinc PRs now carry "may also need to be applied in scala/scala and scala/scala3" ([#1782](https://github.com/sbt/zinc/pull/1782));
  - a live example: forward-porting five Zinc bridge fixes (#1316, #1324, #1507, #1782, #1803) to `scala2-sbt-bridge` ([scala/scala#11287](https://github.com/scala/scala/pull/11287), open), while the same batch is backported to Zinc 1.x ([sbt/zinc#1838](https://github.com/sbt/zinc/pull/1838), [#1839](https://github.com/sbt/zinc/pull/1839)). One fix, four branches.
- **Version matrix** (Zinc × compiler). New `xsbti` APIs must degrade on old Zinc (the lazy `DiagnosticCode` trick, [scala/scala3#15565](https://github.com/scala/scala3/pull/15565); `CompilerInterface` vs `CompilerInterface2`, [#10816](https://github.com/scala/scala3/issues/10816)).
- **Implicit protocol:** callback ordering and completeness are unwritten (`dependencyPhaseCompleted` under pipelining, [scala/scala3#27139](https://github.com/scala/scala3/issues/27139) / [sbt/zinc#1823](https://github.com/sbt/zinc/pull/1823); `generatedNonLocalClass` regression breaking IntelliJ, [#21179](https://github.com/scala/scala3/issues/21179)).
- **Release coupling:** a bridge fix reaches users only with the next compiler release. Users on an old compiler never get it, even with a new sbt.
- **Packaging:** `scala3-sbt-bridge` was published depending on a never-published compiler ([scala/scala3#23604](https://github.com/scala/scala3/issues/23604)).
- **Design decisions get frozen:** members-vs-decls (§7–10) now needs coordinated changes in three repos plus Zinc's hashing.

<!-- break -->

**Mitigations:**

- Zinc runs its scripted suite against the *released* in-tree bridges, selected by label, with provenance checks ([sbt/zinc#1837](https://github.com/sbt/zinc/pull/1837)).
- One canonical scripted corpus consumed by all three repos, instead of forks.
- Specify the callback protocol (ordering, mandatory callbacks per phase) and add a conformance test.

### 19. How Zinc is tested, and where the oracle is weak

- **Scripted** (`zinc/src/sbt-test/`): ~170 `source-dependencies/*` plus `macros`, `pipelining`, `apiinfo`, `reporter`. File swaps, `> compile`, `> checkRecompilations n A B`, `-> compile`. The oracle is hand-written expected recompile sets.
- **Bridge unit tests:** compile snippets, assert on extracted API, used names and class names; Hedgehog properties for analysis invariants.
- **Cross-version bridge tests:** rerun whenever a bridge changes.
- **Benchmarks:** `zinc-benchmarks`, including `AnalysisFormatBenchmark`.
- **Downstream:** scala/scala `sbtTest/scripted`, scala3 `sbt-test/` and `IncrementalCompileSimulator` ([#26262](https://github.com/scala/scala3/pull/26262)), IntelliJ IC tests, community build.

<!-- break -->

- **Weakness:** scripted checks *how much* was recompiled, not *that the result equals a clean build*.
- **Where bugs come from:** field reports from large builds, and lately LLM-driven exploration. Many of the autumn 2026 batch were found by LLM agents writing probing scripted tests (Notes N1). Field reports are hard to turn into tests because the user's pre-change state is gone (Notes N2).
- **Proposals:**
  - After every scripted step, also clean-build and compare outputs (differential testing).
  - Generate edit sequences by mutating upstream APIs (property-based or fuzzed), relying on deterministic output.
  - Generalise the Scala 3 simulator so feature authors can write `v1/v2/client` tests next to the feature.

| Era | Format | Notes |

| sbt 0.13 | text + sbinary/Java-serialization shortcuts | slow, nondeterministic |

From #1326 (scala-library + reflect + compiler):

| Format | Write | Read | Size |
|---|---|---|---|
| sbt text | 1002 ms | 791 ms | ~7.1 MB |
| sbt binary (protobuf) | 654 ms | 277 ms | ~6.2 MB |
| Consistent binary | 157 ms | 100 ms | 3.1 MB |

- **Why read time matters:** on no-op and one-file builds, loading every module's analysis is the critical path. This is the *common* case.

## Part VI — The cheapest incremental compile is the one you skip

### 21. Layers of avoidance

```mermaid
flowchart LR
  IN["Build request"] --> L1{"Action cache hit?<br/>(content-addressed inputs)"}
  L1 -- yes --> DONE["Nothing runs"]
  L1 -- no --> L2{"Upstream ABI jar<br/>byte-identical?"}
  L2 -- yes --> DONE2["Skip module,<br/>don't even load Analysis"]
  L2 -- no --> L3["Zinc: compile a few files"]
```

- **Don't run** (action-cache hit) ⊃ **don't compile the module** (ABI unchanged) ⊃ **compile a few files** (Zinc).
- **Hermetic builds** (Bazel, Pants, sbt 2 remote cache): inputs are content-addressed (sources + dependency ABI jars + flags). A hit means no Zinc at all.

<!-- break -->

- **JAR-equivalence / ABI jars:** if upstream's ABI jar (pickles/TASTy-only, Zinc early output, Bazel `ijar`) is byte-identical, downstream is skipped without even loading its analysis. This requires:
  - reproducible compiler output ([scala/scala-dev#405](https://github.com/scala/scala-dev/issues/405); absolute paths under `-Xcheckinit`, [scala/bug#12698](https://github.com/scala/bug/issues/12698)), including joint ≡ separate (§6);
  - reproducible jars (timestamps, entry order);
  - reproducible, machine-independent analysis ([#218](https://github.com/sbt/zinc/issues/218), `WriteMapper`, `VirtualFile`, hashes instead of timestamps). The consistent format was built for this: identical state gives identical bytes, so Bazel can skip ([#1326](https://github.com/sbt/zinc/pull/1326); author reports ~27k Bazel targets using it).
- **Pipelining:** downstream starts on upstream pickles before codegen; early analysis lets downstream name-hash against it.
- **Where Zinc still matters:** large single targets, IDE/BSP loops, the inner dev loop. There, $\pi$'s precision (and its size, §9) is what users feel.

## Part VII — Can we prove it? Towards a mechanised model (Lean)

### 22. Formalising incremental compilation

**Is there scope?** Yes, provided we prove Zinc's algorithm sound *relative to stated obligations on the compiler*, rather than verifying scalac. That is the useful deliverable anyway: the hypotheses of the theorem *are* the bridge spec that §17 and §23 ask for.

```mermaid
flowchart TB
  U["Unit d"] --> F["F_d : (Query → Answer) → Out"]
  F -- "queries: lookup, members,<br/>erasure, implicits, sealed,<br/>inline body, macro observe" --> ENV["Env = iface(outputs of others)"]
  ENV -- answers --> F
  F --> O["Out"]
  F -. "trace abstracted to keys" .-> UK["U(d) ⊆ Key"]
  ENV -. "answers hashed per key" .-> PI["π : Class → Key → Hash"]
```

<!-- break -->

**The model of the compiler we need:**

1. **Compilation units with an explicit environment.** $\mathit{compile} : \mathit{Unit} \to \mathit{Env} \to \mathit{Out}$, where $\mathit{Env}$ is the *interface* view of everything else, derived from outputs: $\mathrm{iface} : \mathit{Out} \to \mathit{Env}$. This makes separate compilation a definable notion.
2. **Compositionality axiom (§6).** Mutually recursive units compile as one group; Zinc already compiles each invalidated set together. In the Lean encoding, joint compilation is a black box characterised as a fixed point of the per-unit tasks, each seeing its group-mates' fresh outputs. Every §6 bug is a violation of this axiom, so stating it is half the value:

$$\mathit{compile}_{\mathrm{joint}}(S)\big|_R = \mathit{compile}_{\mathrm{sep}}\Big(R,\ \mathrm{iface}\big(\mathit{compile}_{\mathrm{joint}}(S \setminus R)\big)\Big)$$

3. **Purity.** The output is a function of the unit and the environment *answers* only: no `Symbol.id`, iteration order or other global state (§16(e)). Scala 2's mutable global symbol table is precisely a back-channel the model forbids. Stale-symbol crashes are what that back-channel looks like in practice.

<!-- break -->

4. **A query interface (the key modelling choice).** The compiler touches $\mathit{Env}$ only through typed queries:
   - `lookup(scope, name)`;
   - `members(C)` / `decls(C)` / `parents(C)`;
   - `erasure(T)`;
   - `implicitCandidates(type, scope)`;
   - `sealedChildren(C)`;
   - `inlineBody(m)`;
   - `macroObserve(sym)`.

   Model compilation as a monadic task with dynamic dependencies, where queries can depend on previous answers. This is the *Build Systems à la Carte* framing (Mokhov, Mitchell, Peyton Jones, ICFP 2018), applied *inside* the compiler:

$$F_d : (\mathit{Query} \to \mathit{Answer}) \to \mathit{Out}$$

5. **Recorded keys.** The bridge records an abstraction of the query trace, $U(d) \subseteq \mathit{Key}$, and the API summary $\pi : \mathit{Class} \to \mathit{Key} \to \mathit{Hash}$.

<!-- break -->

**Theorems:**

- **T1 (trace soundness, essentially free):** proof by induction on the task's query sequence. This is the "verifying traces" result.

$$\big(\forall q \in \mathrm{trace}(F_d, e).\ e(q) = e'(q)\big) \implies F_d\, e = F_d\, e'$$

- **T2 (Zinc soundness)** follows from two obligations on the bridge.
  - **Coverage:** every query $d$ issues is covered by some recorded key. This includes *negative* queries (implicit search keyed on the scope, not the name; §15a) and *closure* queries (`erasure(A)` keyed on `(A, repr)`; §15b):

$$\forall q \in \mathrm{trace}(F_d).\ \exists k \in U(d).\ q \sqsubseteq k$$

  - **Abstraction:** equal hashes imply equal answers. Hashes are treated as injective, or collision-freedom is carried as a hypothesis:

$$\pi(c)(k) = \pi(c')(k) \implies \forall q \sqsubseteq k.\ \mathrm{ans}_q(c) = \mathrm{ans}_q(c')$$

<!-- break -->

- **T3 (fixed point)** needs an extra hypothesis. Termination yields a fixed point of *separate* compilation per unit. The clean build is *a* fixed point too, but under mutual recursion through inferred types they need not coincide:

```scala
object A { def x = B.y }   // typeof(A.x) = typeof(B.y)
object B { def y = A.x }   // typeof(B.y) = typeof(A.x)
```

  Separate compilation can settle on interfaces that a joint compile wouldn't produce. This is the territory behind [sbt/zinc#1284](https://github.com/sbt/zinc/pull/1284), "include mutual dependency in initial invalidation", later reverted ([#1462](https://github.com/sbt/zinc/pull/1462)). Either of two sufficient conditions, each an existing Scala practice, restores T3:
  - **acyclic unit dependencies**; or
  - **source-determined interfaces**: explicit result types on public members, so a unit's interface doesn't depend on its dependencies' bodies. This also bounds the loop at two rounds.
- **Termination is per policy.** The invalidation policy is a *parameter* of the model with a single obligation, $\mathit{next} \supseteq \mathrm{inv}(\Delta) \setminus R_n$. Soundness then holds for every heuristic Zinc uses. Termination holds by monotonicity in the `transitiveStep` regime (§4), or needs acyclicity in the plain regime.
- **Overcompilation as a theorem about precision:** a minimality statement relative to $\pi$ (no unit outside $R$ has a changed covered key) is the formal version of "no spurious invalidations". §5's table lists where Zinc deliberately gives this up.

**What the model makes crisp:**

- **Members vs decls (§7–10)** becomes a question about *which query keys the compiler issues*: `members(C)` keyed on `C`, or `decls(P)` for each ancestor plus `parents(C)`. Both are sound if $U$ records the matching keys; they differ only in precision and cost.
- **Name kinds (§12)** are the *key type* of the trace abstraction. Each rung of the ladder trades precision against a stronger coverage obligation (record misses).
- **Bridge-side hashing (§11)** is the natural reading: the compiler supplies $\pi(c)(k)$ directly as a hash of the answer to the queries $k$ covers.
- **Macros (§15c):** `macroObserve` queries must be recorded; "invalidate all clients" is the coarsest sound key, $\top$.
- **Joint ≡ separate (§6)** is the compositionality axiom. Determinism is purity.

<!-- break -->

**A Lean 4 plan:**

1. An abstract model: a few hundred lines. Tasks are a free monad, so the query trace is data T1 can induct over. The invalidation policy is a parameter. The loop is fuelled, so the toy examples run by `decide`.
2. Instantiate it on a toy object language with classes, inheritance, type-directed implicit lookup and an erasure function with value classes.
3. State the §15 examples as Lean `example`s. *Counterexamples* show that name-only keys are unsound for value classes and for implicit addition; repaired keys yield proofs. Each counterexample doubles as a scripted test.
4. Optional: connect to reality by checking the bridge's *recorded* keys against a query log instrumented in the real compiler. That is differential testing (§19) with the formal model as the oracle.

**Prior art to cite (verify the references before the talk):**

- *Build Systems à la Carte* — traces, minimality, early cutoff.
- Adapton (Hammer et al., PLDI 2014) and Salsa / rustc's query system — demand-driven incremental computation.
- Incremental λ-calculus / "A theory of changes for higher-order languages" (Cai, Giarrusso, Rendel, Ostermann, PLDI 2014).
- "What is Java binary compatibility?" (Drossopoulou, Wragg, Eisenbach, OOPSLA 1998) — descriptors and linking, the §15b world.
- CompCert's separate-compilation correctness work (Kang et al., POPL 2016) — the compositionality axiom, proved for C.

**Honest limits:**

- The model proves the *algorithm* sound given the obligations. It says nothing about whether scalac/dotc meet them; that remains a testing problem.
- The value is in turning tribal knowledge ("implicits invalidate unconditionally", "value classes fold their underlying type into ancestors") into named hypotheses that a feature author must discharge (§17).

### 23. Asks

1. An **incremental-compilation item in the SIP / feature-PR template:** what new observables, where hashed, which test.
2. **Differential tests** (incremental ≡ clean) in compiler CI, with a `v1/v2/client` harness next to the feature tests.

4. **Determinism as a first-class requirement**, including **joint ≡ separate, byte for byte** (Scala and Java dependencies alike), checked over the whole pos test suite. It pays three times: overcompilation, reproducible builds, cache hits.
5. **Revisit π's shape** (members vs decls, Merkle parent hashes, a TASTy-derived summary), and measure before deciding.

6. **Record failed lookups** in both compilers, so qualified used-name keys (§12) and precise implicit/extension invalidation become possible.

### 24. Questions to leave the room with

- Should $\pi$ be *specified* (like TASTy) rather than "whatever ExtractAPI does"?
- Is member-level $\pi$ a soundness requirement or an implementation convenience?
- Could IDEs (Metals, IntelliJ's bytecode-based IC) and build tools share one summary format?
- Should macro APIs (`Context`, `Quotes`) record what a macro observes, so that macro dependencies are exact rather than "invalidate everything"?

### N1. The autumn 2026 fix wave, and LLMs as bug finders

Lukas Rytz and Jason Zaugg, roughly June–October 2026. Many of these already appear as examples above; the list is the raw material for a "what we found this year" slide.

**Undercompilation:**

- Scala 3 pattern match after case class/extractor change → `NoSuchMethodError`, in every Scala 3 version ([scala/scala3#26231](https://github.com/scala/scala3/issues/26231) → [#26262](https://github.com/scala/scala3/pull/26262)). Came with `IncrementalCompileSimulator`.
- Pipelining: a run can end before early TASTy is written, dropping Zinc callbacks ([scala/scala3#27139](https://github.com/scala/scala3/issues/27139)); `dependencyPhaseCompleted` was called before dependencies were sent ([#27125](https://github.com/scala/scala3/issues/27125)); Zinc now waits and announces "no early output" ([sbt/zinc#1822](https://github.com/sbt/zinc/pull/1822), [#1823](https://github.com/sbt/zinc/pull/1823), [#1817](https://github.com/sbt/zinc/pull/1817)).
- With `-Xjava-tasty`, dependencies of Java sources weren't sent to Zinc ([scala/scala3#27133](https://github.com/scala/scala3/issues/27133)).

<!-- break -->

**Overcompilation:**

- A comment-only edit to a trait recompiled its heirs ([sbt/zinc#1794](https://github.com/sbt/zinc/issues/1794) → [#1799](https://github.com/sbt/zinc/pull/1799)).
- Adding a member to an object recompiled classes inheriting its companion trait ([#1793](https://github.com/sbt/zinc/issues/1793) → [#1801](https://github.com/sbt/zinc/pull/1801)).
- A compound type in a member signature was recorded as inheritance ([#1798](https://github.com/sbt/zinc/issues/1798) → [#1803](https://github.com/sbt/zinc/pull/1803)).
- A private change in a trait recompiled classes that don't inherit it, from object/trait conflation ([#1795](https://github.com/sbt/zinc/issues/1795) → [#1807](https://github.com/sbt/zinc/pull/1807), `AnalysisCallback4`); the class/companion name-hash merge is still open ([#1796](https://github.com/sbt/zinc/issues/1796)). See §12.
- Trait `extraHash` over-invalidations ([#1787](https://github.com/sbt/zinc/pull/1787)); refinement-owned type params ([#1782](https://github.com/sbt/zinc/pull/1782)).
- Pipelining: any change recompiled everything depending on a Java class ([#1819](https://github.com/sbt/zinc/issues/1819) → [#1821](https://github.com/sbt/zinc/pull/1821)); a trait with a parent recompiled all heirs under Scala 3 ([#1820](https://github.com/sbt/zinc/issues/1820)).
- Intermittent overcompilation from `Symbol.copy` ignoring its compilation unit ([scala/scala3#25520](https://github.com/scala/scala3/issues/25520) → [#27162](https://github.com/scala/scala3/pull/27162)).
- Under `-release`, JDK classes were reported to Zinc as project classes ([scala/scala3#27117](https://github.com/scala/scala3/issues/27117)); the empty package was included in names of Java classes ([#27136](https://github.com/scala/scala3/pull/27136)).

<!-- break -->

**Test-infrastructure bugs (the oracle itself was wrong):**

- Scripted tests shared a directory ([sbt/zinc#1802](https://github.com/sbt/zinc/pull/1802)).

- Many of these were *discovered*, not just fixed, with LLM agents: they read the invalidator, hypothesise a conflation, write a minimal scripted test, and observe over- or under-invalidation in the log.
