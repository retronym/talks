<script type="text/markdown" id="talk-src"># Zinc: incrementality as a language-design concern

**Audience:** maintainers of scalac / dotc, IDEs (Metals, IntelliJ), build tools (sbt, Mill, Bazel, Pants, Gradle). They know the compilers; most don't know Zinc's internals.

**Thesis:** every language feature has consequences for incremental compilation, whether or not its designer considered them. Incremental soundness is a property of the *compiler's* API summary, which now lives in the compiler repos. So it should be designed, specified and tested alongside each feature, not reverse-engineered from user bug reports years later.

<!-- break -->

**Arc:**

1. What incremental compilation *is*, precisely, so that under- and overcompilation have exact meanings; what Zinc trades away for speed (hashes instead of resolution); and the premise it all rests on: separate ≡ joint compilation.
2. How Zinc approximates it, and three design choices worth arguing about: members vs decls, who computes the hashes, and what a used name is (name kinds).
3. How everyone else does it.
4. Where it breaks: worked examples (implicits, value classes, macros), then a taxonomy.
5. The machinery we maintain: bridge, tests, persisted state.
6. Avoiding compilation altogether: hermetic builds and ABI jars.
7. Can we prove it? A Lean model.
8. Asks.

**Suggested budget (~60 min):** I 12 · II 10 · III 3 · IV 14 · V 10 · VI 4 · VII 5 · close 2. Cut Part III to a single slide if time is short; Part VII can be a 2-slide teaser.

### Why incrementality matters more for Scala

- **Scala compilers are slow per line.** scalac and dotc process far fewer lines per second than javac. Typing does real work: inference, implicit/given search, overload resolution, macro expansion and inlining. The pipeline also has many more phases before bytecode. (TODO: put one measured number on the slide, e.g. from scala/compiler-benchmark, scalac vs javac on comparable code.)
- **So a full rebuild costs more.** A module rebuild that a Java team shrugs off becomes minutes in Scala, and the edit-compile loop is where users feel it. The same holds in the IDE: Metals and IntelliJ compile through Zinc/BSP.
- **So precision is worth more.** Java build tools can lean on fast compiles plus coarse ABI-jar avoidance (Gradle, Bazel `ijar`). Scala needs fine-grained invalidation inside the module as well. That puts every under/overcompilation bug in this talk on the critical path of daily work.
- **And rounds cost more** (§4): each extra round pays again for typer setup and signature loading, so keeping round counts low matters as much as keeping file counts low.

---

## Part I — First principles

### 1. The contract

- Program = a set of sources $S$. Clean compile $C : \mathcal{P}(S) \to \mathit{Out}$ (classfiles/TASTy + diagnostics).
- Incremental compile $I : (\mathit{State}, S', \Delta) \to (\mathit{Out}', \mathit{State}')$, where $\mathit{State}$ summarises the previous run.
- **Correctness:** up to observational equivalence (bytes modulo known nondeterminism; same diagnostics),

$$I(\mathit{State}, S', \Delta) \equiv C(S')$$

- **Undercompilation:** $I \not\equiv C$, so it is unsound.
- **Overcompilation:** $I \equiv C$ but the recompiled set $R$ is much larger than the minimal $R^*$, so it is sound but slow.
- Users experience both as "sbt is flaky", type `clean`, and stop trusting the tool. Undercompilation is a correctness bug; overcompilation is a perf bug that trains users to throw away the incremental state.

### 2. Summaries as abstractions

- For each class $c$ the compiler extracts $\mathrm{API}(c) = \pi(c)$, a projection of its typed definition.
- A **client** (dependent) of $c$ is a class $d$ whose compilation references $c$: it calls, extends, mentions or pattern-matches on something in $c$. For each $d$ the compiler records the *used names* $U(d)$. The question is always "when $c$ changes, which of its clients must recompile?"
- **Soundness condition:**

$$\pi_{U(d)}(c) = \pi_{U(d)}(c') \implies C(d \mid c) = C(d \mid c')$$

- In words: $\pi$ must capture *everything a client's compilation can observe*.
- Every undercompilation bug is a counterexample: an observable not in $\pi$.
- Every overcompilation bug is the dual: $\pi$ distinguishes things no client observes (positions, fresh names, iteration order).
- Precision/soundness lattice: coarser $\pi$ gives sound but slow results; finer $\pi$ is fast and correct only if every observable is captured.

<!-- break -->

**Observables are closed under the backend.**

- The client's output is $g(\mathrm{typed}(d))$, and codegen applies functions $f$ to the definitions it references: erasure $E$, name mangling, bridge and forwarder generation, boxing, constant folding.
- If $d$'s output depends on $f(c)$ for one of these, then $\pi(c)$ must determine $f(c)$.
- For an ordinary class, erasure is a function of the *name*, so a name-keyed $\pi$ is enough:

$$E(A) = A$$

- For a value class, erasure is a function of the *contents*, and the name-keyed view breaks (§15b):

$$E(A) = E(\mathrm{underlying}(A))$$

### 3. The algorithm: a fixed point over a dependency graph

$$R_0 = \mathit{changed} \cup \mathrm{dependents}(\mathit{deleted}) \qquad R_{n+1} = \mathrm{inv}(\Delta\mathrm{API}_n) \qquad \text{stop when } \mathrm{inv}(\Delta\mathrm{API}_n) \subseteq R_n$$

The round just compiled is subtracted only in the *stop test*, so rounds are not monotone: a class compiled in round 1 can be recompiled in round 3, and a class in $R_n$ whose dependency in $R_n$ changed API is recompiled again in $R_{n+1}$ even though it already saw the new API (§4).

```mermaid
flowchart TB
  R0["R₀ = changed sources ∪ dependents of deleted"] --> CMP["Compile Rₙ together (compiler + bridge)"]
  CMP --> D{"API / name hashes<br/>changed?"}
  D -- "no: early cutoff" --> STOP["Done"]
  D -- "yes" --> INV["Invalidate dependents:<br/>inheritance (unfiltered),<br/>memberRef ∩ used names"]
  INV -- "Rₙ₊₁ non-empty" --> CMP
  INV -- "Rₙ₊₁ = ∅" --> STOP
```

- Edges: `memberRef`, `inheritance`, `localInheritance`, `macroExpansion`; plus library dependencies, tracked by classfile/jar stamps.
- **Name hashing:** $\mathrm{API}(c)$ is split into $\{\, n \mapsto \mathit{hash} \,\}$; a `memberRef` client $d$ is invalidated only if $U(d) \cap \mathrm{changedNames}(c) \neq \emptyset$. Inheritance edges bypass the filter.

<!-- break -->

- `UseScope` (`Default`, `Implicit`, `PatMatTarget`) exists because "used name" alone is not enough. This is the first hint that some observables aren't names (§15–16).
- Granularity: source-level (sbt ≤ 0.13) → class-level (Zinc 1.0). Finer nodes give smaller $R$ but more state, and more ways to be wrong.
- Escape hatch: past `transitiveStep` cycles, invalidate the transitive dependents *and keep the round just compiled*. From then on $R_n$ only grows, which is what makes termination provable (§22). The fallback is part of the semantics.
- $\pi$ and $U$ are computed *inside the compiler*, by the bridge phases `ExtractAPI` and `ExtractDependencies`. Zinc only does set algebra on them, so **incremental soundness is mostly a compiler property.**

```mermaid
flowchart LR
  subgraph COMPILER["Compiler process (scalac / dotc)"]
    T["typer"] --> XA["ExtractAPI<br/>→ π(c)"]
    T --> XD["ExtractDependencies /<br/>ExtractUsedNames → U(d), edges"]
    T --> BE["backend<br/>→ classfiles"]
  end
  XA -- "AnalysisCallback" --> Z["Zinc: hash, store<br/>Analysis"]
  XD -- "AnalysisCallback" --> Z
  BE --> Z
  Z --> INV["Invalidator<br/>(set algebra on hashes)"]
```

- **Unconditional fallbacks in the invalidator** (`MemberRefInvalidator`) show where name hashing gives up and every `memberRef` client is invalidated:
  - any change to an *implicit* member;
  - any change in a file that *declares a macro*;
  - any change in a file that declares an annotation.

  In each case $U(d)$ can't express the dependency (worked examples in §15).

### 4. Rounds: the fixed point in practice, its heuristics, and why incremental can be slower than clean

Each round (Zinc calls it a *cycle*) is a full compiler run over $R_n$:

- typecheck and generate code for $R_n$;
- load signatures of everything else from classfiles/TASTy;
- delete stale products, keeping a backup for transactional rollback;
- merge the new Analysis, diff old and new APIs, compute $R_{n+1}$.

```mermaid
flowchart TB
  A["Round 1: A.scala<br/>(edited: f's result type)"] -- "API of A changed" --> B["Round 2: B<br/>val g = A.f (inferred)"]
  B -- "B's API changed too" --> C["Round 3: clients of B"]
  C -- "round ≥ transitiveStep" --> X["Brute force: transitive<br/>closure of dependents"]
```

<!-- break -->

**Precisely** (`IncrementalCommon.invalidateAfterInternalCompilation`):

With $X_n = \mathrm{macroDownstream}(R_n) \cup \mathrm{collisions}$:

$$\text{stop iff } \big(\mathrm{inv}(\Delta\mathrm{API}_n) \setminus R_n\big) \cup X_n = \emptyset$$

$$R_{n+1} = \begin{cases} \mathrm{inv}(\Delta\mathrm{API}_n) \cup X_n & n < \mathtt{transitiveStep} \\ \mathrm{closure}(\mathrm{inv}(\Delta\mathrm{API}_n)) \cup X_n \cup R_n & n \ge \mathtt{transitiveStep} \end{cases}$$

- $R_n$ is subtracted in the stop test only; `nextInvalidations` is the unsubtracted set. A class compiled in round 1 is recompiled again in round 3 if one of its dependencies' APIs changes in round 2, which happens with cycles in the class graph. A class in $R_n$ that depends on another class in $R_n$ whose API changed is recompiled in round $n+1$ although it was compiled jointly with the new API: overcompilation by construction. (TODO: confirm in the invalidation log of a two-class cycle.)
- Without an assumption on the class graph the plain regime need not terminate: two mutually recursive classes whose inferred APIs keep changing ping-pong forever in the model (§22). `transitiveStep` is what guarantees termination.
- **Typical round counts:** a body-only change takes 1 round (early cutoff); a signature change takes 2.
- **Inferred types ripple:** a change to the inferred result type of a public `def` changes the API of every unedited class whose own public signature is inferred from it, adding a round per level. Explicit result types on public members are also an incremental-compilation best practice: they make interfaces source-determined, which caps a signature change at two rounds and guarantees the result matches a clean build (§22, T3).

<!-- break -->

**The heuristics** (`IncOptions`), each trading precision for a bound on rounds:

| Heuristic | Default | What it does |
|---|---|---|
| `transitiveStep` | 3 | from round 3 on, stop name-filtering: invalidate the *transitive closure* of the round's invalidations, plus the classes just recompiled ("brute-force transitive invalidation"). $R_n$ is then monotone, so at most $\lvert S\rvert$ further rounds |
| `recompileAllFraction` | 0.5 | if more than half of the sources are invalidated, compile everything in one round |
| macro downstream | always | every round, invalidate macro-bearing classes transitively downstream of anything recompiled (an expansion depends on behaviour as well as API) |
| unconditional invalidation | always | implicit members, files declaring macros or annotations: all `memberRef` clients (§3) |
| initial invalidation | — | tuned on field reports: "include mutual dependencies in initial invalidation" ([sbt/zinc#1284](https://github.com/sbt/zinc/pull/1284)) was reverted ([#1462](https://github.com/sbt/zinc/pull/1462)) after an overcompilation report ([#1420](https://github.com/sbt/zinc/issues/1420)) |

<!-- break -->

**Why an incremental compile can be slower than a clean one.** Rough cost model, with $c_0$ the per-run overhead, $c$ the per-class compile cost and $c_{\mathrm{sig}}$ the cost of loading a dependency's signature:

$$\mathrm{cost}(I) \approx \sum_{n} \big(c_0 + c\,\lvert R_n\rvert + c_{\mathrm{sig}}\,\lvert \mathrm{deps}(R_n) \setminus R_n\rvert\big) + \mathrm{bookkeeping} \qquad \mathrm{cost}(C) \approx c_0 + c\,\lvert S\rvert$$

- **Per-round overhead repeats:**
  - a new compiler run;
  - classpath and symbol loading, i.e. unpickling the signatures of everything $R_n$ touches;
  - a cold JIT if the compiler isn't in a long-lived server;
  - Analysis merge and API diff;
  - classfile backup/restore, and jar rewriting for straight-to-jar output and the pipelining early-output jar.
- **The same source file can be compiled in several rounds.** The next round is the full invalidated set, not just the newcomers, so a file compiled in round 1 is compiled again in round 2 or 3 whenever a class it depends on changes API in between (cycles, inferred types). Recompilation is per *file*, so a file holding several classes can also be pulled back in by each of them in turn. Each repeat pays full parsing, typing and code generation for the whole file again, which a clean build pays once. So $\sum_n \lvert R_n \rvert$ can exceed $\lvert S \rvert$.

<!-- break -->

- **Lost batch efficiencies:** one big run amortises typer caches, the parallel backend (`-Ybackend-parallelism`) and module-level pipelining. Several small runs don't.
- **A tax on every build:** the extraction phases (`xsbt-api`, `xsbt-dependency`) and Analysis persistence run even on a clean build. So a Zinc clean build is slower than plain `scalac`. For Scala 3, [scala/scala3#19422](https://github.com/scala/scala3/issues/19422) puts `ExtractAPI` plus `ExtractDependencies` at about 8% of compilation time. (TODO: measure the Scala 2 share with `-Vstatistics` on scala/scala.)
- **Future work: take extraction off the critical path.** The same issue proposes running both phases asynchronously, from the TASTy the build already produces (via TASTy Query), instead of in sequence with the other phases. A student project explored it. That would unblock the regular compile and shorten time-to-TASTy, which matters for pipelining (§21). §11 covers what it implies for where $\pi$ is computed.
- **Incremental wins only when** $\sum_n \lvert R_n\rvert \ll \lvert S\rvert$ *and* there are few rounds. `recompileAllFraction` is a crude, static estimate of that inequality.

**Implications:**

- Treat *rounds per build* as a first-class metric, alongside files recompiled. The invalidation log already has it.
- Watch for rounds that never converge in practice. With straight-to-jar output, after a partial compile, every later *no-op* compile reports the entries carried over from the previous jar as removed products and recompiles them, indefinitely (`compile-to-jar-no-op-recompiles`, [retronym/zinc#14](https://github.com/retronym/zinc/pull/14)). CI had stopped running scripted tests in jar mode, so nothing caught it.
- Make the escape hatches visible. Today both "Recompiling all sources: …" and "Brute-force transitive invalidation" only appear in debug-level invalidation logs, so users never learn why a one-line edit rebuilt the module.
- Consider a *cost-model* switch to a full compile, predicted from $\lvert R_n\rvert$, round count and measured per-round overhead, instead of a fixed fraction.
- Pipelining and a warm compiler server (sbt server, Bloop, Mill's worker) shrink $c_0$, which moves the break-even point in Zinc's favour.

### 5. Efficiency vs minimality: Zinc deliberately doesn't compute R*

- **True minimality is as expensive as compiling.**

$$d \in R^* \iff C(d \mid \mathit{new}) \neq C(d \mid \mathit{old})$$

  Deciding that exactly means re-running $d$'s compilation, or at least re-running every query $d$ made and comparing the answers. Any practical incremental compiler computes a cheap, sound over-approximation $R \supseteq R^*$.
- **Early cutoff is where Zinc is precise.** After recompiling $R_n$, propagation happens only if the *new* hash differs from the old. Without this, every edit would recompile the transitive dependents, as `make` would. With it, a body-only change stops after one cycle. (*Build Systems à la Carte* calls this early cutoff; §22.)
- In general, Zinc replaces *resolution* (an expensive semantic question about the new program) with *hash equality over a projection* (cheap and syntactic). Soundness comes from the projection covering everything resolution could depend on (§2). Precision is whatever survives that coarsening.

<!-- break -->

**Zinc's approximations, each trading precision for cost:**

| Zinc does | Instead of (closer to $R^*$) | Saves | Costs (overcompilation) |
|---|---|---|---|
| compares **hashes** of $\pi$ (an `int` API hash, `int` per-name hashes) | structural diff of old vs new API | O(1) compare; small state; no old API kept (`APIUtil.minimize`) | can't tell *compatible* changes (widening, adding a default) from breaking ones; can't explain what changed without `apiDebug`. In theory 32-bit collisions are unsound; in practice negligible per comparison |
| invalidates $d$ if it **uses name $n$** and depends on $c$ | **re-resolve** $d$'s uses of $n$ against the new $c$ (overloads, qualifiers, overriding) | no per-use resolution data stored; no lookups at invalidation time | `size` on any receiver; overloads it never picks (§12) |
| hashes **all defs named $n$** together | per-overload / per-signature keys | additions are visible (§12) | any overload change hits every user of the name |
| **class** nodes, **source-file** recompilation units | member-level nodes | small graph | every class in an invalidated file recompiles |
| **inheritance** edges bypass name filtering, transitively | per-member override analysis | no override tracking | a change to any member reaches every heir |
| **materialises members as seen from $C$** and hashes them (§7–9) | resolve `C#m` through linearization on demand | invalidation never walks the hierarchy | $\sum_c \lvert\mathrm{members}(c)\rvert$ extraction and state; N-fold re-detection |
| `transitiveStep` cap → recompile everything | keep iterating | bounded cycles | rare full rebuilds |

<!-- break -->

**Merkle hashing as the same trade, applied to member resolution** (links to §10).

Today Zinc hashes the *materialised* set of members named $n$ as seen from $C$, after linearization, overriding and `asSeenFrom`. That is *resolution, precomputed and hashed*:

$$h_C(n) = h\big(\mathrm{res}_C(n)\big)$$

The Merkle alternative composes the class's own declarations with its parents' hashes:

$$h'_C(n) = h\Big(\mathrm{decl}_C(n),\ \big\langle (P_i,\ \bar{T}_i,\ h'_{P_i}(n)) \big\rangle_{P_i \in \mathrm{parents}(C)}\Big)$$

```mermaid
flowchart BT
  subgraph TODAY["Today: members materialised per class"]
    A1["A: m, n"]
    B1["B extends A: m, n (copied), p"]
    C1["C extends B: m, n, p (copied), q"]
  end
  subgraph MERKLE["Merkle: decls + parent hashes"]
    A2["A: decls m, n"]
    B2["B: decl p + h(A)"]
    C2["C: decl q + h(B)"]
    C2 --> B2 --> A2
  end
```

<!-- break -->

- **Sound:** $\mathrm{res}_C(n)$ is a function of $C$'s own decls named $n$, its parents with their type arguments $\bar{T}_i$, and the parents' resolutions of $n$. With $h$ treated as injective, $h'_C(n) = h'_{C'}(n) \implies \mathrm{res}_C(n) = \mathrm{res}_{C'}(n)$.
- **Not complete:** inputs can change while $\mathrm{res}_C(n)$ doesn't, e.g. a parent's $n$ that $C$ overrides, or a type-argument change irrelevant to $n$. That gives a little more overcompilation, the *same direction* as every other Zinc approximation.
- **Cheap:** $O(\lvert\mathrm{decls}\rvert + \lvert\mathrm{parents}\rvert)$ per class, memoised per parent. No `asSeenFrom` of every inherited member, and no $\sum \lvert\mathrm{members}\rvert$ state.
- **Fewer recompiles, same rounds:** with Zinc's hierarchy walk, materialised hashes already invalidate $C$'s clients in the same round as $C$ (§9). What Merkle composition saves is recompiling the hierarchy itself (§10).
- Zinc already uses this pattern for traits: `extraHash` "folds in the parents' later". So Merkle composition is an extension of existing practice, not a new idea.
- Merkle hashing does for member resolution what name hashing does for symbol resolution. Both are sound, hash-based over-approximations that are cheaper than doing the resolution.

### 6. The hidden premise: separate compilation ≡ joint compilation

An incremental compile **is** a separate compilation: $R$ is compiled from source against the *classfiles/TASTy* of $S \setminus R$. So $I \equiv C$ silently assumes, **byte for byte**:

$$C_{\mathrm{sep}}\big(R \mid \mathrm{out}(S \setminus R)\big) \equiv C_{\mathrm{joint}}(S)\big|_R$$

```mermaid
flowchart TB
  subgraph JOINT["Joint"]
    direction LR
    AS["A.scala"] --> J["compile {A, B}"]
    BS["B.scala"] --> J
    J --> BJ["B.class"]
  end
  subgraph SEP["Separate (= incremental)"]
    direction LR
    AS2["A.scala"] --> CA["compile A"] --> AC["A.class / A.tasty"]
    AC --> CB["compile B against A.class"]
    BS2["B.scala"] --> CB
    CB --> BSC["B.class"]
  end
  BJ -.-|"must be byte-identical"| BSC
```

<!-- break -->

- If that premise fails, the consequences are:
  - *spurious API diffs*, i.e. overcompilation that never converges ("recompiled `B` again, no source change");
  - *semantic* divergence: the program means something different depending on build history;
  - broken JAR-equivalence and remote caches (§21), because a Bazel cache hit and an sbt incremental build disagree on the bytes.
- **Why the two views differ in Scala:**
  - a symbol typed from source and a symbol unpickled from Scala signatures or TASTy are different objects. They differ in flags, completion order, inferred types, companion pairing and annotations;
  - Symbol ids leak into sort keys and fresh names (lambda-lift ordering by `Symbol.id`, [scala/scala3#7661](https://github.com/scala/scala3/issues/7661));
  - flags mutated by later phases leak into output: `InnerClass` access flags differed joint vs separate ([scala/bug#12085](https://github.com/scala/bug/issues/12085) → [scala/scala#9131](https://github.com/scala/scala/pull/9131));
  - still being found: TASTy sharing depends on type identity ([scala/scala3#26551](https://github.com/scala/scala3/issues/26551)); classfile member order and `InnerClasses` differ ([#26552](https://github.com/scala/scala3/issues/26552)); source-file order changes the result ([#10634](https://github.com/scala/scala3/issues/10634));
  - the backend's `companionSymbol` lookup observed stale classfiles ([scala/scala-dev#402](https://github.com/scala/scala-dev/issues/402));
  - reflective calls on structural types break under separate compilation ([scala/bug#11773](https://github.com/scala/bug/issues/11773)).

<!-- break -->

**Java interop adds a second source of divergence.** scalac has *two independent front ends for Java*, and they must agree:

```mermaid
flowchart LR
  JS["J.java"] --> JP["JavaParsers<br/>(signature-only parse)"] --> S1["Symbols for J<br/>(joint / mixed / pipelined)"]
  JS --> JC["javac"] --> CF["J.class"] --> CP["ClassfileParser"] --> S2["Symbols for J<br/>(separate)"]
  S1 -.-|"must agree"| S2
```

- Constants: `static final` fields not folded to `ConstantType` from source ([scala/bug#5333](https://github.com/scala/bug/issues/5333), [#10410](https://github.com/scala/bug/issues/10410), still open).
- Annotations parsed differently ([scala/bug#5699](https://github.com/scala/bug/issues/5699), [scala/scala3#10788](https://github.com/scala/scala3/issues/10788)).
- Typing differs: `T[]` overriding needs `Array[T with Object]` vs `Array[T]` depending on joint vs separate ([scala/bug#4390](https://github.com/scala/bug/issues/4390)); Java inner classes get path-dependent types only under joint compilation ([scala/bug#11569](https://github.com/scala/bug/issues/11569)); record varargs work separately but not jointly ([scala/scala3#24167](https://github.com/scala/scala3/issues/24167)).
- **Parameter names can make separate compilation fail outright** ([retronym/zinc#14](https://github.com/retronym/zinc/pull/14), `java-param-rename-named-arg`). scalac knows a Java method's parameter names only from its *source*. Without `javac -parameters`, `ClassToAPI` records every Java parameter name as `""`, so renaming one doesn't invalidate a Scala caller that uses named arguments. Recovering the names from javac's syntax tree (closed WIP [retronym/zinc#22](https://github.com/retronym/zinc/pull/22)) made the rename invalidate the caller, but then *recompiling* the caller fails with "unknown parameter name", because Zinc recompiles it without the Java source. That happens with no Java change at all (`java-named-arg-scala-recompiled`). Workaround: compile Java with `-parameters`, which [retronym/zinc#23](https://github.com/retronym/zinc/pull/23) then records. A full fix needs scalac to see the Java sources the recompiled Scala depends on.
- Every new Java language feature needs a `JavaParsers` port in *both* compilers: records ([scala/bug#11908](https://github.com/scala/bug/issues/11908), [scala/scala3#14846](https://github.com/scala/scala3/issues/14846)), sealed ([scala/bug#12159](https://github.com/scala/bug/issues/12159)), text blocks ([#12290](https://github.com/scala/bug/issues/12290)), value objects ([#13194](https://github.com/scala/bug/issues/13194), open).

<!-- break -->

- **Zinc chooses the view:** `CompileOrder` (`Mixed`, `JavaThenScala`, `ScalaThenJava`) chooses which Java view scalac sees. **Pipelining** (`-Ypickle-java`) *always* gives downstream the source view of Java, so pipelined and non-pipelined builds see different symbols for the same Java class.
- **The invariant to test:** for every pos test, `compile({A,B})` and `compile(A); compile(B | A.class)` emit identical bytes for `B`, and the same holds with `A` in Java.
- Scala 2 made this a tested property in 2018 (§6a); Scala 3 has started enforcing it mechanically (`DeterminismTest`, [scala/scala3#26553](https://github.com/scala/scala3/pull/26553)).
- partest's `_1`/`_2` convention checks that separate compilation succeeds; it doesn't compare the output with a joint compile.

#### 6a. Stability as a compiler property: scala-dev#405 and scala3#7661

The work behind [scala/scala-dev#405](https://github.com/scala/scala-dev/issues/405) ("Deterministic Compilation / Reproducible Builds", opened 2017, closed for 2.13.0-M5 in 2018) made the §6 premise an explicit, tested property of scalac. Its working definition of *stable*: the same bytes regardless of

- **source file order**: the order of files on the command line drives type-completion order in a joint compile, so anything sensitive to completion order leaks into the output;
- **partial compilation**: compiling subsets of files separately, file by file, against the others' classfiles. This is joint ≡ separate, the premise of every incremental build.

**Method** ([retronym/scalac-stability](https://github.com/retronym/scalac-stability)): hand-crafted test cases expected to be unstable, plus `scalac-stability-check.sh`, which compiles in normal order, in reverse order and file by file, then diffs the classes with [jardiff](https://github.com/scala/jardiff).

<!-- break -->

**What it found in scalac** (all fixed for 2.13.0-M5):

| Cause | Why the output varied |
|---|---|
| fresh names from per-compilation-unit counters | numbering followed type-completion order; now scoped to the enclosing user-written method |
| `LambdaLift` sorted symbol sets by `Symbol.id` | ids depend on completion order; now a linked set |
| default getters entered into scope as methods were completed | scope order followed completion order; now entered eagerly by the namer |
| parameter-alias computation across inheritance levels | a race between `setAlias` and `alias` during typer; moved after typer |
| mixed-in outer accessors took the mixed-in member's position | that position only exists in a joint compile |
| decl order not recorded in the pickle | mixin decl order differed between joint and separate compiles; the pickler now enters decls in order |
| refinement typing set the `OVERRIDE` flag late | inferred types copying the refinement saw the flag or not, depending on timing; now cleared on copies |

<!-- break -->

**Why users cared:** Bazel users sharing build artifacts through a distributed cache found that non-reproducible output "killed the cache". One team removed quasiquotes to improve hit rates (comment on #405).

**Scala 3 lags behind:**

- [scala/scala3#7661](https://github.com/scala/scala3/issues/7661) ("Fully deterministic compilation (stable compiler output under reordering and separate compilation)") was opened in 2019 as the counterpart to #405, quoting the scalac findings above, and is still open.
- Coverage was `IdempotencyTests` over a handful of `tests/order-idempotency` files.
- In 2026 a `DeterminismTest` ([#26553](https://github.com/scala/scala3/pull/26553)) checking classfile/TASTy stability under recompilation started finding more: TASTy sharing that depends on type identity ([#26551](https://github.com/scala/scala3/issues/26551)) and classfile member order / `InnerClasses` differing under separate compilation ([#26552](https://github.com/scala/scala3/issues/26552)).

<!-- break -->

**Relevance to Zinc:**

- Every instability can produce a spurious API diff, i.e. overcompilation (§16(e)) that can cascade through extra rounds (§4).
- It breaks ABI-jar equivalence and remote caching (§21) for users of hermetic builds who rely on caching instead of Zinc.
- Completion-order effects are the global-state back-channel that the purity assumption in the Lean model forbids (§22).

**Ask:** run the stability check (normal order, reverse order, file by file) over the community build for *both* compilers in CI, and treat a diff as a bug in the feature that introduced it.

## Part II — Three design choices worth arguing about: the shape of π, who hashes it, and what a "used name" is

*(Discussion section. These are open questions.)*

### 7. What ExtractAPI actually records

- A class's `Structure` (`xsbti.api.Structure`) has three parts, all rendered *as seen from* $C$:
  - `parents`: the *linearized* ancestor types;
  - `declared`;
  - `inherited` $= \mathrm{nonPrivateMembers} \setminus \mathrm{decls}$.

  Scala 2: `internal/compiler-bridge/.../ExtractAPI.scala` `mkStructureWithInherited`; Scala 3: `ExtractAPI.apiClassStructure`.
- Both the class's API hash (`HashAPI.hashStructure0`) and its name hashes cover `inherited`.
- It has been this way since 2009 (Mark Harrah, "linearization instead of parents and add inherited members for structure", [42c5d47b](https://github.com/scala/scala/commit/42c5d47b99f6d4ed215957d784934c3580c36968)).
- The bridge's doc comment says so: the class hash includes parents only by *name*, "so we must ensure changes propagate somehow", followed by a TODO asking whether parent hashes could be used instead.

### 8. Why it's done (what it buys)

- **Locality of dependencies:** a client of `c.m`, where `m` is inherited from `A`, depends on `C`'s API. A change to `A.m` shows up as a change to `C`, so no hierarchy walk is needed at invalidation time. (In practice Zinc records a `memberRef` on the owner `A` as well, and walks anyway; §10.)
- **`asSeenFrom`:** in `class B extends A[Int]`, `def f: T` is observed as `f: Int`. Changing only `B`'s extends clause changes the members clients see, with no change to any decl.
- **Linearization:** adding an override in a mixin changes *which* member wins for `C`. A member-level view captures that; a decls-only view would have to recompute the linearization.

### 9. What it costs (what makes it non-local)

- **API(C) depends on C's whole ancestor closure.** Editing `A` changes the API hash and name hashes of *every* descendant, so every descendant must be recompiled before its hash is trustworthy again, whether or not its own output depends on the edit. The descendants' clients are *not* delayed by a round: the invalidator already walks the hierarchy (`invalidateByInheritance`, then `memberRef` clients of every inheritor, filtered by `A`'s changed names), so they join the same round. What the walk cannot avoid is recompiling the hierarchy itself; in the model (§22) the decls and Merkle designs recompile only the clients.

```mermaid
flowchart BT
  B["B extends A"] --> A["A (edited)"]
  C["C extends B"] --> B
  D["D extends B"] --> B
  E["E extends C"] --> C
  UB["clients of B"] -.-> B
  UC["clients of C"] -.-> C
  UE["clients of E"] -.-> E
  classDef hot fill:#f6e4dc,stroke:#b4441f,color:#1d1d1f;
  class A,B,C,D,E hot;
```

- **Duplication of work:** inheritance invalidation is already transitive, so the same change gets re-detected N times, once per subclass, and the descendants' changed name hashes then point at clients that were already recompiled (a non-empty but redundant $\Delta$). Invalidation logs become hard to explain ("why did `Z` recompile?" → because `Y`'s API changed → because `X` …).

<!-- break -->

- **Size:** state grows with $\sum_c \lvert\mathrm{members}(c)\rvert$, not $\sum_c \lvert\mathrm{decls}(c)\rvert$. Deep or wide hierarchies make this large: collections, cake pattern, big framework traits, anything extending `java.util.AbstractList`. Analysis size, hashing and extraction time all scale with it.
  - `inherited` is `lazy` in the schema for this reason; laziness was removed and then reverted ([371b374d](https://github.com/scala/scala/commit/371b374db34ade9ef3af927e9b95094995202cf0) / [b9bd9ecb](https://github.com/scala/scala/commit/b9bd9ecb53fbb7209d0bddc033c8dc8cefdca6ec)).
- **Extraction cost on every run:** `members` plus `asSeenFrom` for each compiled class, including members from library parents that can only change when the library jar changes.
- **Overcompilation amplifier:** any nondeterminism in rendering an inherited member (unstable owners, refinement type params: [sbt/zinc#1782](https://github.com/sbt/zinc/pull/1782), [scala/bug#6596](https://github.com/scala/bug/issues/6596)) is multiplied across every subclass.
- Traits make it worse in a different way: trait bodies leak into subclasses (fields, super accessors, mixin forwarders), so there is a separate `extraHash` / "trait breakers" channel for subclasses.

### 10. Alternatives

- **Merkle composition** (worked out in §5): $h'_C(n) = h(\mathrm{decl}_C(n), \langle (P_i, \bar{T}_i, h'_{P_i}(n)) \rangle)$.
  - The hash stays non-local, but the *storage* and *computation* become local and memoised. This is what the bridge's TODO suggests.
  - It is a sound over-approximation of today's materialised resolution.
  - Open questions: self-types and refinements as parents; library parents (treat their hash as a constant keyed by the jar stamp); whether per-name composition is precise enough for `asSeenFrom`-heavy code (type-argument changes now move every inherited name).
- **Decls-only + hierarchy-aware invalidation:** record each `memberRef` against the *declaring* owner and the *receiver* type. When `A.m` changes, walk subclasses at invalidation time. Zinc already does this walk (§9); what changes is that the client records the classes its lookup *visited*, misses included, instead of relying on the receiver's materialised hash. This moves `asSeenFrom` and linearization concerns from extraction into the recorded keys.
- **Hybrid:** decls-only for classes whose parents are library types (which change only by jar stamp), member-level within the module. The PoC below splits the other way: ancestors in the same subproject are decls-only, while library and upstream-subproject ancestors stay materialised, so invalidation from outside the subproject is unchanged.
- **A proof of concept** ([retronym/zinc#24](https://github.com/retronym/zinc/pull/24), draft, Scala 2 bridge): stop materialising members inherited from the same subproject, recompile a descendant only when one of five rules says its own compilation reads the change, and compose Merkle hashes for lookups from other subprojects. §10a's Edit 1 recompiles `X Y` instead of `B C X Y`, and four existing scripted tests (`transitive-class`, `transitive-memberRef`, `class-based-inheritance`, `local-class-inheritance`) now recompile fewer descendants; the full scripted suite passes.

<!-- break -->

**What the model says (§22, `Hier.lean`):** the three are three ways to make the hash of an inherited member depend on the ancestor, and all three are sound instances of the same theorem.

| design | what the client records | where the walk happens | hash | rounds on an inherited-member edit | recompiles the hierarchy? |
|---|---|---|---|---|---|
| materialised (today) | `(C, m)`; Zinc also records `(A, m)`, a `memberRef` on the owner of the selected member | in `C`'s own compilation, stored in `C`'s interface | local, but `C`'s interface is stale until `C` recompiles | 3 plain, 2 with the walk | yes |
| decls + walk | `(X, m)` for every `X` visited, plus `(C, parents)` | in the client's compilation | local | 2 | only descendants whose own type check depends on the change (§10a) |
| Merkle | `(C, m)` | in the hash function, memoised | non-local: the *verifying trace* of the walk | 2 | only descendants whose own type check depends on the change (§10a) |

- **Zinc is already partly decls + walk.** A client of `B.m`, with `m` inherited from `A`, already has a `memberRef` on `A` under the name `m`, and the invalidator already walks the `memberRef` clients of every inheritor, filtered by the ancestor's changed names (§9). Within a subproject that is enough: the PoC needed no composed hashes there, only to stop materialising inherited members and to stop recompiling every descendant.
- **Where Merkle composition is required: across subprojects.** A downstream subproject sees only the stored API, and the upstream analysis it looks up carries no relations, so there is nothing to walk. The PoC composes each upstream class's name hashes over its stored linearization (`structure.parents`) at lookup time. Without that, `macros/macro-type-change-3` undercompiles: a macro that reflects over `baseClasses` selects no member, so no `memberRef` names the ancestor. Ancestors contribute their class-side hash, not the merged class-and-object `apiHash`, because companion-object members are not inherited (Java statics are, §12); this is another face of [sbt/zinc#1796](https://github.com/sbt/zinc/issues/1796) (§12).
- **Soundness requirement or convenience?** Convenience. Any of the three works; what is *required* is either a non-local hash kept fresh (by recompiling the hierarchy, or by recomputing hashes over the inheritance closure, `affected` in the model) or local keys that name every ancestor visited.
- **Merkle hashes must be recomputed:** memoised non-local hashes must be recomputed for the hash dependents of whatever was recompiled. Diffing them over the recompiled set alone undercompiles (`Stale.lean`, T2-stale). Zinc's materialised design pays for freshness with hierarchy recompiles; the walk at invalidation time is what makes that affordable.
- **Precision comes from the hash function.** On an `asSeenFrom` edit (`B extends A[Int]` → `A[String]`), the model's materialised hash moves only the names whose rendering changed (in Zinc, the name hash of `B` itself also moves, so every client that mentions `B` recompiles; §10a); the decls design moves every client of `B` through `(B, parents)`; the §5 Merkle formula moves every inherited name of `B`. A Merkle hash of the *resolved* member would be as precise as materialised, with the same freshness obligation.

**Discussion questions:**

- Which scripted tests break under decls-only? (The model says: none for soundness; the per-name precision differs on `asSeenFrom` edits.)
- What fraction of a real analysis file is `inherited`? (TODO: measure on scala/scala and on a large app before the talk.)
- Scala 3 has TASTy: could $\pi$ be derived from TASTy-level signatures plus a structural parent hash, making it shareable with IDEs and other build tools?

#### 10a. Worked example: materialised members vs Merkle hashing

The program is the one `Hier.lean` checks, written as Scala. `A` is an abstract class, so `B` and `C` contain no code generated from `A`'s members.

```scala
abstract class A[T] { def m: Int = 0; def g: Int = 0 }
class B extends A[Int]
trait M
class C extends B with M

object X { def f(b: B) = b.m }   // client of B.m
object Y { def f(c: C) = c.m }   // client of C.m
object Z { def f(b: B) = b.g }   // client of B.g
```

<!-- break -->

**What each design stores.**

*Materialised (today).* Each class's API lists every member as seen from that class, and the name hash hashes that rendering:

| class | `declared` | `inherited` | $h(m)$ | $h(g)$ |
|---|---|---|---|---|
| `A` | `m: Int`, `g: Int` | | $h(\texttt{m: Int})$ | $h(\texttt{g: Int})$ |
| `B` | | `m: Int`, `g: Int` | $h(\texttt{m: Int})$ | $h(\texttt{g: Int})$ |
| `C` | | `m: Int`, `g: Int` | $h(\texttt{m: Int})$ | $h(\texttt{g: Int})$ |

Every inherited member is stored again in every descendant, and each descendant's hashes are computed when *that descendant* is compiled.

*Merkle.* Each class stores only its own declarations and its parents with their type arguments. The hash of a name is composed on demand and memoised:

$$h_A(m) = h(\texttt{m: Int}) \qquad h_B(m) = h\big(\emptyset,\ \langle (A, \texttt{Int}, h_A(m)) \rangle\big) \qquad h_C(m) = h\big(\emptyset,\ \langle (B, h_B(m)),\ (M, h_M(m)) \rangle\big)$$

$h_M(m) = h(\text{miss})$ records that `M` has no `m`, so a later `M.m` changes $h_C(m)$.

<!-- break -->

**Edit 1: `A.m: Int` becomes `A.m: String`.**

*Materialised.*

- `A`'s hash for `m` changes. `B`'s and `C`'s stored hashes still say `m: Int`, because they were computed when `B` and `C` were last compiled.
- Zinc must recompile `B` and `C` to refresh them; the inheritance edges do that.
- Zinc's hierarchy walk also invalidates the `memberRef` clients of every inheritor that use `m`, so `X` and `Y` join the same round.
- Result: **`B C X Y` recompiled, 2 rounds.** In this program `B` and `C` produce identical output: neither declares `m`, no other ancestor declares `m`, `m` is concrete, and `A`'s header didn't change. So here they were recompiled only to recompute their hashes. That is not true in general (next card).

*Merkle.*

- $h_A(m)$ changes, so $h_B(m)$ and $h_C(m)$ change when Zinc *recomputes* them from the stored ingredients. No compilation is needed for that.
- `X` uses `m` on `B`, `Y` uses `m` on `C`: both are invalidated.
- Result: **`X Y` recompiled, 2 rounds.** `Z` stays in both designs, since $h(g)$ didn't move.

The PoC ([retronym/zinc#24](https://github.com/retronym/zinc/pull/24)) reproduces this in Zinc: its scripted test `merkle-member-type` recompiles `X Y`, where today's Zinc recompiles `B C X Y`.

```mermaid
flowchart LR
  subgraph MAT["Materialised"]
    direction TB
    A1["A edited"] --> B1["recompile B<br/>(refresh hash)"]
    A1 --> C1["recompile C<br/>(refresh hash)"]
    A1 -. "walk" .-> X1["X, Y"]
  end
  subgraph MRK["Merkle"]
    direction TB
    A2["A edited"] --> H2["recompute h_B(m), h_C(m)<br/>(no compile)"]
    H2 --> X2["X, Y"]
  end
```

<!-- break -->

**Edit 2: `asSeenFrom`.** Start from `A[T] { def m: T = ???; def g: Int = 0 }` and change `B extends A[Int]` to `B extends A[String]`.

- *Materialised, in the model (`Hier.lean`):* `B`'s rendering of `m` changes from `Int` to `String`; `g` is still `Int`, so $h_B(g)$ is unchanged. Result: **`C X Y`**; `Z` stays.
- *Materialised, in today's Zinc:* **`C X Y Z`**, pinned by the PoC's `merkle-as-seen-from` test on its baseline commit. `Z` mentions the type `B`, so the name `B` is in $U(Z)$, and the name hash of `B` itself covers `B`'s header, parents included. The model has no key for a class's own name.
- *Merkle (§5 formula):* the parent and its type argument are inside *every* $h_B(n)$, so $h_B(g)$ changes too. Result: **`X Y Z`**; `Z` is recompiled although nothing it uses changed.
- So the materialised design is more precise here in the model, not in Zinc: the class-name key already moves every client that mentions `B`. The PoC also recompiles `C X Y Z`. A Merkle hash of the *resolved* member, $h(\mathrm{res}_B(n))$ computed by a memoised walk, would be as precise as the model's materialised design while keeping local storage, but it must be recomputed for the same set of classes, and it buys nothing until the class-name key stops covering parents.

**Edit 3: linearization.** The mixin `M` gains a member `m`.

- *In the model:* $h_M(m)$ changes from "miss" to a declaration, so $h_C(m)$ changes and Merkle recompiles only **`Y`**; materialised recompiles **`C Y`**.
- *In Scala, `C` must recompile in both designs.* With `trait M { def m: String = "" }`, `C` inherits conflicting members `m` from `A` and `M` and no longer compiles. With a legal edit, `trait M extends A[Int] { override def m: Int = 1 }`, `C` changes linearization and gains a mixin forwarder for `M.m` (the `extraHash` channel, §9). Either way the edit reaches `C`'s own type check, so Merkle saves nothing here.

<!-- break -->

**When a descendant must recompile anyway.** A descendant's compilation reads its ancestors in places its used names $U(D)$ don't cover: refchecks and forwarder generation. The PoC found the necessary set by ablation, disabling each rule in turn against scripted tests; each of these five fails a test of its own when disabled (`merkle-override`, `-conflict`, `-abstract`, `-trait-override`, `-mirror`):

- **overrides**: a member `D` declares that overrides an ancestor's member must still conform to it (and may need a bridge);
- **conflicts**: members of the same name inherited from two parents must be reconciled (Edit 3);
- **abstract members**: a concrete `D` must implement every abstract member it inherits;
- **trait mixin forwarders**: if $P$ is a trait, `D`'s bytecode has a forwarder for each concrete member of $P$;
- **static forwarders**: if `D` is a top-level object with no companion class, its mirror class has a static forwarder for every member, inherited ones included.

Two candidates need no rule of their own. *Uses*: a descendant is a `memberRef` client of its parent (the constructor call, inherited member selections), so ordinary name-filtered invalidation already reaches it. *The ancestor's header* (parents, type parameters, self type, `final`/`sealed`): a header change already invalidates every `memberRef` client of every descendant.

So after an edit to ancestor $P$ with changed names $N$, descendant $D$ must recompile, beyond its ordinary `memberRef` invalidation, if

$$N \cap \big(\mathrm{decls}(D) \cup \textstyle\bigcup_{Q \in \mathrm{ancestors}(D) \setminus \{P\}} \mathrm{decls}(Q)\big) \neq \emptyset \quad\text{or}\quad P \text{ is a trait} \quad\text{or}\quad D \text{ has a mirror class}$$

and abstract members of $P$ in $N$ count against every concrete $D$. The rules are to a descendant's refchecks and codegen what $U(d)$ is to a client's lookups: the key abstraction of the part of its trace that reads other classes (§12). The materialised design recompiles *every* descendant regardless, because its stored hashes are stale. Merkle and decls designs can restrict the recompile to this set; the saving is the descendants outside it, which in Edit 1 is all of them. (The Lean toy doesn't model these checks: its descendants never query their ancestors. Adding override, conflict and abstract-member queries keyed on $(Q, n)$ would make it recompile exactly this set; see the future work in §22. The forwarder rules were found by thinking about bytecode, not by the model.)

<!-- break -->

**What the example shows:**

| | materialised (today) | Merkle chain |
|---|---|---|
| state per class | every member, own and inherited, as seen from the class | own declarations plus parent references |
| total state | $\sum_c \lvert\mathrm{members}(c)\rvert$ | $\sum_c \lvert\mathrm{decls}(c)\rvert$ plus memoised hashes |
| ancestor edit | recompile every descendant to refresh its hashes | recompute descendants' hashes; recompile clients, plus descendants whose own type check depends on the change |
| `asSeenFrom` edit | in the model, only the names whose rendering changed; in Zinc, also every client that mentions the class | every name inherited through that parent |
| linearization edit | recompile the class (needed anyway: conflict check, mixin forwarder) | the recorded miss changes the hash; the class still recompiles for its own reasons |
| freshness obligation | met by recompiling | met by recomputing over the inheritance closure; skipping that undercompiles (`Stale.lean`) |
| rounds | 2 with Zinc's walk | 2 |

The recompiled sets are the ones `Hier.lean` checks (§22); the walk policy is what brings the materialised design down to two rounds.

### 11. Who computes the hash? Bridge-side hashing vs projecting into xsbti.api

Today:

```mermaid
flowchart LR
  T1["compiler types"] --> P1["full xsbti.api tree<br/>(incl. inherited)"]
  P1 -- "api(file, classApi)" --> H1["Zinc hashes it"]
  H1 --> M1["minimize: keep a stub,<br/>discard the tree"]
```

Alternative:

```mermaid
flowchart LR
  T2["compiler types"] --> H2["bridge hashes directly,<br/>memoised per symbol"]
  H2 -- "opaque hashes" --> Z2["Zinc invalidator"]
  T2 -- "thin discovery callback" --> DSC["test discovery"]
```

**Today's pipeline** (`AnalysisCallback.api`, then `Incremental.scala`):

1. The bridge projects compiler types into a full `xsbti.api.ClassLike` tree: every member including inherited ones, as seen from the class, with lazy fields.
2. It hands the tree to Zinc via `api(sourceFile, classApi)`.
3. Zinc computes `HashAPI` (the API hash), `NameHashing` (name hashes, partitioned by `UseScope`), and the trait `extraHash` (parents folded in later, already Merkle-style). It sets the `hasMacro` and `isAnnotationDefinition` flags.
4. Zinc then *throws most of the tree away*. Unless `apiDebug` is set, `APIUtil.minimize` keeps a stub with the name, modifiers, annotations, `savedAnnotations`, sealed children, top-level flag and type parameters.
5. `AnalyzedClass` persists the hashes plus that stub.

So for every compiled class, on every run, we build a large object graph mainly so it can be hashed and discarded.

<!-- break -->

**Alternative:** the bridge computes `{apiHash, nameHashes, extraHash, flags}` directly over compiler symbols and types, and sends opaque hashes. Zinc's invalidator already works only on hashes.

**What it buys:**

- **No intermediate representation:** no allocation, laziness or interning of `xsbti.api` trees. (TODO: profile the `xsbt-api` phase and the callback on scala/scala with async-profiler to put a number on it.)
- **Hash what codegen actually sees:** include erased descriptors directly, which closes the §15b class of bugs *by construction* (§2: $\pi$ must determine $E$). Also inline bodies, sealed children and TASTy-level detail, without growing a cross-repo schema.
- **Memoise per symbol per run:** a parent's hash is computed once and reused by every subclass. That gives the Merkle composition of §10 without paying $\sum \lvert\mathrm{members}\rvert$.
- **Less drift (§18):** a new observable becomes a compiler-local change. Today it can need an `xsbti.api` schema change, MiMa review, a Zinc release and two bridge releases.
- **Smaller analysis, faster loads (§20).**

<!-- break -->

**What it costs:**

- **Collateral consumers of the stored API:**
  - test discovery: `xsbt.api.Discovery` walks the minimized `ClassLike` (annotations, parents, `savedAnnotations`) for sbt's `definedTests`;
  - explaining invalidations: `apiDebug`, `APIDiff`, `ShowAPI` "what changed?" diffs;
  - any external tool reading `Analysis.apis` (verify Bloop/Mill/IntelliJ).
- **Mitigations:**
  - a separate thin *discovery* callback (class name, kind, parent names, class/def annotations, main methods; `mainClass` is already a callback), or discovery from classfiles the way JUnit-platform scanners do it;
  - for debugging, the bridge emits a canonical *text rendering* behind a flag and hashes that text, so the diff stays free.
- **Hashing is no longer shared code:** two bridges plus Zinc's Java path (`ClassToAPI`) each hash. Mitigation: a tiny stable `Hasher` in `compiler-interface`, so the compiler decides *what* to hash and Zinc owns *how* hashes are mixed.
  - Producers needn't agree with each other: a class's hash is only ever compared with its own previous hash from the same producer. A compiler-version change already forces a full recompile (`MiniSetup`).
- **The name-hash contract must be written down:** the `UseScope` partition, sealed handling, private-member rules. That spec would also serve §17 and §23.
- **Zinc can no longer fix a hashing bug without a compiler release.** But extraction bugs, which already require one, dominate the bug history (Part IV).

<!-- break -->

**Variant: derive π from outputs, not internals.**

- Hash the classfile ABI (`ijar`-style descriptors, per member) plus the signature payload (Scala sig / TASTy signatures).
- This is compiler-agnostic and erasure-correct by construction. Zinc 2.x's `bytecodeHash` / `transitiveBytecodeHash` already lean this way, replacing timestamps.
- It still needs the compiler for $U(d)$ and for macro observation.
- **A TASTy-based variant** ([scala/scala3#19422](https://github.com/scala/scala3/issues/19422)): extract both $\pi$ and $U(d)$ from TASTy, asynchronously from the main compile. TASTy has the trees, positions and symbols Zinc needs, but not everything the compiler sees. For example, code inlined during Mirror synthesis is dropped before pickling. The open questions in the issue are the coverage obligation of §22 in practice: what must be added to TASTy so nothing is lost, and whether the overhead of loading TASTy in parallel pays off. Desugaring and post-typer decisions (§16(h), (i)) would need to survive into TASTy as well.

**The trade-off:** the `xsbti.api` tree is a *general* reflection of the type system that we pay for on every compile, while incremental compilation only needs a *hash* of it. If we optimise for incremental compilation alone, the tree is overhead, and test discovery should get its own narrow channel.

### 12. What is a "used name"? Name kinds and the key space of U

**What ExtractUsedNames records today** (Scala 2 bridge `ExtractUsedNames.scala`; Scala 3 `ExtractDependencies`):

- *Simple, decoded, unqualified* names, per using class, each tagged with a set of `UseScope`s (`Default`, `Implicit`, `PatMatTarget`).
- Names come from:
  - symbols in non-definition position;
  - **names of the types of trees**, including inferred ones (`types-in-used-names-*`, `as-seen-from-*` tests). That's why `C` "uses" `A` in §15b;
  - import selectors;
  - `TypeTree.original`;
  - pre-expansion macro trees (`OriginalTreeAttachments`);
  - pattern-match targets (`PatMatTarget`).
- Synthetic names are normalised: a constructor shows up as `A;init;` in the invalidation log.

<!-- break -->

**The invalidation key is a conjunction.** The name is not tied to its qualifier:

$$d \text{ invalidated by a change in } c \iff d \xrightarrow{\ \mathrm{memberRef}\ } c \ \wedge\ U(d) \cap \mathrm{changedNames}(c) \neq \emptyset$$

- If `d` depends on `c` for any reason and calls `.size` on *anything*, a change to `c.size` invalidates `d`.
- Zinc gives up this precision deliberately (§5).

**Why simple names, not symbols?** Because the dangerous changes are *additions*, and you cannot record a dependency on a symbol that doesn't exist yet:

- a new overload `foo(Int)` changes the resolution of `foo(1)`, which used to pick `foo(Long)`;
- a new member shadows an import (§15a);
- a new override changes linearization (§8);
- a new *class* `p.q.Foo` shadows the `Foo` that code in `p.q` (or a nested package clause) used to resolve elsewhere. Classes in an added source only invalidate their reverse dependencies, of which there are none yet (`shadow-nested-package-added-class`, [retronym/zinc#14](https://github.com/retronym/zinc/pull/14); the nested-package flavour of sbt/zinc#226). Catching it needs a package → classes index.

A name hash covers *all* definitions with that name in `c`, so adding one changes the hash. Simple names are the coarsest key that sees "something named `n` appeared or disappeared", which is a *negative lookup*.

<!-- break -->

**Name kinds: the conflations, and recent Zinc work:**

- **Class vs companion object.** `class A` and `object A` share one `AnalyzedClass`, and their name hashes are merged. Changing `class A.x` recompiles users of `object A.x` ([sbt/zinc#1796](https://github.com/sbt/zinc/issues/1796), open).
  - Java is the exception to "object members aren't inherited". Java static members are inherited for name lookup (`lib.B.s()` compiles when `s` is declared on `B`'s superclass `A`), and `ClassToAPI` materialises them as `staticInherited` on the module side. The Merkle PoC handles them, with tests for mixed, pure-Java and cross-subproject hierarchies (`merkle-java-static*`).
- **Inheritance edges had the same conflation:** `object B extends A` looked like `trait B extends A`, so a private change in `A` recompiled subclasses of `trait B` ([sbt/zinc#1795](https://github.com/sbt/zinc/issues/1795), fixed).
- **`AnalysisCallback4`** (commit 0a463347a) adds `ClassRef` (a name plus a `NameKind` of `Term` or `Type`) to dependency edges. It also adds a `usedName` overload carrying `qualifierKinds`: the namespace the name is *selected from* (class, object, or unknown, e.g. for an import selector). Zinc does not consume it yet; it is groundwork for #1796.
- **Still conflated:** whether the *referenced name itself* is a term or a type. A class mentioning only the type `A` is invalidated when the `object A` signature line changes. Cheap in practice, because each member has its own name hash and only the class/object header shares the name `A` (#1796, "related").

<!-- break -->

**The key-space ladder** (each rung is more precise and needs more from the compiler):

| Key | Example | Sound if… | Status |
|---|---|---|---|
| simple name | `x` | name hash covers all defs named `x` | today |
| name × `UseScope` | `x`@Implicit | scope-specific semantics are hashed separately | today (implicits → unconditional) |
| name × qualifier namespace | `x` from `object A` | companions get separate hashes | callback ready, Zinc pending (#1796) |
| name × referenced namespace | type `A` vs term `A` | term and type hashes are separated | open |
| (qualifier class, name) | `A#x` | *failed* lookups are recorded too (extension methods, implicit conversions: `a.foo` resolving elsewhere because `A` *lacks* `foo`) | not attempted |
| symbol | `A#x(I)J` | additions are impossible (closed world) | unsound for Scala |

<!-- break -->

**In the terms of §2 and §22:**

- $U(d)$ is the abstraction of $d$'s query trace, and the name kind is the *key type*.
- Coverage requires every lookup, including failed ones, to map to a recorded key. The qualified rungs are sound only if the compiler also records *misses*: "looked for `foo` in `A`, didn't find it, fell back to an extension". That is a new bridge obligation, and it is exactly where Scala's extension methods, implicit conversions and `Dynamic` make lookup non-local.
- Precision improves monotonically down the ladder, but each rung adds a coverage obligation that an extractor bug can silently violate, turning an overcompilation fix into an undercompilation bug.

**Discussion:**

- Which rung pays for itself? Measure the share of invalidations caused by name collisions on unrelated qualifiers (e.g. `size`, `apply`, `map`) in a large build's invalidation logs.
- Should "failed lookup" be a first-class recorded event in both compilers? It would also make implicit/extension invalidation precise instead of unconditional (§15a).

## Part III — How we got here, and how everyone else does it

### 13. History

Three lanes moved at different speeds: what Zinc computes, where the bridge lives, and how its state is stored. The table gives the dates; the next card picks out the four turning points the rest of the talk builds on.

| Year | Algorithm | Bridge | Persisted state |
|---|---|---|---|
| 2009 | API extraction, member-level `Structure` (Harrah) | compiled from source per Scala version | text format |
| 2013 | name hashing (Kossakowski) | | interned format (Pants) |
| 2016 | class-based dependency tracking | | |
| 2017 | Zinc 1.0 | `compiler-interface` as a Java API | protobuf, relocatable |
| 2020 | pipelining (early output) | Dotty owns its bridge | `VirtualFile` |
| 2023 | | Scala 2 bridge in-tree (2.13.12) | |
| 2024 | macro / inline invalidation fixes | | consistent format; hashes replace timestamps |
| 2026 | Zinc 2.x; companion / inheritance precision | `AnalysisCallback4` | interning fixes |

#### 13a. Four turning points

**1. From a compiler flag to a build-tool library (2008–2013).** scalac's own `-make` mode didn't hold up ("Incremental compilation is broken", [scala/bug#354](https://github.com/scala/bug/issues/354); Java/Scala dependencies, [scala/bug#2889](https://github.com/scala/bug/issues/2889)). Mark Harrah's sbt 0.7–0.10 moved the logic out of the compiler: an API-extraction phase, source-level invalidation, the member-level `Structure` that §7–10 question (2009), and a bridge compiled from source for each Scala version. A standalone Typesafe `zinc` (nailgun) then served Maven, Gradle and Pants.

**2. Precision, one refinement of π and U at a time (2013–2016).** Name hashing by Grzegorz Kossakowski ([`memberRef`/`inheritance`](https://github.com/sbt/zinc/commit/33635302cd73adbaf8c21476828bdae092610bc7), [algorithm](https://github.com/sbt/zinc/commit/e6c04434055657b679cbb50c2a1e6997a657b0f6)) split the API by name (§3). Class-based tracking ([sbt/zinc#86](https://github.com/sbt/zinc/pull/86)) shrank the graph's nodes from files to classes. It also produced the first feature-specific special case: sealed hierarchies needed [their own handling](https://github.com/scala/scala/commit/14a5784fad6537a42cf67ae355122d3462cac1e3) (§16(b)).

<!-- break -->

**3. Zinc as a product for other build tools (2017–2020).** Zinc 1.0 (Lightbend + Scala Center) gave build tools a Java API, protobuf analysis and relocatable, cacheable state ([#216](https://github.com/sbt/zinc/pull/216), [#218](https://github.com/sbt/zinc/issues/218)). `VirtualFile` ([#712](https://github.com/sbt/zinc/pull/712)) and build pipelining ([scalac `-Ypickle-java`](https://github.com/scala/scala/commit/b066d7e6402820879a970d6a88635018b8512dfe), [early output/analysis](https://github.com/scala/scala/commit/7b88ad4e5f2baba971a3461a45a19a090da319f1)) followed. This leads to Part VI, where hermetic builds skip Zinc altogether.

**4. Ownership moves to the compilers (2020–2026).** Dotty shipped its own bridge from the start (`CompilerInterface2`, [scala/scala3#10607](https://github.com/scala/scala3/pull/10607)), and the Scala 2 bridge moved in-tree in 2.13.12 ([scala/scala#10472](https://github.com/scala/scala/pull/10472)). The consequences are Part V's drift risks. In parallel, state became deterministic (consistent format, [#1326](https://github.com/sbt/zinc/pull/1326); hashes instead of timestamps, [#1430](https://github.com/sbt/zinc/pull/1430); Scala 3 pipelining, [scala/scala3#18880](https://github.com/scala/scala3/pull/18880)). The 2025–26 wave of macro, pattern-match and determinism fixes (§15–16, Notes N1) are the most recent.

### 14. Prior art: everyone converged on the same three ideas

ABI summaries · fine-grained use tracking · content addressing.

| System | Summary ($\pi$) | Use tracking ($U$) | Notable |
|---|---|---|---|
| GHC | `.hi` interface fingerprints | per-entity usages | cross-module inlining → unfoldings are part of the interface |
| Kotlin IC | ABI snapshots | lookup tracker (scope, name) | near-isomorphic to name hashing; `inline fun` bodies are ABI |
| Swift driver | `.swiftdeps` | fine-grained provides/depends | same name-filtered fixed point |
| rustc | query fingerprints, red/green | query dependency graph | demand-driven rather than phase-driven |
| Gradle (Java) | class ABI | class-level | historically full recompile on constant change |
| Bazel / Buck | `ijar`/`hjar`, ABI jars | target-level | skip the compiler entirely if ABI bytes are equal |
| TypeScript | `.d.ts` / `.tsbuildinfo` | file + signature hash | project references |

<!-- break -->

**Best practices to extract:**

- Derive summaries from the **same typed trees codegen sees**.
- Make summaries **canonical**: no positions, fresh names or iteration order.
- Treat **cross-module inlining as ABI**.
- Use **content hashes, not timestamps**; make state **relocatable and reproducible**.
- Keep a **differential oracle** (incremental ≡ clean) in CI.
- Log *why* each unit was invalidated.
- Offer a **one-command bug report** for a user who just hit under- or overcompilation, capturing enough state to replay the build as a test (Notes N2).
- Members-vs-decls (§7–10) is a place where systems diverge. Add a row to the table once verified.
