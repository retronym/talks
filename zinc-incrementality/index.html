## Part IV — Where it breaks: language features vs incrementality

### 15. Three worked examples: implicits, value classes, macros

One slide each. Show the code, ask the room "what must recompile?", then show what Zinc records and why. All examples come from Zinc's own scripted tests (`zinc/src/sbt-test/`).

**What 15a–c have in common:** in each case the client's compiled output depends on information *not reachable from the names it wrote*. Implicit scope, erased representation and macro observation are the three main gaps, and each needed its own mechanism added to name hashing.

#### 15a. Implicits: resolution depends on names you never wrote

*Shadowing* (`source-dependencies/implicit-search`):

```scala
// B.scala
object B { implicit val x: Ordering[Int] = ??? }
// A.scala  v1: object A        v2: object A { val x = 1 }
// C.scala
object C { import A._, B._; implicitly[Ordering[Int]] }
```

- Adding an *unrelated, non-implicit* `val x` to `A` shadows `B.x` in `C`'s scope. The implicit is no longer eligible, so resolution silently falls back to `Ordering.Int`, and `C`'s behaviour changes (`???` stops throwing).
- Likely mechanism (verify with the invalidation log): `C`'s used names include `x`, the name of the implicit it selected. Eligibility is name-based, so name hashing happens to model it.

<!-- break -->

*Implicit scope through the type hierarchy* (`companion-object-implicit-scope`):

```scala
trait A; object A { implicit val sad: Pretty[A] = ... }
trait B extends A
class D extends B
object User { implicitly[Pretty[A]].show(new D) }
```

- `User` reaches `A`'s companion through implicit scope; adding an ordinary `def y` to `object A` recompiles 0 files, as it should.
- Removing `sad` must break `User`.

*Modifier as API* (`implicit-params`): making `(implicit y: E)` explicit must break the call site `x(3)`.

<!-- break -->

**What Zinc does:** implicit members get their own name hashes (`UseScope.Implicit`), and **any** change to an implicit member invalidates **all** `memberRef` clients of that class, with no name filtering (`MemberRefInvalidator`).

- That is sound only for classes the client already depends on. The *negative* case is open: a client whose resolution would change because a *new, better* candidate appears somewhere it never referenced. Removing `implicit` was reported as not noticed ([sbt/zinc#945](https://github.com/sbt/zinc/issues/945), still open), though a 2.13.y probe of the inherited-trait shape found no bug ([retronym/zinc#14](https://github.com/retronym/zinc/pull/14), "tried, no bug found"); Scala 3 constructor implicits ([scala/scala3#18309](https://github.com/scala/scala3/issues/18309)).
- Scala 3 `given`s, `using` clauses, and `given` imports (`import A.given`) make implicit scope larger and more structured, so the same problem applies to more constructs.

#### 15b. Value classes: erasure makes representation observable

`source-dependencies/value-class-underlying`:

```scala
class A(val x: Int) extends AnyVal      // → class A(val x: Double) extends AnyVal
object B { def foo: A = new A(0) }
object C { val duck = B.foo; println(duck) }
```

- At Scala level, `B`'s API is unchanged (`foo: A`); `B.scala` isn't even edited. At the JVM level, `B.foo()I` becomes `B.foo()D`. `C`'s bytecode still calls the old descriptor, so it fails with `NoSuchMethodError`.

```mermaid
flowchart LR
  C["C.class<br/>invokes B.foo()I"] -- "memberRef: foo" --> B["B.foo : A<br/>(Scala signature unchanged)"]
  B -- "descriptor = E(A)" --> A["A extends AnyVal<br/>underlying: Int → Double"]
  C -. "observes E(A) = E(underlying(A))<br/>without naming x" .-> A
```

<!-- break -->

**In the terms of §2:** $C$'s output contains the descriptor of `B.foo`, so $C$ observes $f(A) = \mathrm{underlying}(A)$:

$$E(\mathrm{sig}_B(\mathit{foo})) = E(A) = E(\mathrm{underlying}(A))$$

- $\pi(B)$ is unchanged, which makes this a counterexample to soundness if $C$'s dependency is keyed only on `B.foo`.
- The observation reaches $A$ *through* $B$'s signature, but it is about $A$'s contents, not about any member of $A$ that $C$ names. $C$ never mentions `x`.

**Fix:** make $\pi(A)$, under the *name* `A`, determine $E(A)$. ExtractAPI adds the underlying type to a value class's ancestor types (comment in `mkStructureWithInherited`), so the hash for name `A` changes.

- This relies on `C` "using" the name `A`. It does, because used names come from *typed* trees, so the inferred type of `duck` counts.
- The expected invalidation log: cycle 1 detects modified names `A`, `A;init;`, `x`; `B` and `C` are both invalidated because both use name `A`; cycle 2 finds nothing further.

<!-- break -->

- `source-dependencies/value-class`: toggling `extends AnyVal` on/off changes erased signatures of every method mentioning `A`. One case flips `null` from legal to illegal (`-> compile` expected); another is a pure binary change that must recompile to *run*.
- **General lesson:** $\pi$ is a *Scala-level* summary, but clients link against *JVM-level* descriptors. Anything that changes erasure without changing the Scala signature needs a hook: value classes, opaque types (open question), `@specialized`, SAM vs non-SAM, varargs, Java generic signatures.

#### 15c. Macros: the expansion depends on whatever the macro looked at

*Macro inspects a type argument* (`macros/macro-type-change`):

```scala
def hasAnyField[T]: Boolean = macro hasAnyFieldImpl[T]   // reads weakTypeOf[T].members
class A                       // → class A { val hello = "" }
Macros.hasAnyField[A]         // false → must become true
```

- The client names only `A` as a type argument. The macro read `A.members`.
- Fixed by recording type arguments of macro calls as `DependencyByMacroExpansion` ([sbt/zinc#1316](https://github.com/sbt/zinc/pull/1316); Scala 3 port [scala/scala3#23900](https://github.com/scala/scala3/pull/23900)).
- That new edge kind was then silently dropped by the new analysis format until [#1432](https://github.com/sbt/zinc/pull/1432).

```mermaid
flowchart LR
  APP["App: hasAnyField[A]"] -- "memberRef: hasAnyField" --> M["Macros"]
  APP -- "DependencyByMacroExpansion<br/>(type argument)" --> A["A"]
  M -. "expansion reads A.members" .-> A
```

<!-- break -->

*Macro erases its argument's dependency* (`macros/macro-arg-dep`):

```scala
def printTree(arg: Any): String = macro ...   // expands to Literal(arg.tree.toString)
object Client { Provider.printTree(Foo.str) }  // remove Foo.str → Client must fail
```

- After expansion, the tree is a string literal, and the reference to `Foo.str` is *gone*. Dependency extraction must traverse the pre-expansion tree (the macro-expansion attachment), not only what typer left.

*The macro implementation changes:* any change in a file that declares a macro invalidates all clients unconditionally. Clients of a macro defined upstream additionally recompile transitively ([warning + opt-out](https://github.com/sbt/zinc/commit/083b432e9bbd91d5ae8ab4a227b85ccdfdef8e42)), which is sound but expensive ([sbt/zinc#1333](https://github.com/sbt/zinc/issues/1333)).

<!-- break -->

*Scala 3* (quotes reflection can walk anything):

- `macwire`'s `wire[Dep]` reads `Dep`'s constructor; changing it isn't detected ([sbt/zinc#1574](https://github.com/sbt/zinc/issues/1574), [scala/scala3#23852](https://github.com/scala/scala3/issues/23852), [#24969](https://github.com/scala/scala3/pull/24969)).
- Macro annotations' `transform` isn't tracked ([#22999](https://github.com/scala/scala3/issues/22999)).
- Feature request: "make Zinc Scala 3 macro-aware" ([sbt/zinc#1478](https://github.com/sbt/zinc/issues/1478)).
- Scala 2 still has gaps. #1316 only covers the macro's *type arguments*. Macros that read the members of a *value* argument's type, or of types reachable from the type argument (as derivation macros do), are still missed on 2.13.y (`macro-value-arg-type-members`, `macro-type-arg-nested-members`, [retronym/zinc#14](https://github.com/retronym/zinc/pull/14)). Cheap fix: treat value-argument types as macro-expansion dependencies. Precise fix: the compiler reports the symbols a macro looked up, which a `TODO` in the bridge's `Dependency` already asks for.

**Discussion:** a precise fix is to **record every symbol the macro observes** by instrumenting `Context`/`Quotes` reflection, and emit those as dependencies of the expansion site. This is a compiler-side change that only the compiler teams can make.

### 16. A taxonomy (organise by kind of observable, not by feature)

**(a) Bodies that are API.** The client's bytecode embeds the implementation.

- Scala 3 `inline`: nested inline calls missed ([scala/scala3#11861](https://github.com/scala/scala3/issues/11861) → [#12931](https://github.com/scala/scala3/pull/12931)); inherited inline defs overcompiled ([62dfdaf6](https://github.com/scala/scala3/commit/62dfdaf6226db9cc4ef42b4534a4fe4904b9fda6)).
- Scala 2 `@inline` + `-opt:inline`: broken from 2018 to 2023 ([sbt/zinc#537](https://github.com/sbt/zinc/issues/537) → [#1310](https://github.com/sbt/zinc/pull/1310)).
- Constant folding (`final val`, Java `static final`).
- Trait bodies mixed into subclasses (`extraHash`).

**(b) Non-local or negative information.** Meaning depends on what *else* exists, or on what *doesn't*.

- Sealed children determine exhaustivity; `useOptimizedSealed` broken on 2.13 ([sbt/zinc#1229](https://github.com/sbt/zinc/issues/1229)).
- Implicit/given resolution observes shadowing, implicit scope and the *absence* of a better candidate (§15a).
- Pattern matching observes `unapply` shape and arity; see (i).
- SAM conversion adds an inheritance edge the source never spells out ([sbt/zinc#830](https://github.com/sbt/zinc/issues/830) → [scala/scala#10617](https://github.com/scala/scala/pull/10617), [scala/scala3#16996](https://github.com/scala/scala3/pull/16996)).
- Inherited members (§7–10) belong in this category too, and are the *reason* $\pi$ is member-level.

<!-- break -->

**(c) Generated code.** The expansion depends on things the call site never names.

- Macros, def and annotation, Scala 2 and 3 (§15c).

**(d) Synthetic owners.** Definitions that don't map 1:1 to source classes.

- Exports ([scala/scala3#11841](https://github.com/scala/scala3/issues/11841)), top-level defs ([#18447](https://github.com/scala/scala3/issues/18447), [#13994](https://github.com/scala/scala3/issues/13994)), package objects, companion pairing.

**(e) Nondeterminism.** $\pi$ changes when nothing observable did (overcompilation).

- Context-bound evidence names ([scala/scala3#19132](https://github.com/scala/scala3/pull/19132)), refinement owners ([sbt/zinc#1782](https://github.com/sbt/zinc/pull/1782)), [scala/scala3#26434](https://github.com/scala/scala3/issues/26434), [#25520](https://github.com/scala/scala3/issues/25520), whitespace changing line numbers ([sbt/zinc#718](https://github.com/sbt/zinc/issues/718)).

**(e′) Erasure and representation.** The JVM descriptor changes while the Scala signature doesn't: value classes (§15b), `@specialized`, varargs, Java generic signatures.

**(f) Cross-language and pipelining.** The two Java front ends (§6); Java sources invalidated every cycle ([#918](https://github.com/sbt/zinc/issues/918), [#867](https://github.com/sbt/zinc/issues/867), [#1819](https://github.com/sbt/zinc/issues/1819)).

**(g) The compiler itself isn't robust to incremental inputs.** Stale-symbol crashes ([scala/scala3#17152](https://github.com/scala/scala3/issues/17152), [#13532](https://github.com/scala/scala3/issues/13532)).

<!-- break -->

**(h) Desugaring hides the identifier the user wrote.** Used names come from the *typed* tree, so a name the user wrote but the compiler rewrote away is never recorded.

- `x += y`: the typer first tries a member `+=`; if there is none, it rewrites to `x = x + y`. The typed tree mentions `+` (and `x_=` for a field) but not `+=`. If upstream later *adds* a `+=` member, resolution changes, but `+=` isn't in $U(d)$. This is a negative lookup that was never recorded (§12). Confirmed on 2.13.y by the pending scripted test `assign-op-member-added` ([retronym/zinc#14](https://github.com/retronym/zinc/pull/14)). The draft fix ([retronym/zinc#15](https://github.com/retronym/zinc/pull/15)) registers `op=` when the selection's source position reads `op=`, so a hand-written `x = x op y` doesn't match.
- The same shape appears wherever syntax expands to a name chosen by fallback:
  - `a(i) = v` becomes `update`;
  - `x.f = v` becomes `f_=`;
  - an inserted `apply`;
  - for-comprehensions becoming `map`/`flatMap`/`withFilter` (with Scala 2's fallback to `filter`);
  - `Dynamic`: `d.foo` is typed as `d.selectDynamic("foo")`, so `foo` is never a used name. Confirmed by `dynamic-member-added` ([retronym/zinc#14](https://github.com/retronym/zinc/pull/14); draft fix [retronym/zinc#17](https://github.com/retronym/zinc/pull/17)), and known since a `pendingUntilFixed` test from the name-hashing work (gkossakowski/sbt#4);
  - string interpolators becoming `StringContext`.
- ExtractUsedNames already walks `TypeTree.original` and pre-expansion macro trees for this reason. Desugarings with no retained original need either the *source-level* name recorded as well, or the fallback recorded as a failed lookup.
- The proposal in #14 covers (h) and (i) together: the typer records "names looked up while typing this tree", e.g. as an attachment. That handles `+=`, `Dynamic`, `unapply`/`unapplySeq` and name-based extractors without per-case heuristics. It is ask 6 (§23) as a concrete mechanism.

<!-- break -->

**(i) Post-typer phases decide from names not yet in the tree.** Scala 3's `ExtractDependencies` runs before `PatternMatcher`, so calls the matcher *will* emit don't exist yet when used names are extracted.

- **`case C(x, y)`** lowers to `C.unapply` plus `_1()`, `_2()`. The synthetic case-class `unapply` has signature `(C): C`, so its hash never changes when field types change. `_1` and `_2` were never recorded. The result was a field type change producing `NoSuchMethodError` at runtime, in *every* Scala 3 version ([scala/scala3#26231](https://github.com/scala/scala3/issues/26231)).
- **Variants of the same blind spot:**
  - adding a field (a one-element pattern only calls `_1`);
  - adding `unapplySeq` next to `unapply`, or the reverse (only the method actually called was recorded);
  - a product extractor growing past the bound arity;
  - name-based `isEmpty`/`get`, and `lengthCompare`/`apply`/`drop` for sequence patterns.
- **The fix** ([#26262](https://github.com/scala/scala3/pull/26262), 3.10.0-RC1) records what the later phase will consult, including *anticipatory* keys for names that don't exist yet:
  - the primary constructor `C;init;`, whose name encodes the whole parameter list, for synthetic case-class unapplies;
  - both `unapply` and `unapplySeq` on every extractor pattern;
  - each `_N` selector, plus a sentinel `_N+1`, so growing the product invalidates.
- **Scala 2 has the same blind spot.** On 2.13.y, `extractor-unapply-added-beside-unapplyseq` and `name-based-extractor-get-type` ([retronym/zinc#14](https://github.com/retronym/zinc/pull/14)) fail for the same reason: the typer tries `unapply` before `unapplySeq` and only the one found is recorded, and patmat selects `isEmpty`/`get`/`_N` after the extraction phases. The draft fix ([retronym/zinc#15](https://github.com/retronym/zinc/pull/15)) mirrors #26262. Recording `get` everywhere costs some precision, because `get` is a common name.
- **General rule:** if a phase after extraction makes a decision by *name* (pattern matcher, erasure, mixin, specialization), then extraction must record those names up front, or run after that phase. This is the coverage obligation of §22 applied to phase ordering.

<!-- break -->

**(j) Parts of a definition the extractors skip.** Information callers observe that neither `ExtractAPI` nor `Dependency`/`ExtractUsedNames` visits. All confirmed on 2.13.y by pending tests in [retronym/zinc#14](https://github.com/retronym/zinc/pull/14).

- **Annotations on definitions.** After typer they live only in `sym.annotations`, which nothing traverses. So there is no dependency on the annotation class or its constant arguments (`annotation-class-signature-change`, `annotation-constant-arg`). The draft fix ([retronym/zinc#19](https://github.com/retronym/zinc/pull/19)) walks `AnnotationInfo.original`; folded constants such as `@SerialVersionUID(C.X)` keep their original tree as an attachment.
- **Parameter annotations.** `MethodParameter` carries none, so removing `@deprecatedName` doesn't change the API that callers using the old name depend on (`deprecated-name-removed`; draft fix [retronym/zinc#20](https://github.com/retronym/zinc/pull/20) encodes them as an `Annotated` parameter type). Adding a field to `MethodParameter` instead would be a `compiler-interface` change, with the binary-compatibility cost of §11.
- **Declared literal types.** `dropConst` widens `def x: 1` and `var v: 1` to `Int` in the API (`def-literal-return-type`, `var-literal-type`; draft fix [retronym/zinc#18](https://github.com/retronym/zinc/pull/18)). Only stable vals kept their constant types.
- **Java sealed `permits`.** Without pipelining, the Java API comes from `ClassToAPI`, whose `childrenOfSealedClass` only handled enums, so exhaustivity against a Java sealed interface missed a new subclass (`java-sealed-permits-exhaustivity`; draft fix [retronym/zinc#21](https://github.com/retronym/zinc/pull/21) reads `Class.getPermittedSubclasses`).

### 17. Incrementality is the forgotten dimension of feature design

- A SIP or feature PR covers syntax, typing, erasure, binary compatibility and TASTy compatibility, but never "which new observables does this introduce, and where are they hashed?"
- **Time-to-fix as evidence:** `@inline` + optimizer took 5 years; refinement-owner instability was open for years; Scala 3 patmat existed since 3.0 and was found in 2026.
- **Who finds these:** users of large builds and IDE vendors (IntelliJ runs Zinc in its IC tests, [scala/scala3#21179](https://github.com/scala/scala3/issues/21179)), not feature authors.
- **MiMa analogy:** MiMa made "is this binary compatible?" a mechanical PR-time check. We can do the same for incremental soundness.
- **Determinism is a shared precondition:** unstable synthetic names are both overcompilation bugs and reproducible-build bugs ([scala/scala-dev#405](https://github.com/scala/scala-dev/issues/405)).

## Part V — The machinery we maintain

### 18. The compiler bridge: architecture, relocation, drift

```mermaid
flowchart TB
  subgraph ZINC["sbt/zinc"]
    CI["compiler-interface<br/>(Java xsbti.*, MiMa-checked)"]
    ZC["zinc-core: invalidator, Analysis"]
    ZB["compiler-bridge for Scala ≤ 2.13.11"]
  end
  subgraph S2["scala/scala"]
    B2["scala2-sbt-bridge (2.13.12+)"]
  end
  subgraph S3["scala/scala3"]
    B3["scala3-sbt-bridge"]
  end
  ZB -- implements --> CI
  B2 -- implements --> CI
  B3 -- implements --> CI
  ZC -- "loads bridge into the<br/>compiler's classloader" --> B2
  ZC --> B3
  ZC --> ZB
```

- **Architecture:** `compiler-interface` (Java `xsbti.*`, stable, MiMa-checked) ⟵ *bridge* (compiler-specific: extraction phases + callbacks) ⟵ loaded by Zinc into the compiler's classloader. Originally Zinc shipped bridge *sources* and compiled them on first use per Scala version.

<!-- break -->

**Relocation:**

- 2016: [sbt/zinc#78](https://github.com/sbt/zinc/issues/78) proposes splitting interface and bridge out.
- 2019: first in-tree attempt closed for lack of motivation ([scala/scala#8531](https://github.com/scala/scala/pull/8531)).
- 2020: Scala 3's bridge is in-tree from the start.
- 2023: [scala/scala#10472](https://github.com/scala/scala/pull/10472). Code actions/quick fixes needed lock-step bridge changes; history kept via filter-branch ([80e8df93](https://github.com/scala/scala/commit/80e8df93f854e8bb5ba7971c2af4d85671ccda08)); precompiled bridge ships with 2.13.12 ([forum](https://contributors.scala-lang.org/t/scala-2-13-12-in-source-sbt-compiler-bridge-clarifications/6289)).
- Porting the scripted tests ([scala/scala#10554](https://github.com/scala/scala/pull/10554)) immediately found a missing invalidation ([scala/bug#12887](https://github.com/scala/bug/issues/12887) → [sbt/zinc#1268](https://github.com/sbt/zinc/issues/1268)).

**Benefits:** the bridge evolves with compiler internals; no compile-on-first-use; the people who own the language also own $\pi$.

<!-- break -->

**Drift risks:**

- **Three bridges** (Zinc's for ≤ 2.13.11, scala/scala's, scala3's) and three copies of the scripted suite. Fixes land in one place:
  - forward-ports ([scala/scala#10542](https://github.com/scala/scala/pull/10542));
  - Zinc PRs now carry "may also need to be applied in scala/scala and scala/scala3" ([#1782](https://github.com/sbt/zinc/pull/1782));
  - a live example: forward-porting five Zinc bridge fixes (#1316, #1324, #1507, #1782, #1803) to `scala2-sbt-bridge` ([scala/scala#11287](https://github.com/scala/scala/pull/11287), open), while the same batch is backported to Zinc 1.x ([sbt/zinc#1838](https://github.com/sbt/zinc/pull/1838), [#1839](https://github.com/sbt/zinc/pull/1839)). The same fix has to land on four branches. [retronym/zinc#14](https://github.com/retronym/zinc/pull/14) turns the lag into failing tests: `*-213-bin` copies of scripted tests (`constructors-unrelated-2`, `type-lambda-refinement-owner`, `compound-type-member-inheritance`, `module-inheritance-extra-hash`) that pass on Zinc's own bridge and fail on `scala2-sbt-bridge` until the fixes are ported.
- **Version matrix** (Zinc × compiler). New `xsbti` APIs must degrade on old Zinc (the lazy `DiagnosticCode` trick, [scala/scala3#15565](https://github.com/scala/scala3/pull/15565); `CompilerInterface` vs `CompilerInterface2`, [#10816](https://github.com/scala/scala3/issues/10816)).
- **Implicit protocol:** callback ordering and completeness are unwritten (`dependencyPhaseCompleted` under pipelining, [scala/scala3#27139](https://github.com/scala/scala3/issues/27139) / [sbt/zinc#1823](https://github.com/sbt/zinc/pull/1823); `generatedNonLocalClass` regression breaking IntelliJ, [#21179](https://github.com/scala/scala3/issues/21179)).
- **Release coupling:** a bridge fix reaches users only with the next compiler release. Users on an old compiler never get it, even with a new sbt.
- **Packaging:** `scala3-sbt-bridge` was published depending on a never-published compiler ([scala/scala3#23604](https://github.com/scala/scala3/issues/23604)).
- **Design decisions get frozen:** members-vs-decls (§7–10) now needs coordinated changes in three repos plus Zinc's hashing.

<!-- break -->

**Mitigations:**

- Zinc runs its scripted suite against the *released* in-tree bridges, selected by label, with provenance checks ([sbt/zinc#1837](https://github.com/sbt/zinc/pull/1837)).
- One canonical scripted corpus consumed by all three repos, instead of forks.
- Specify the callback protocol (ordering, mandatory callbacks per phase) and add a conformance test.

### 19. How Zinc is tested, and where the oracle is weak

- **Scripted** (`zinc/src/sbt-test/`): ~170 `source-dependencies/*` plus `macros`, `pipelining`, `apiinfo`, `reporter`. File swaps, `> compile`, `> checkRecompilations n A B`, `-> compile`. The oracle is hand-written expected recompile sets.
- **Bridge unit tests:** compile snippets, assert on extracted API, used names and class names; Hedgehog properties for analysis invariants.
- **Cross-version bridge tests:** rerun whenever a bridge changes.
- **Benchmarks:** `zinc-benchmarks`, including `AnalysisFormatBenchmark`.
- **Downstream:** scala/scala `sbtTest/scripted`, scala3 `sbt-test/` and `IncrementalCompileSimulator` ([#26262](https://github.com/scala/scala3/pull/26262)), IntelliJ IC tests, community build.

<!-- break -->

- **Weakness:** scripted checks *how much* was recompiled, not *that the result equals a clean build*.
- **Behaviour-level checks miss bytecode differences.** In the Merkle PoC, a missing mixin forwarder is usually invisible at runtime: the JVM resolves the trait's default method instead. It shows only when the trait overrides a *class* member, because class methods win JVM resolution, so the PoC's first trait test passed with the rule disabled and it took a second, `merkle-trait-override`, to discriminate. Comparing incremental and clean output bytes would have caught it directly.
- **Where bugs come from:** field reports from large builds, and lately LLM-driven exploration. Many of the autumn 2026 batch were found by LLM agents writing probing scripted tests (Notes N1). Field reports are hard to turn into tests because the user's pre-change state is gone (Notes N2).
- **Proposals:**
  - After every scripted step, also clean-build and compare outputs (differential testing).
  - Generate edit sequences by mutating upstream APIs (property-based or fuzzed), relying on deterministic output.
  - Generalise the Scala 3 simulator so feature authors can write `v1/v2/client` tests next to the feature.

## Part VI — Avoiding compilation altogether

### 21. Layers of avoidance

```mermaid
flowchart LR
  IN["Build request"] --> L1{"Action cache hit?<br/>(content-addressed inputs)"}
  L1 -- yes --> DONE["Nothing runs"]
  L1 -- no --> L2{"Upstream ABI jar<br/>byte-identical?"}
  L2 -- yes --> DONE2["Skip module,<br/>don't even load Analysis"]
  L2 -- no --> L3["Zinc: compile a few files"]
```

- **Don't run** (action-cache hit) ⊃ **don't compile the module** (ABI unchanged) ⊃ **compile a few files** (Zinc).
- **Hermetic builds** (Bazel, Pants, sbt 2 remote cache): inputs are content-addressed (sources + dependency ABI jars + flags). A hit means no Zinc at all.

<!-- break -->

- **JAR-equivalence / ABI jars:** if upstream's ABI jar (pickles/TASTy-only, Zinc early output, Bazel `ijar`) is byte-identical, downstream is skipped without even loading its analysis. This requires:
  - reproducible compiler output ([scala/scala-dev#405](https://github.com/scala/scala-dev/issues/405); absolute paths under `-Xcheckinit`, [scala/bug#12698](https://github.com/scala/bug/issues/12698)), including joint ≡ separate (§6);
  - reproducible jars (timestamps, entry order);
  - reproducible, machine-independent analysis ([#218](https://github.com/sbt/zinc/issues/218), `WriteMapper`, `VirtualFile`, hashes instead of timestamps). The consistent format was built for this: identical state gives identical bytes, so Bazel can skip ([#1326](https://github.com/sbt/zinc/pull/1326); author reports ~27k Bazel targets using it).
- **Pipelining:** downstream starts on upstream pickles before codegen; early analysis lets downstream name-hash against it.
- **Where Zinc still matters:** large single targets, IDE/BSP loops, the inner dev loop. There, $\pi$'s precision (and its size, §9) is what users feel.

## Part VII — Can we prove it? A mechanised model (Lean)

### 22. Formalising incremental compilation

**Is there scope?** Yes, provided we prove Zinc's algorithm sound *relative to stated obligations on the compiler*, rather than verifying scalac. That is the useful result: the hypotheses of the theorem *are* the bridge spec that §17 and §23 ask for. The model exists: `lean/` in this directory, Lean 4 + Mathlib, ~1100 lines, no `sorry`. Theorem names below refer to it.

```mermaid
flowchart TB
  U["Unit d"] --> F["F_d : (Query → Answer) → Out"]
  F -- "queries: lookup, members,<br/>erasure, implicits, sealed,<br/>inline body, macro observe" --> ENV["Env = iface(outputs of others)"]
  ENV -- answers --> F
  F --> O["Out"]
  F -. "trace abstracted to keys" .-> UK["U(d) ⊆ Key"]
  ENV -. "answers hashed per key" .-> PI["π : Class → Key → Hash"]
```

<!-- break -->

**The model of the compiler:**

1. **Compilation units with an explicit environment.** The per-unit compiler is a *query tree*: it either returns, or asks a typed query and continues with a function of the answer. Running it against an oracle $e : \mathit{Query} \to \mathit{Answer}$ gives the output; the *trace* is the list of queries asked. This is the free monad of *Build Systems à la Carte* (Mokhov, Mitchell, Peyton Jones, ICFP 2018), applied *inside* the compiler:

$$F_d : (\mathit{Query} \to \mathit{Answer}) \to \mathit{Out}$$

2. **Purity** needs no axiom: the output is a function of the source and the answers, by the type of $F_d$. Scala 2's mutable global symbol table, `Symbol.id` in sort keys and iteration order (§16(e)) are exactly the back-channels this type forbids.
3. **Every query and key is addressed to a unit:** $\mathit{Query} = \mathit{Class} \times Q$, $\mathit{Key} = \mathit{Class} \times K$. A multi-scope lookup is a sequence of per-scope queries, which is also how Zinc records it (one `memberRef` edge per class). A *negative* lookup is an ordinary query whose answer is `none`.
4. **Joint compilation** is a black box $\mathit{group}(G, \mathit{src}, e)$ with the **compositionality axiom (§6)** in its usable form: the joint result is a fixed point of the per-unit tasks, with group-mates answered from their fresh interfaces:

$$\forall d \in G.\ \mathit{group}(G, \mathit{src}, e)(d) = F_d\big(e[G \mapsto \mathrm{iface} \circ \mathit{group}(G, \mathit{src}, e)]\big)$$

5. **Recorded keys.** The bridge records $U(d) = \mathit{keys}(\mathrm{trace}(F_d))$ and the API hash $\pi : \mathit{Iface} \to K \to \mathit{Hash}$. The loop is Zinc's: compile $R_n$ jointly, re-record $U$ for $R_n$, diff hashes, compute $\mathrm{inv}(\Delta)$, stop iff $\mathrm{inv}(\Delta) \subseteq R_n$; the next round is chosen by a pluggable *policy*.

<!-- break -->

**The bridge obligations** (`Compiler.Obligations`), which is what a feature author must discharge:

- **Compositionality** (`comp`): item 4 above. Every §6 bug is a violation.
- **Coverage** (`coverage`): every traced query, including misses (§15a) and closure queries such as `underlying(A)` (§15b), is covered by a recorded key:

$$\forall q \in \mathrm{trace}(F_d).\ \exists k \in U(d).\ q \sqsubseteq k$$

- **Abstraction** (`abstraction`): equal hashes on a key give equal answers to every query it covers. Collision-freedom is carried as a hypothesis:

$$\pi(c)(k) = \pi(c')(k) \implies \forall q \sqsubseteq k.\ \mathrm{ans}_q(c) = \mathrm{ans}_q(c')$$

- **Policy soundness** (`Policy.Sound`), the only thing the heuristics must satisfy: never drop an invalidated unit outside the round just compiled, $\mathrm{inv}(\Delta_n) \setminus R_n \subseteq R_{n+1}$. `transitiveStep`, `recompileAllFraction` and macro-downstream all *enlarge* the set, so they are covered without being modelled individually.

<!-- break -->

**Theorems:**

- **T1, trace soundness** (`Task.run_eq_of_trace`): oracles that agree on the trace give the same output. Induction on the query tree; straightforward.
- **T2, round invariant** (`round_preserves`): a unit is *up to date* if its output is its own compilation against the current interfaces and its keys cover that trace. A round compiling $R \supseteq$ dirty leaves exactly $\mathrm{inv}(\Delta) \setminus R$ dirty. The proof is where coverage and abstraction are used: a key with an unchanged hash gives unchanged answers, and T1 does the rest.
- **T3a, fixed point at termination** (`zinc_sound`): for any sound policy, if the loop stops, no unit is dirty. The final state is a per-unit fixed point of separate compilation.
- **T3b, uniqueness** (`fixpoint_unique_of_wf`, `fixpoint_unique_of_explicit`), **T3** (`zinc_eq_clean_of_*`): the fixed point is the clean build, *given* an extra hypothesis (next card).
- **T4, termination** (`zinc_some_of_*`): the fuelled loop returns within $k + \lvert S\rvert + 1$ rounds for a policy monotone from round $k$ (`transitiveStep`), within 2 rounds with explicit interfaces (§4's "a signature change takes 2"), and within $\mathrm{height} + 2$ rounds for the plain policy on an acyclic graph.

<!-- break -->

**Two findings about Zinc.** Both came out of writing the proof.

1. **`transitiveStep` is what guarantees termination.** Zinc subtracts the round just compiled only in the stop test; the next round is the full $\mathrm{inv}(\Delta_n)$, so classes can be revisited. In the plain regime, a mutually recursive pair whose inferred APIs keep changing ping-pongs forever (in the model). From `transitiveStep` on, the next round also includes $R_n$, so the round set only grows and the loop ends within $k + \lvert S\rvert + 1$ rounds whatever the shape of the class graph (T4).
2. **"At termination the result equals the clean build" is false without a further hypothesis.** Termination gives a per-unit fixed point; the clean build is another one; separate compilation can have several (`A.x: typeof(B.y)`, `B.y: typeof(A.x)` admits any type, joint compilation reports a cyclic reference). This is the problem behind [sbt/zinc#1284](https://github.com/sbt/zinc/pull/1284) ("include mutual dependencies in initial invalidation") and its revert. Two sufficient conditions, each a Scala best practice: **acyclic** unit dependencies, or **source-determined interfaces** (explicit result types on public members, which also bounds the loop at two rounds).

<!-- break -->

**The toy instance (`Toy.lean`, `Examples.lean`):** classes with typed members, an `implicit` flag and an optional `underlying` type; bodies made of `select c.m` (emits a JVM descriptor, so it needs erasure, a *dynamic* chain of `underlying` queries) and `implicitly[T]` over imports (candidates per class, then a shadowing check that is itself a lookup). Two extractors:

| | name-only keys (today's rung 1) | repaired keys (`self`, `implicitScope`) |
|---|---|---|
| §15b value class `Int → Double` | `C` keeps `B.foo()I`: **undercompilation**, `not_obligations_nameOnly` exhibits the uncovered `underlying` query | `(A, self)` changed, `C` recompiled, equals clean |
| §15a new `implicit val y` in `A` | `C` still resolves to `B.x` ([sbt/zinc#945](https://github.com/sbt/zinc/issues/945) family) | `(A, implicitScope)` changed, equals clean |
| §15a shadowing `val x` in `A` | **caught**: the failed `lookup(A, x)` of the shadowing check is a recorded miss | caught |

Each row is an `example` checked by evaluation, so it doubles as a scripted test. The shadowing row is the "name hashing happens to model it" remark of §15a, now a theorem. `repaired_sound` and `repaired_terminates` are the abstract T3 and T4 instantiated: `Obligations` is *proved* for the toy compiler, with $\pi$ a perfect hash.

<!-- break -->

**What the model clarifies:**

- **Members vs decls vs Merkle (§7–10)** are three sound instances of one generalised model (next card): a materialised hash is a non-local hash kept fresh by recompiling the hierarchy; a Merkle hash is the same hash recomputed; decls keys make the walk explicit in $U$. The talk's §10 table is computed from the model.
- **Name kinds (§12)** are the *key type* of the trace abstraction. Each rung of the ladder trades precision against a stronger coverage obligation (record misses).
- **Bridge-side hashing (§11)** is the natural reading: the compiler supplies $\pi(c)(k)$ directly as a hash of the answers to the queries $k$ covers.
- **Macros (§15c):** `macroObserve` queries must be recorded; "invalidate all clients" is the coarsest sound key, $\top$.
- **Joint ≡ separate (§6)** is the compositionality axiom. Determinism is purity.
- **The heuristics** are not special cases: any policy that only *adds* units is sound, and only termination depends on which one. Zinc's hierarchy walk at invalidation time is one such policy (`walkPolicy`), and in the model it turns the materialised design's three rounds into two.

<!-- break -->

**Non-local hashes (`NonLocal.lean`, `Hier.lean`).** To cover materialised members and Merkle composition, $\pi$ may read other units' interfaces, $\pi : (\mathit{Class} \to \mathit{Iface}) \to \mathit{Class} \to K \to \mathit{Hash}$, with a declared read set `hashDeps` (and its reverse, Zinc's `inheritance.reverse`). A key may then cover queries addressed to other units, and *which* queries it covers may depend on the interfaces: `(C, m)` covers exactly the queries the lookup of `m` from `C` walks through. Two things follow:

- **T2′** (`GCompiler.round_preserves`): the round invariant holds provided $\Delta$ is diffed over the *affected* units, $R_n \cup \mathrm{hashDeps}^{-1}(R_n)$, with hashes recomputed from the current interfaces.
- **T2-stale** (`Stale.lean`): diffing over $R_n$ alone undercompiles, with a two-unit counterexample. This is the risk in the bridge's TODO about using parent hashes.

The Merkle hash that makes the per-query model work is the *verifying trace* of the walk (query, answer pairs; Build Systems à la Carte again), which is exactly §10's formula. Hashing only the *resolved* member is sound too, but by a different argument: the client's output depends on the lookup only through its result, which the per-query model cannot see. Materialised members are sound for that reason; Merkle chains are sound for the trace reason.

<!-- break -->

**Members vs decls vs Merkle, computed** (`Hier.lean`): classes with one type parameter, parents with a type argument, a right-to-left linearization walk with misses, clients `X (B.m)`, `Y (C.m)`, `Z (B.g)` over `A ← B ← C`, mixin `M`.

| edit | decls + walk | materialised, plain | materialised + Zinc's walk | Merkle | Merkle, stale $\Delta$ |
|---|---|---|---|---|---|
| `A.m : Int → String` | `X Y`, 2 rounds | `B C X Y`, 3 | `B C X Y`, 2 | `X Y`, 2 | nothing, **wrong** |
| `B extends A[Int] → A[String]`, `A.m : T` | `X Y Z`, 2 | `C X Y`, 3 | `C X Y`, 2 | `X Y Z`, 2 | |
| mixin `M` gains `m` | `Y`, 2 | `C Y`, 3 | `C Y`, 2 | `Y`, 2 | |

Every cell is a checked `example`; `D_obligations`, `W_obligations`, `Mk_obligations` prove all three designs sound. In the model, decls and Merkle never recompile the hierarchy; materialised must, to refresh its hashes, and the walk policy only saves the round. In Scala, descendants whose own type check depends on the change recompile in every design (§10a). On the `asSeenFrom` row materialised is the most precise (`Z` stays; real Zinc recompiles `Z` through the name hash of `B` itself, §10a), decls over-approximates through `(B, parents)`, and the §5 Merkle formula through the parents in its hash.

<!-- break -->

**Future work: questions the model could answer with modest refinement.**

- **Mutual recursion without the acyclic hypothesis.** Model #1284's SCC-closed initial invalidation: if every round is closed under mutual dependency, the group result is the joint fixed point and T3 should follow without acyclicity. That would say whether reverting #1284 traded soundness or only precision, and in which programs.
- **Precision as a theorem.** Minimality relative to $\pi$: no unit outside $\mathrm{inv}(\Delta)$ has a covered key with a changed hash. With it, the rungs of §12 become comparable: prove rung $k+1$ invalidates a subset of rung $k$ given the extra coverage (recorded misses), and measure the gap on the §12 question of `size`/`apply` collisions.
- **Class vs companion (#1796).** A key type with a namespace component; the precision theorem then quantifies what separating the hashes buys.
- **Precision of the three hierarchy designs as a theorem.** The computed table suggests materialised ⊆ Merkle-chain and materialised ⊆ decls on `asSeenFrom` edits, and equality when member types mention no type parameter. State it over all programs of the toy, and add the "resolved-member" Merkle hash as a fourth design to show it matches materialised precision with local storage.
- **Descendants' own checks.** Add override, conflict, abstract-member and header queries from a descendant to its ancestors, keyed on $(Q, n)$, so the decls and Merkle designs recompile exactly the descendants of §10a's condition, and the model can state how many materialised recompiles are refresh-only.
- **Inheritance edges as a measure.** In the materialised design every subclass recompiles on every ancestor edit. Count, on a real analysis, how many of those recompiles change the subclass's own output; the rest is the price of freshness, and the decls or Merkle designs would skip it.
- **Macros and inline.** Add `inlineBody(m)` and `macroObserve(sym)` queries. Then: Scala 3 `inline` needs the *body* in $\pi$, not the signature; the macro-downstream policy is the coarsest sound answer when observation is not recorded, and recording `Quotes` reflection ([sbt/zinc#1478](https://github.com/sbt/zinc/issues/1478)) is the precise one. The cross-project case (behaviour does not flow through the API) is a stated non-coverage.
- **Added and deleted units, and the source level.** $S$ is fixed today. Adding units, deletion, `dependents(deleted)` in $R_0$, the source→class mapping and `recompileAllFraction` at the source level are all absent.
- **Libraries and pipelining.** External units with stamps instead of hashes; pipelining as a *weakened* compositionality obligation, where the early-output interface comes from a partial compile and must agree with the final one.
- **Inheritance edges.** `inheritance` and `localInheritance` bypass the name filter; in the model they are keys with $\mathrm{covers} = \top$, and `Hier.lean` shows what they are *for*: keeping a materialised hash fresh. Which queries of a subclass's own compilation actually need $\top$, and is a `parents`/`decls` key enough for the rest?
- **A non-termination witness.** Construct the ping-pong pair as a Lean `example` for the plain policy, so the claim that `transitiveStep` is necessary is machine-checked.
- **Connecting to reality.** Instrument the real compiler to log queries, and check the bridge's recorded keys against the log with `coverage` as the oracle. That is differential testing (§19) at the level of obligations rather than outputs, and it would find uncovered observables *before* someone writes the scripted test.

**Prior art to cite (verify the references before the talk):**

- *Build Systems à la Carte*: traces, minimality, early cutoff.
- Adapton (Hammer et al., PLDI 2014) and Salsa / rustc's query system: demand-driven incremental computation.
- Incremental λ-calculus / "A theory of changes for higher-order languages" (Cai, Giarrusso, Rendel, Ostermann, PLDI 2014).
- "What is Java binary compatibility?" (Drossopoulou, Wragg, Eisenbach, OOPSLA 1998): descriptors and linking, the §15b world.
- CompCert's separate-compilation correctness work (Kang et al., POPL 2016): the compositionality axiom, proved for C.

**Limits:**

- The model proves the *algorithm* sound given the obligations. It says nothing about whether scalac/dotc meet them; that remains a testing problem.
- `transitiveStep` is modelled as one step of dependents rather than the full closure; the bound only needs $\mathrm{inv} \cup R_n \subseteq R_{n+1}$.
- Its value is that it turns informal knowledge ("implicits invalidate unconditionally", "value classes fold their underlying type into ancestors") into named hypotheses that a feature author must discharge (§17).

### 24. Open questions

- Should $\pi$ be *specified* (like TASTy) rather than "whatever ExtractAPI does"?
- Is member-level $\pi$ a soundness requirement or an implementation convenience?
- Could IDEs (Metals, IntelliJ's bytecode-based IC) and build tools share one summary format?

### N1. The autumn 2026 fix wave, and LLMs as bug finders

Lukas Rytz and Jason Zaugg, roughly June–October 2026. Many of these already appear as examples above; the list is the raw material for a "what we found this year" slide.

**Undercompilation:**

- Scala 3 pattern match after case class/extractor change → `NoSuchMethodError`, in every Scala 3 version ([scala/scala3#26231](https://github.com/scala/scala3/issues/26231) → [#26262](https://github.com/scala/scala3/pull/26262)). Came with `IncrementalCompileSimulator`.
- Pipelining: a run can end before early TASTy is written, dropping Zinc callbacks ([scala/scala3#27139](https://github.com/scala/scala3/issues/27139)); `dependencyPhaseCompleted` was called before dependencies were sent ([#27125](https://github.com/scala/scala3/issues/27125)); Zinc now waits and announces "no early output" ([sbt/zinc#1822](https://github.com/sbt/zinc/pull/1822), [#1823](https://github.com/sbt/zinc/pull/1823), [#1817](https://github.com/sbt/zinc/pull/1817)).
- With `-Xjava-tasty`, dependencies of Java sources weren't sent to Zinc ([scala/scala3#27133](https://github.com/scala/scala3/issues/27133)).
- Making a parent class `final` doesn't recompile its subclasses: `HashAPI.hashAPI` never hashes a top-level class's own modifiers, access or annotations, so the incremental build passes and a clean build fails. Found by the baseline tests of the Merkle PoC (`merkle-header`, [retronym/zinc#24](https://github.com/retronym/zinc/pull/24)); a fix for 1.x is in progress.

<!-- break -->

**Overcompilation:**

- A comment-only edit to a trait recompiled its heirs ([sbt/zinc#1794](https://github.com/sbt/zinc/issues/1794) → [#1799](https://github.com/sbt/zinc/pull/1799)).
- Adding a member to an object recompiled classes inheriting its companion trait ([#1793](https://github.com/sbt/zinc/issues/1793) → [#1801](https://github.com/sbt/zinc/pull/1801)).
- A compound type in a member signature was recorded as inheritance ([#1798](https://github.com/sbt/zinc/issues/1798) → [#1803](https://github.com/sbt/zinc/pull/1803)).
- A private change in a trait recompiled classes that don't inherit it, from object/trait conflation ([#1795](https://github.com/sbt/zinc/issues/1795) → [#1807](https://github.com/sbt/zinc/pull/1807), `AnalysisCallback4`); the class/companion name-hash merge is still open ([#1796](https://github.com/sbt/zinc/issues/1796)). See §12.
- Trait `extraHash` over-invalidations ([#1787](https://github.com/sbt/zinc/pull/1787)); refinement-owned type params ([#1782](https://github.com/sbt/zinc/pull/1782)).
- Pipelining: any change recompiled everything depending on a Java class ([#1819](https://github.com/sbt/zinc/issues/1819) → [#1821](https://github.com/sbt/zinc/pull/1821)); a trait with a parent recompiled all heirs under Scala 3 ([#1820](https://github.com/sbt/zinc/issues/1820)).
- Intermittent overcompilation from `Symbol.copy` ignoring its compilation unit ([scala/scala3#25520](https://github.com/scala/scala3/issues/25520) → [#27162](https://github.com/scala/scala3/pull/27162)).
- Under `-release`, JDK classes were reported to Zinc as project classes ([scala/scala3#27117](https://github.com/scala/scala3/issues/27117)); the empty package was included in names of Java classes ([#27136](https://github.com/scala/scala3/pull/27136)).

<!-- break -->

**Test-infrastructure bugs (the oracle itself was wrong):**

- Scripted tests shared a directory ([sbt/zinc#1802](https://github.com/sbt/zinc/pull/1802)).
- `"scalaVersion": "2.13.y"` scripted projects never actually selected the in-tree `scala2-sbt-bridge` ([#1836](https://github.com/sbt/zinc/issues/1836) → [#1837](https://github.com/sbt/zinc/pull/1837)), so the in-tree bridge was untested by Zinc's suite. This is the drift risk of §18 in practice.

**LLM-assisted bug finding:**

- Many of these were *discovered*, not just fixed, with LLM agents: they read the invalidator, hypothesise a conflation, write a minimal scripted test, and observe over- or under-invalidation in the log.
- The batch filed on 2026-09-14 (#1793–#1798) has that shape: one systematic probe per dependency kind.
- **The clearest example:** [retronym/zinc#14](https://github.com/retronym/zinc/pull/14), from an agent session (branch `claude/scripted-compilation-bug-tests`). It contains about 14 confirmed under/over-compilation cases on 2.13.y, each as a pending scripted test with root cause, fix sketch, cost of the fix ("pessimism") and which repo it belongs in. Draft fixes are stacked as [retronym/zinc#15](https://github.com/retronym/zinc/pull/15) and [retronym/zinc#17](https://github.com/retronym/zinc/pull/17)–[retronym/zinc#23](https://github.com/retronym/zinc/pull/23), and there is a "tried, no bug found" list, which shows the search was broader than its hits.

<!-- break -->

- **Why it works here:** incrementality bugs have a mechanical oracle (`checkRecompilations`, invalidation logs, clean-vs-incremental diffs), tiny reproducers, and a large but regular space of (feature × edit × dependency kind). That suits automated search well.
- **Where it doesn't:** deciding the *right* key (§12) or obligation (§22) is still a design judgement. Agents found the conflations; humans chose `AnalysisCallback4`.
- **Tie-in with §17:** a feature author could ask an agent to "enumerate edits to this feature's definitions and check incremental ≡ clean" as part of the PR. That is a cheap version of the missing checklist item.

### N2. Best practice: a one-command under/over-compilation bug report

Problem: by the time a user notices undercompilation (a runtime `NoSuchMethodError`, or "works after `clean`"), the pre-change state needed to reproduce it is gone. So reports arrive as "sbt is flaky".

```mermaid
flowchart TB
  E["User hits NoSuchMethodError /<br/>'works after clean'"] --> R["report command"]
  R --> S["snapshot: prev + current Analysis,<br/>source change set, versions, flags,<br/>invalidation log"]
  R --> CL["clean compile + classfile diff"]
  CL --> DX{"stale class d:<br/>name missing from U(d)?"}
  DX -- yes --> COV["coverage bug"]
  DX -- "no: hash didn't move" --> ABS["abstraction bug"]
  S --> T["ready-to-run scripted test"]
  CL --> T
```

<!-- break -->

**What a good report command captures:**

- the previous and current `Analysis` (the consistent format is deterministic and text-renderable, so it diffs well);
- the source change set: VCS revision plus diff, or a content-addressed snapshot of changed sources kept by the build tool for the last N compiles;
- compiler and Zinc versions, bridge provenance, scalac options, compile order, pipelining flags;
- the invalidation log for the offending run (`relationsDebug`/`apiDebug`-level, as `checkInvalidationLog` uses);
- for undercompilation: a background or on-demand **clean compile of the affected module and a classfile diff**. The diff names the stale classes, and for each, the used names $U(d)$ and the API diff of what changed. Either a name is missing (a coverage bug) or a hash didn't move (an abstraction bug), which are exactly §22's two obligations.

<!-- break -->

**Output:**

- a ready-to-run scripted test directory (sources before, `changes/`, `test` script, `incOptions.properties`), so a maintainer or an agent (N1) can minimise it;
- optionally anonymised: hash identifiers while keeping the structure.

**Canary mode:** in CI, sample a fraction of incremental builds and also run a clean build; on a mismatch, emit the report automatically. Field data then flows into the scripted corpus.

**Prior art to check:**

- `ninja -d explain` and Bazel's execution log / `--explain` (why something reran);
- Gradle build scans;
- Kotlin build reports;
- Swift driver incremental remarks;
- rustc's incremental debugging flags.

Most explain *overcompilation*; few help with *undercompilation*, which needs the clean-build diff.

        const id = slugFor(node);
        card.id = id;
        const m = node.innerHTML.match(/^(\d+[a-z]?\.|N\d+\.)\s/);
        if (m) node.innerHTML = '<span class="num">' + m[1] + '</span>' + node.innerHTML.slice(m[0].length);
        if (tag !== 'H2') lastHeading = node;
      }
    }
    if (!card) newCard('cover');
    card.appendChild(node);
  });

  // 4. Link § references and "Notes N1" to their cards.
  const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('code, pre, a, .katex, h3, h4') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const textNodes = []; while (walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach(n => {
    const re = /§(\d+[a-c]?)((?:[–-]\d+)?)|Notes (N\d)/g;
    if (!re.test(n.nodeValue)) return;
    const frag = document.createDocumentFragment(); let last = 0; re.lastIndex = 0; let m;
    while ((m = re.exec(n.nodeValue))) {
      frag.appendChild(document.createTextNode(n.nodeValue.slice(last, m.index)));
      const a = document.createElement('a'); a.className = 'sref';
      a.href = '#s' + (m[1] || m[3]).toLowerCase(); a.textContent = m[0];
      frag.appendChild(a); last = re.lastIndex;
    }
    frag.appendChild(document.createTextNode(n.nodeValue.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });

  // 5. Table of contents.
  const toc = document.getElementById('toc');
  const cards = Array.from(main.querySelectorAll('.card'));
  cards.forEach(c => {
    const h = c.querySelector(':scope > h2, :scope > h3, :scope > h4');
    if (!h || !c.id) return;
    const li = document.createElement('li'); li.className = h.tagName.toLowerCase();
    const num = h.querySelector('.num');
    const label = num ? num.textContent + ' ' + h.textContent.slice(num.textContent.length) : h.textContent;
    const a = document.createElement('a'); a.href = '#' + c.id; a.textContent = label; a.dataset.target = c.id;
    li.appendChild(a); toc.appendChild(li);
  });

  // 6. Mermaid, themed to match; re-rendered on theme change.
  const mermaidBlocks = Array.from(main.querySelectorAll('pre.mermaid'));
  mermaidBlocks.forEach(b => { b.dataset.src = b.textContent; });
  function isDark() {
    const t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  async function renderMermaid() {
    mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'neutral', securityLevel: 'strict',
      fontFamily: 'Inter, system-ui, sans-serif', flowchart: { htmlLabels: true, curve: 'basis' } });
    mermaidBlocks.forEach(b => { b.removeAttribute('data-processed'); b.innerHTML = ''; b.textContent = b.dataset.src; });
    try { await mermaid.run({ nodes: mermaidBlocks }); } catch (e) { console.error(e); }
  }
  const firstRender = renderMermaid();

  // 7. Navigation: current card, keyboard, focus mode, theme.
  let current = 0, suppressObserverUntil = 0;
  const counter = document.getElementById('counter');
  function setCurrent(i, scroll, smooth) {
    current = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach((c, j) => c.classList.toggle('current', j === current));
    counter.textContent = (current + 1) + ' / ' + cards.length;
    const id = cards[current].id;
    toc.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.target === id));
    if (scroll) {
      suppressObserverUntil = performance.now() + 1000;
      if (document.body.classList.contains('focus')) window.scrollTo(0, 0);
      else cards[current].scrollIntoView({ block: 'start', behavior: smooth ? 'smooth' : 'instant' });
      if (id) history.replaceState(null, '', '#' + id);
    }
  }
  const io = new IntersectionObserver(entries => {
    if (document.body.classList.contains('focus') || performance.now() < suppressObserverUntil) return;
    const visible = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (visible.length) setCurrent(cards.indexOf(visible[0].target), false);
  }, { rootMargin: '0px 0px -60% 0px' });
  cards.forEach(c => io.observe(c));
  function toggleFocus() { document.body.classList.toggle('focus'); setCurrent(current, true); }
  function toggleTheme() {
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('zinc-talk-theme', next); } catch (e) {}
    renderMermaid();
  }
  try { const t = localStorage.getItem('zinc-talk-theme'); if (t) { document.documentElement.dataset.theme = t; renderMermaid(); } } catch (e) {}
  document.getElementById('btn-focus').onclick = toggleFocus;
  document.getElementById('btn-theme').onclick = toggleTheme;
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['j', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); setCurrent(current + 1, true, true); }
    else if (['k', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); setCurrent(current - 1, true, true); }
    else if (e.key === 'f') toggleFocus();
    else if (e.key === 't') toggleTheme();
    else if (e.key === 'Escape') document.body.classList.remove('focus');
  });
  toc.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    const i = cards.findIndex(c => c.id === a.dataset.target); if (i >= 0) { e.preventDefault(); setCurrent(i, true); }
  });
  main.addEventListener('click', e => {
    const a = e.target.closest('a.sref'); if (!a) return;
    const i = cards.findIndex(c => '#' + c.id === a.getAttribute('href')); if (i >= 0) { e.preventDefault(); setCurrent(i, true); }
  });
  const start = location.hash ? cards.findIndex(c => '#' + c.id === location.hash) : 0;
  setCurrent(start < 0 ? 0 : start, start > 0);
  firstRender.then(() => { if (start > 0) setCurrent(start, true); });
})();
</script>
</body>
</html>
