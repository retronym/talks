<script type="text/markdown" id="talk-src"># A more interactive Scala 3: the tour

<p class="sub">What a proof of concept showed about targeted, cancellable, incremental and concurrent typechecking in Scala 3's presentation compiler, and how it could land</p>

**What this is:** a short version of [A more interactive Scala 3](../dotc-interactive/index.html), for people who want the concepts, the mechanisms, the tools and a landing order without the detail. The proof of concept is [retronym/scala3#84][PR]. It is evidence for what is feasible and what it costs, not a design to adopt as is; each slide says what was tried and what it showed.

---

## The problem

### 1. An editor's requirements of a compiler

- An answer to a hover or a completion in milliseconds, on a file that is being edited.
- Work nobody needs any more stopped as soon as the next keystroke arrives.
- Little work per edit, when most edits are inside one method body.
- Diagnostics and highlighting computed in the background without delaying the hover.

Scala 3's presentation compiler did one whole-file typecheck per request, on one thread, and could not stop it. The proof of concept asked how far that can change.

### 2. Editor latency is dominated by whole-file work

### 3. Assumptions of the batch compiler

```mermaid
stateDiagram-v2
  direction TB
  [*] --> Lazy: Namer enters the symbol
  Lazy --> Touched: completeFrom sets Touched,<br/>runs the completer
  Touched --> Completed: info set,<br/>Touched cleared
  Touched --> Cyclic: re-entered while Touched
  Cyclic: CyclicReference
  Touched --> Leaked: completer throws
  Leaked: Touched left set
  Leaked --> Cyclic: next access in the run
```

- One thread and one run; the symbol table outlives runs.
- Signatures are lazy: a completer computes one on first use, guarded by a one-bit `Touched` flag that was left set if the completer threw.
- Typing consumes the untyped tree, so a statement cannot be typed twice.

Each assumption breaks somewhere below ([full talk §1](../dotc-interactive/index.html#s1)–[full talk §3](../dotc-interactive/index.html#s3)).

### 11. Claims: one thread completes a symbol, the others wait

```scala
def f = g + 1        // a hover on f: f's result type is inferred, so g's type is needed
def g = parse(text)  // meanwhile a completion elsewhere is computing g's type
```

Both requests need `g`'s signature at the same moment. One thread should compute it; the other should wait for that result, neither seeing it half done nor computing it a second time.

One lock around every completion is correct and serialises most of a reader's time. A claim per root lets readers run in parallel: the owner alone sees the completion in progress, others wait at the barrier, and a cancelled owner hands over. K2 moved the same way, from a global resolve lock to per-declaration locks ([full talk §23](../dotc-interactive/index.html#s23), [full talk §24](../dotc-interactive/index.html#s24), [full talk §34](../dotc-interactive/index.html#s34)).

### 12. Hazards and their patterns

| pattern | hazard | `Batch` | `Serialised` | `Parallel` |
|---|---|---|---|---|
| coarse lock | completions racing each other | the original code | one completion lock (`exclusive`, `serialised`)  | – |
| claim and barrier | a completion's intermediate state seen by others ([§24](../dotc-interactive/index.html#s24)) | the original code  | – | a claim per root (`exclusive`, `claimed`) |
| wait, don't peek | acting on another reader's work in progress ([§27](../dotc-interactive/index.html#s27))  | – | wait on the lock, look again | `awaitOtherReader` |
| a chosen victim | readers waiting on each other ([§28](../dotc-interactive/index.html#s28))  | –  | – | `CompletionRoots.backOff` |
| one published value | a cache in several fields ([§29](../dotc-interactive/index.html#s29)) | plain fields | packed value, publish once | packed value, publish once |
| ordered stamp | a value and its stamp ([§30](../dotc-interactive/index.html#s30)) | plain stores | `Caching.stamped` with fences | `Caching.stamped` with fences |
| private typer state | type variables crossing readers ([§31](../dotc-interactive/index.html#s31)) | the original code | commit under the lock (`endState`) | settle and drop (`privately`, `endState`) |
| concurrent structures | shared maps and interners | plain | synchronised, lock-free hits (`newEqHashMap`, `newUniques`) | the same |

These hold beyond this code: anything that shares lazily computed state between readers meets them ([full talk §32](../dotc-interactive/index.html#s32)).

### 13. Publishing caches safely

| | how | correct when | cost |
|---|---|---|---|
| packed value | one immutable object in one `@volatile` field, built in a local, stored once | always | an allocation per store |
| seqlock (`StampedLock`'s optimistic read) | the writer makes a version odd, writes the fields, makes it even with release; a reader rereads the version after its reads and retries if it changed | always | writers exclude each other; every read rereads and may retry |
| release and acquire on a last field | the fields stored plainly, one designated field last with release; readers load it first with acquire | every writer in a period stores the same values | a fence per read on ARM, no allocation |

Within one run every writer of a stamped cache computes the same value, so the cheapest form suffices there; caches whose writers disagree need a packed value ([full talk §29a](../dotc-interactive/index.html#s29a), [full talk §30](../dotc-interactive/index.html#s30)).

### 15. Finding races

| layer | what it checks | found |
|---|---|---|
| Lincheck on `Caching` | the stamped cell from several threads against every sequential order ([§30a](../dotc-interactive/index.html#s30a)) | the helper's ordering |
| two-reader soak and oracle suites | random walks of requests, cancellations and edits on one driver, every answer equal to a whole-file run's | I34–I47 ([§23](../dotc-interactive/index.html#s23)) |
| the k=8 race-hunt loop | `Throughput -Dtp.loop`: 484 files, per-file diagnostics diffed against a single-reader run, the claim log around each divergence | I70–I81 ([§29](../dotc-interactive/index.html#s29)) |
| one-pattern soaks | `ShownSoak` (conversions to `Shown`, written out longhand as well), `ExtensionParamsSuite`, `LazyRefRunSpliceSuite`, `DriverThreadLocalLeakSuite` | I78, I79, I84, I86, I83 |
| lints | `StampedCachesTest`: a stamp in `core` only through `Caching` | keeps [§30](../dotc-interactive/index.html#s30) true |

Every answer is compared with a single-reader whole-file run; a divergence is a race until shown otherwise ([full talk §33](../dotc-interactive/index.html#s33)).

## A landing order

### 17. Fixes that need no flag

| | stock compiler or Metals |
|---|---|
| I50 | after a request timeout, mtags' queue reset leaves the old executor's backlog running beside the new queue on one driver (`denotation … invalid in run`); the presentation-compiler side holds the driver's monitor per job, the mtags side needs an issue |
| I15 | an empty completion prefix bypasses `CachingDriver`, so the commonest member completion never benefits from it |
| I10 | the 16-bit run id is unguarded; a long-lived driver overflows it into the phase bits |
| I11, cancellation | `isCancelled` consumes the interrupt bit and nothing in the typer polls it, so Metals' token cancels the future, not the work; the sticky flag and the typer checkpoints are separable from targeting ([§14](../dotc-interactive/index.html#s14)) |
| I49 | after a stock reproduction: a scaladoc comment cooked under a discarded typer state is cached without its warning |
| the `Reader` | kind A out of `ContextBase` and `Run`: hygiene the batch compiler could take with a paired A/B, since it names every piece of per-request state in one place |

Each has a test and is independent of the PoC's flags ([full talk §62](../dotc-interactive/index.html#s62)).

### 18. Increments, each useful on its own

```mermaid
flowchart TB
  A["Per-request state named in one place<br/>(hygiene; paired A/B for batch)"] --> B["Targeting and the session<br/>behind a flag"]
  B --> C["Range requests<br/>with the Metals side"]
  B --> D["Body edits<br/>with diagnostics by provenance"]
  C --> E["Concurrent readers<br/>serialised, then parallel"]
  D --> E
```

An order to discuss, not a plan. Each step is flag-gated and can stop without the next. Concurrent readers come last because the measurements say they pay off only once whole-file work is no longer what the editor waits for (slide 2).

### 19. Open problems and comparable designs

- **Open in the PoC:** Namer completions that can run again (two readers completing in opposite orders still raise a cycle no sequential order has); facts that outlive a run, which snapshot readers across an edit would need; the shared state a sweep listed and no test has hit yet.
- **Designs to weigh it against:** Kotlin K2's lazy resolve and analysis sessions, IntelliJ's read and write actions, Roslyn's immutable compilations, Salsa's revisions and cancellation ([full talk §48](../dotc-interactive/index.html#s48)–[full talk §51](../dotc-interactive/index.html#s51)).

<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/scala.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function () {
  const src = document.getElementById('talk-src').textContent;

  // 1. Protect $…$ and $$…$$ from markdown, skipping fenced and inline code.
  const maths = [];
  function protectMath(text) {
    return text
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => token(m, true))
      .replace(/(^|[^\\\w])\$(?!\s)([^$\n]+?)(?<!\s)\$(?!\w)/g, (_, pre, m) => pre + token(m, false));
  }
  function token(tex, display) { maths.push({ tex, display }); return 'MATHTOKEN' + (maths.length - 1) + 'X'; }
  const fenceSplit = src.split(/(^```[^\n]*\n[\s\S]*?^```[ \t]*$)/m);
  const protectedSrc = fenceSplit.map((part, i) => {
    if (i % 2 === 1) return part;
    return part.split(/(`+[^`\n]*?`+)/).map((p, j) => (j % 2 === 1 ? p : protectMath(p))).join('');
  }).join('');

  // 2. Render markdown; mermaid fences become <pre class="mermaid">.
  const md = window.markdownit({ html: true, linkify: false, typographer: false });
  const defaultFence = md.renderer.rules.fence;
  md.renderer.rules.fence = function (tokens, idx, opts, env, self) {
    const t = tokens[idx];
    const lang = (t.info || '').trim().split(/\s+/)[0];
    if (lang === 'mermaid') return '<pre class="mermaid">' + md.utils.escapeHtml(t.content) + '</pre>';
    if (lang && window.hljs && hljs.getLanguage(lang)) {
      return '<pre><code class="hljs language-' + lang + '">' + hljs.highlight(t.content, { language: lang }).value + '</code></pre>';
    }
    return defaultFence(tokens, idx, opts, env, self);
  };
  const env = {};
  let html = md.render(protectedSrc, env);
  // Reference-style links inside raw HTML blocks (figure captions) are left as text by
  // markdown-it; resolve them against the document's reference definitions.
  html = html.replace(/\[([^\]<>]+)\]\[([^\]<>]+)\]/g, (m, t, k) => {
    const r = env.references && env.references[k.trim().replace(/\s+/g, ' ').toUpperCase()];
    return r ? '<a href="' + r.href + '">' + t + '</a>' : m;
  });
  html = html.replace(/MATHTOKEN(\d+)X/g, (_, i) => {
    const m = maths[+i];
    try { return katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false, strict: 'ignore' }); }
    catch (e) { return '<code>' + md.utils.escapeHtml(m.tex) + '</code>'; }
  });

  // Chips: {chip:B lazy fact} is a kind of mutable state (a letter A–E first), anything else a pattern.
  html = html.replace(/\{chip:([^}<>]+)\}/g, (_, label) => {
    const l = label.trim(); const kind = /^[A-E]\s/.test(l);
    return '<span class="chip ' + (kind ? 'kind' : 'pat') + '">' + md.utils.escapeHtml(l) + '</span>';
  });

  // 3. Chunk into cards at h1/h2/h3/h4 and at <!-- break --> comments; drop <hr>.
  const scratch = document.createElement('div');
  scratch.innerHTML = html;
  const main = document.getElementById('content');
  let card = null, lastHeading = null;
  function newCard(cls) { card = document.createElement('section'); card.className = 'card ' + (cls || ''); main.appendChild(card); return card; }
  function slugFor(h) {
    const text = h.textContent.trim();
    const m = text.match(/^(\d+[a-z]?)\.\s/) || text.match(/^(N\d+)\.\s/);
    if (m) return 's' + m[1].toLowerCase();
    return text.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
  }
  Array.from(scratch.childNodes).forEach(node => {
    if (node.nodeType === Node.COMMENT_NODE && /break/.test(node.textContent)) {
      newCard();
      if (lastHeading) { const c = document.createElement('div'); c.className = 'cont'; const n = lastHeading.querySelector('.num'); c.textContent = (n ? n.textContent + ' ' + lastHeading.textContent.slice(n.textContent.length) : lastHeading.textContent) + ' (cont.)'; card.appendChild(c); }
      return;
    }
    if (node.nodeType === Node.ELEMENT_NODE) {
      const tag = node.tagName;
      if (tag === 'HR') return;
      if (/^H[1-4]$/.test(tag)) {
        newCard(tag === 'H2' ? 'part' : tag === 'H1' ? 'cover' : '');
        const id = slugFor(node);
        card.id = id;
        const m = node.innerHTML.match(/^(\d+[a-z]?\.|N\d+\.)\s/);
        if (m) node.innerHTML = '<span class="num">' + m[1] + '</span>' + node.innerHTML.slice(m[0].length);
        if (tag !== 'H2') lastHeading = node;
      }
    }
    if (!card) newCard('cover');
    card.appendChild(node);
  });

  // A row of chips right under a card's heading sits in the heading row, right-aligned.
  main.querySelectorAll('.card > h3 + .chips, .card > h4 + .chips').forEach(chips => {
    const h = chips.previousElementSibling;
    const row = document.createElement('div'); row.className = 'card-head';
    h.parentNode.insertBefore(row, h); row.appendChild(h); row.appendChild(chips);
  });

  // 4. Link § references and "Notes N1" to their cards.
  const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest('code, pre, a, .katex, h3, h4') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
  });
  const textNodes = []; while (walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach(n => {
    const re = /§(\d+[a-h]?)((?:[–-]\d+[a-h]?)?)|Notes (N\d)/g;
    if (!re.test(n.nodeValue)) return;
    const frag = document.createDocumentFragment(); let last = 0; re.lastIndex = 0; let m;
    while ((m = re.exec(n.nodeValue))) {
      frag.appendChild(document.createTextNode(n.nodeValue.slice(last, m.index)));
      const a = document.createElement('a'); a.className = 'sref';
      a.href = '#s' + (m[1] || m[3]).toLowerCase(); a.textContent = m[0];
      frag.appendChild(a); last = re.lastIndex;
    }
    frag.appendChild(document.createTextNode(n.nodeValue.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });

  // 5. Table of contents.
  const toc = document.getElementById('toc');
  const cards = Array.from(main.querySelectorAll('.card'));
  cards.forEach(c => {
    const h = c.querySelector(':scope > h2, :scope > h3, :scope > h4, :scope > .card-head > h3, :scope > .card-head > h4');
    if (!h || !c.id) return;
    const li = document.createElement('li'); li.className = h.tagName.toLowerCase();
    const num = h.querySelector('.num');
    const label = num ? num.textContent + ' ' + h.textContent.slice(num.textContent.length) : h.textContent;
    const a = document.createElement('a'); a.href = '#' + c.id; a.textContent = label; a.dataset.target = c.id;
    li.appendChild(a); toc.appendChild(li);
  });

  // 6. Mermaid, themed to match; re-rendered on theme change.
  const mermaidBlocks = Array.from(main.querySelectorAll('pre.mermaid'));
  mermaidBlocks.forEach(b => { b.dataset.src = b.textContent; });
  function isDark() {
    const t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  async function renderMermaid() {
    mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'neutral', securityLevel: 'strict',
      fontFamily: 'Inter, system-ui, sans-serif', flowchart: { htmlLabels: true, curve: 'basis' } });
    mermaidBlocks.forEach(b => { b.removeAttribute('data-processed'); b.innerHTML = ''; b.textContent = b.dataset.src; });
    try { await mermaid.run({ nodes: mermaidBlocks }); } catch (e) { console.error(e); }
  }
  // Mermaid measures label text; wait for the web fonts or the boxes are sized for the fallback font.
  const firstRender = (document.fonts ? document.fonts.ready : Promise.resolve()).then(renderMermaid);

  // 7. Navigation: current card, keyboard, focus mode, theme.
  let current = 0, suppressObserverUntil = 0;
  const counter = document.getElementById('counter');
  function setCurrent(i, scroll, smooth) {
    current = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach((c, j) => c.classList.toggle('current', j === current));
    counter.textContent = (current + 1) + ' / ' + cards.length;
    const id = cards[current].id;
    toc.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.target === id));
    if (scroll) {
      suppressObserverUntil = performance.now() + 1000;
      if (document.body.classList.contains('focus')) window.scrollTo(0, 0);
      else cards[current].scrollIntoView({ block: 'start', behavior: smooth ? 'smooth' : 'instant' });
      if (id) history.replaceState(null, '', '#' + id);
    }
  }
  const io = new IntersectionObserver(entries => {
    if (document.body.classList.contains('focus') || performance.now() < suppressObserverUntil) return;
    const visible = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (visible.length) setCurrent(cards.indexOf(visible[0].target), false);
  }, { rootMargin: '0px 0px -60% 0px' });
  cards.forEach(c => io.observe(c));
  // Motion: a card's figures play when it comes into view, and again on re-entry.
  // Without reduced motion, an animated figure waits at its first frame until its card plays.
  const motion = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (motion) document.documentElement.classList.add('motion');
  function rewind(c) { c.classList.remove('play'); c.classList.add('rewind'); void c.offsetWidth; c.classList.remove('rewind'); }
  function play(c) { rewind(c); c.classList.add('play'); }
  const animated = cards.filter(c => c.querySelector('figure.anim'));
  // Watch the figures, not the cards: a card can be taller than the window, a figure is not.
  // A figure half in view plays its card; a card whose figures have all left the view rewinds.
  const playObs = new IntersectionObserver(entries => {
    if (document.body.classList.contains('focus')) return;
    entries.forEach(e => {
      const c = e.target.closest('.card');
      e.target.dataset.seen = e.isIntersecting ? '1' : '';
      if (e.isIntersecting && e.intersectionRatio >= 0.5) { if (!c.classList.contains('play')) play(c); }
      else if (!e.isIntersecting && c.classList.contains('play') && ![...c.querySelectorAll('figure.anim')].some(f => f.dataset.seen)) rewind(c);
    });
  }, { threshold: [0, 0.5] });
  animated.forEach(c => {
    c.querySelectorAll('figure.anim').forEach(f => playObs.observe(f));
    c.querySelectorAll('figure.anim').forEach(f => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'replay'; b.textContent = '↻ replay';
      b.onclick = () => play(c); f.appendChild(b);
    });
  });
  const baseSetCurrent = setCurrent;
  setCurrent = function (i, scroll, smooth) {
    baseSetCurrent(i, scroll, smooth);
    if (document.body.classList.contains('focus')) { animated.forEach(c => c !== cards[current] && c.classList.contains('play') && rewind(c)); if (animated.includes(cards[current])) play(cards[current]); }
  };
  function toggleFocus() { document.body.classList.toggle('focus'); setCurrent(current, true); }
  function toggleTheme() {
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('scala3-tour-theme', next); } catch (e) {}
    renderMermaid();
  }
  try { const t = localStorage.getItem('scala3-tour-theme'); if (t) { document.documentElement.dataset.theme = t; renderMermaid(); } } catch (e) {}
  document.getElementById('btn-focus').onclick = toggleFocus;
  document.getElementById('btn-theme').onclick = toggleTheme;
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['j', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); setCurrent(current + 1, true, true); }
    else if (['k', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); setCurrent(current - 1, true, true); }
    else if (e.key === 'f') toggleFocus();
    else if (e.key === 't') toggleTheme();
    else if (e.key === 'Escape') document.body.classList.remove('focus');
  });
  toc.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    const i = cards.findIndex(c => c.id === a.dataset.target); if (i >= 0) { e.preventDefault(); setCurrent(i, true); }
  });
  main.addEventListener('click', e => {
    const a = e.target.closest('a.sref'); if (!a) return;
    const i = cards.findIndex(c => '#' + c.id === a.getAttribute('href')); if (i >= 0) { e.preventDefault(); setCurrent(i, true); }
  });
  const start = location.hash ? cards.findIndex(c => '#' + c.id === location.hash) : 0;
  setCurrent(start < 0 ? 0 : start, start > 0);
  firstRender.then(() => { if (start > 0) setCurrent(start, true); });
})();
</script>
