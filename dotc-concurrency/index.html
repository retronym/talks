<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Several readers, one symbol table</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f6f5f1;
  --card: #ffffff;
  --ink: #1d1d1f;
  --muted: #6b6b70;
  --rule: #e4e2dc;
  --accent: #b4441f;
  --accent-soft: #f6e4dc;
  --link: #1f5fa8;
  --code-bg: #f2f1ec;
  --part-bg: #1d1d1f;
  --part-ink: #f6f5f1;
  --kw: #a3361a; --str: #2f7a3a; --com: #8a8a8f; --typ: #1f5fa8; --num: #7a3fa0;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --card: #1d1d20; --ink: #ececee; --muted: #9a9aa2; --rule: #2e2e33;
    --accent: #f08a5d; --accent-soft: #3a2620; --link: #7fb2ff; --code-bg: #26262b;
    --part-bg: #ececee; --part-ink: #141416;
    --kw: #f08a5d; --str: #8fd19e; --com: #777780; --typ: #7fb2ff; --num: #d1a3ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --card: #1d1d20; --ink: #ececee; --muted: #9a9aa2; --rule: #2e2e33;
  --accent: #f08a5d; --accent-soft: #3a2620; --link: #7fb2ff; --code-bg: #26262b;
  --part-bg: #ececee; --part-ink: #141416;
  --kw: #f08a5d; --str: #8fd19e; --com: #777780; --typ: #7fb2ff; --num: #d1a3ff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
html { scroll-padding-top: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 Inter, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .88em; }
:not(pre) > code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; line-height: 1.5; }
pre.mermaid { background: transparent; text-align: center; padding: 8px 0; }
.hljs-keyword, .hljs-built_in { color: var(--kw); }
.hljs-string { color: var(--str); }
.hljs-comment { color: var(--com); font-style: italic; }
.hljs-type, .hljs-title { color: var(--typ); }
.hljs-number, .hljs-literal { color: var(--num); }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
nav.toc {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 24px 16px 40px 20px; border-right: 1px solid var(--rule); font-size: 13.5px;
}
nav.toc .title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
nav.toc .hint { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
nav.toc ol { list-style: none; padding: 0; margin: 0; }
nav.toc li a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--ink); }
nav.toc li a:hover { background: var(--accent-soft); text-decoration: none; }
nav.toc li.h2 > a { font-weight: 600; margin-top: 12px; color: var(--muted); text-transform: uppercase; font-size: 11.5px; letter-spacing: .04em; }
nav.toc li.h4 > a { padding-left: 22px; color: var(--muted); }
nav.toc li a.active { background: var(--accent-soft); color: var(--accent); }
.controls { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.controls button {
  font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  background: var(--card); color: var(--ink); border: 1px solid var(--rule);
}
.controls button:hover { border-color: var(--accent); }

main { padding: 32px 40px 120px; max-width: 980px; width: 100%; margin: 0 auto; }
.card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
  padding: 26px 32px; margin: 0 0 22px; box-shadow: var(--shadow);
}
.card.part { background: var(--part-bg); color: var(--part-ink); border: none; padding: 36px 32px; }
.card.part h2 { margin: 0; font-size: 28px; letter-spacing: -.01em; }
.card.part code { background: transparent; color: inherit; }
.card.cover h1 { font-size: 34px; line-height: 1.2; margin: 0 0 18px; letter-spacing: -.02em; }
.card.cover .sub { font-size: 19px; color: var(--muted); margin: -8px 0 22px; line-height: 1.4; }
.card h3 { margin: 0 0 14px; font-size: 22px; letter-spacing: -.01em; }
.card h4 { margin: 0 0 12px; font-size: 18px; }
.card .cont { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.card h3 .num, .card h4 .num { color: var(--accent); margin-right: .35em; }
.card > :last-child { margin-bottom: 0; }
.card ul, .card ol { padding-left: 1.3em; }
.card li { margin: .25em 0; }
.card li > ul { margin: .2em 0; }
strong { font-weight: 650; }
.katex-display { margin: 14px 0; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.katex { font-size: 1.05em; }
table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; display: block; overflow-x: auto; }
th, td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; }
blockquote { margin: 12px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
a.sref { white-space: nowrap; }

/* Figures: inline SVG drawn with the theme's tokens */
:root {
  --typed: #2f7a3a; --typed-bg: #dcefdf; --skip: #8a8a8f; --skip-bg: #ecebe6;
  --own: #b4441f; --own-bg: #f6e4dc; --wait: #1f5fa8; --wait-bg: #e2ecf8;
  --bad: #b3261e; --bad-bg: #f9dedc; --pub: #6b3fa0; --pub-bg: #efe6f8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --typed: #8fd19e; --typed-bg: #1d3323; --skip: #8a8a92; --skip-bg: #2a2a2f;
    --own: #f08a5d; --own-bg: #3a2620; --wait: #7fb2ff; --wait-bg: #1c2a40;
    --bad: #ff8a80; --bad-bg: #3d1f1d; --pub: #d1a3ff; --pub-bg: #2e2340;
  }
}
:root[data-theme="dark"] {
  --typed: #8fd19e; --typed-bg: #1d3323; --skip: #8a8a92; --skip-bg: #2a2a2f;
  --own: #f08a5d; --own-bg: #3a2620; --wait: #7fb2ff; --wait-bg: #1c2a40;
  --bad: #ff8a80; --bad-bg: #3d1f1d; --pub: #d1a3ff; --pub-bg: #2e2340;
}
figure.fig { margin: 16px 0; position: relative; }
figure.fig.anim { padding-top: 24px; }
figure.fig svg { display: block; width: 100%; height: auto; overflow: visible; }
figure.fig figcaption { color: var(--muted); font-size: 13px; margin-top: 6px; }
figure.fig.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
figure.fig.pair figcaption { grid-column: 1 / -1; }
@media (max-width: 640px) { figure.fig.pair { grid-template-columns: 1fr; } }
.fig text { fill: var(--ink); font: 12px Inter, system-ui, sans-serif; }
.fig text.m { fill: var(--muted); }
.fig text.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; }
.fig text.b { font-weight: 650; }
.fig text.h { font-weight: 650; fill: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px; }
.fig .ln { stroke: var(--rule); fill: none; }
.fig .ink { stroke: var(--ink); fill: none; }
.fig .mut { stroke: var(--muted); fill: none; }
.fig .box { fill: var(--card); stroke: var(--rule); }
.fig .typed { fill: var(--typed-bg); stroke: var(--typed); }
.fig .skip { fill: var(--skip-bg); stroke: var(--skip); stroke-dasharray: 3 3; }
.fig .own { fill: var(--own-bg); stroke: var(--own); }
.fig .wait { fill: var(--wait-bg); stroke: var(--wait); }
.fig .bad { fill: var(--bad-bg); stroke: var(--bad); }
.fig .pub { fill: var(--pub-bg); stroke: var(--pub); }
.fig .s-typed { stroke: var(--typed); fill: none; } .fig .f-typed { fill: var(--typed); }
.fig .s-own { stroke: var(--own); fill: none; }     .fig .f-own { fill: var(--own); }
.fig .s-wait { stroke: var(--wait); fill: none; }   .fig .f-wait { fill: var(--wait); }
.fig .s-bad { stroke: var(--bad); fill: none; }     .fig .f-bad { fill: var(--bad); }
.fig .s-pub { stroke: var(--pub); fill: none; }     .fig .f-pub { fill: var(--pub); }
.fig .tk { fill: var(--kw); } .fig .tt { fill: var(--typ); } .fig .tn { fill: var(--num); } .fig .editor { fill: var(--code-bg); stroke: var(--rule); } .fig .tab { fill: var(--card); stroke: var(--rule); }
.fig .f-mut { fill: var(--muted); } .fig .f-ink { fill: var(--ink); }
.fig .dash { stroke-dasharray: 4 3; }
.fig text.c-typed { fill: var(--typed); } .fig text.c-own { fill: var(--own); } .fig text.c-wait { fill: var(--wait); }
.fig text.c-bad { fill: var(--bad); } .fig text.c-pub { fill: var(--pub); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid; }
.legend i.typed { background: var(--typed-bg); border-color: var(--typed); }
.legend i.skip { background: var(--skip-bg); border-color: var(--skip); border-style: dashed; }
.legend i.own { background: var(--own-bg); border-color: var(--own); }
.legend i.wait { background: var(--wait-bg); border-color: var(--wait); }
.legend i.bad { background: var(--bad-bg); border-color: var(--bad); }
.legend i.pub { background: var(--pub-bg); border-color: var(--pub); }

/* Motion. A figure's static styles are its final state; when its card comes into view
   (or becomes current in focus mode) the card gets .play and the steps run in order,
   each delayed by --d. With reduced motion nothing moves and the final state shows. */
@keyframes k-in    { from { opacity: 0; } }
@keyframes k-pop   { from { opacity: 0; transform: scale(.7); } }
@keyframes k-grow-x { from { transform: scaleX(0); } }
@keyframes k-grow-y { from { transform: scaleY(0); } }
@keyframes k-draw  { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes k-out   { from { opacity: 1; } }
@keyframes k-slide { from { transform: translateX(var(--dx, 0)); } }
@keyframes k-drop  { from { transform: translateY(var(--dy, -40px)); opacity: 0; } }
@keyframes k-blink { 50% { opacity: .35; } }
@keyframes k-sweep { from { transform: translateY(0); } }
.fig .a-pop, .fig .a-grow-x, .fig .a-grow-y, .fig .a-slide, .fig .a-drop { transform-box: fill-box; }
.fig .a-pop { transform-origin: center; }
.fig .a-grow-x { transform-origin: left center; }
.fig .a-grow-y { transform-origin: center bottom; }
.fig .a-grow-d { transform-origin: center top; transform-box: fill-box; }
.fig .a-draw { stroke-dasharray: 1 0; }
.fig .a-out { opacity: var(--o, .3); }
.fig .a-sweep { transform: translateY(var(--ty, 0)); }
.motion .fig.anim .a-in     { animation: k-in var(--t, .5s) ease-out var(--d, 0s) both; }
.motion .fig.anim .a-pop    { animation: k-pop .45s cubic-bezier(.2,.8,.3,1.2) var(--d, 0s) both; }
.motion .fig.anim .a-grow-x { animation: k-grow-x .7s cubic-bezier(.3,.7,.2,1) var(--d, 0s) both; }
.motion .fig.anim .a-grow-d { animation: k-grow-y .6s cubic-bezier(.3,.7,.2,1) var(--d, 0s) both; }
.motion .fig.anim .a-grow-y { animation: k-grow-y .7s cubic-bezier(.3,.7,.2,1) var(--d, 0s) both; }
.motion .fig.anim .a-draw   { stroke-dasharray: 1 1; animation: k-draw .6s ease-in-out var(--d, 0s) both; }
.motion .fig.anim .a-out    { animation: k-out .5s ease-in var(--d, 0s) both; }
.motion .fig.anim .a-slide  { animation: k-slide .8s cubic-bezier(.3,.7,.2,1) var(--d, 0s) both; }
.motion .fig.anim .a-drop   { animation: k-drop .55s cubic-bezier(.2,.8,.3,1) var(--d, 0s) both; }
.motion .fig.anim .a-sweep  { animation: k-sweep var(--t, 4s) linear var(--d, 0s) both; }
.motion .fig.anim .a-blink  { animation: k-blink 1s ease-in-out var(--d, 0s) var(--n, 3); }
.fig .replay {
  position: absolute; top: -4px; right: 0; font: 11.5px Inter, system-ui, sans-serif; color: var(--muted);
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; cursor: pointer; opacity: .75;
}
.fig .replay { display: flex; gap: 2px; padding: 1px 4px; }
.fig .replay button { font: inherit; color: inherit; background: none; border: 0; padding: 1px 6px; cursor: pointer; border-radius: 999px; }
.fig .replay button:hover { color: var(--accent); background: var(--accent-soft); }
.fig .replay:hover { opacity: 1; border-color: var(--accent); }
.motion .card:not(.play) .fig.anim * { animation-play-state: paused !important; }
.motion .card.rewind .fig.anim * { animation: none !important; }
@media print { .motion .fig.anim * { animation: none !important; } }
@media (prefers-reduced-motion: reduce) {
  .fig * { animation: none !important; }
  .fig .replay { display: none; }
}
@media print { .fig .replay { display: none; } }

.card .fn { margin-top: 1.2em; padding-top: .5em; border-top: 1px solid var(--rule); font-size: .78em; color: var(--muted); }
.card .fn p { margin: .2em 0; }

/* Card 22's table of the five kinds: a chip, what it is, its treatment */
.fig.kinds { display: grid; gap: 8px; }
.krow { display: grid; grid-template-columns: 112px minmax(0, 1fr) 22px minmax(0, 1fr); gap: 10px; align-items: center; }
.krow.khead { font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.kbox { border: 1px solid var(--rule); border-radius: 8px; padding: 7px 11px; background: var(--card); font-size: 14px; line-height: 1.4; }
.kbox .kt { font-weight: 650; font-size: 14.5px; }
.kbox .kd { font-size: 13.5px; margin-top: 1px; }
.kbox .kx { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.kbox.ktreat .kx { font-family: inherit; font-size: 12px; }
.kbox.ktreat { background: var(--typed-bg); border-color: var(--typed); }
.karrow { color: var(--muted); text-align: center; }
@media (max-width: 640px) { .krow { grid-template-columns: 1fr; } .krow.khead, .karrow { display: none; } }

/* Chips: {chip:B lazy fact} names a kind of mutable state (A–E), {chip:claim} a concurrency pattern. */
:root { --chip-kind: #1f6f78; --chip-kind-bg: #dcf0f1; --chip-pat: #8a5a00; --chip-pat-bg: #f8edd6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --chip-kind: #7fd3dc; --chip-kind-bg: #18343a; --chip-pat: #f0c060; --chip-pat-bg: #3a2e14; } }
:root[data-theme="dark"] { --chip-kind: #7fd3dc; --chip-kind-bg: #18343a; --chip-pat: #f0c060; --chip-pat-bg: #3a2e14; }
.chip { display: inline-block; padding: .05em .55em; border-radius: 999px; font-size: .74em; font-weight: 600; line-height: 1.5; white-space: nowrap; vertical-align: .08em; border: 1px solid; }
.chip.kind { color: var(--chip-kind); background: var(--chip-kind-bg); border-color: color-mix(in srgb, var(--chip-kind) 35%, transparent); }
.chip.pat { color: var(--chip-pat); background: var(--chip-pat-bg); border-color: color-mix(in srgb, var(--chip-pat) 35%, transparent); }
.chips { margin: -6px 0 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px 16px; margin: 0 0 14px; }
.card-head > h3, .card-head > h4 { margin: 0; flex: 1 1 auto; min-width: 0; }
.card-head > .chips { margin: .35em 0 0; flex: 0 0 auto; justify-content: flex-end; max-width: 45%; }
@media (max-width: 640px) { .card-head { flex-wrap: wrap; } .card-head > .chips { max-width: none; margin-left: auto; } }
.card.part .chip { filter: none; }

/* Focus mode: one card at a time, bigger type, for presenting */
body.focus nav.toc { display: none; }
body.focus .layout { grid-template-columns: minmax(0, 1fr); }
body.focus main { max-width: 1100px; font-size: 20px; padding-top: 6vh; }
body.focus .card { display: none; min-height: 80vh; }
body.focus .card.current { display: block; outline: none; }
body.focus .card.part.current { display: flex; align-items: center; }
body.focus .card.part h2 { font-size: 44px; }
.focus-counter { display: none; position: fixed; bottom: 14px; right: 18px; color: var(--muted); font-size: 13px; }
body.focus .focus-counter { display: block; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.toc { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--rule); max-height: 40vh; }
  main { padding: 16px 16px 80px; }
  .card { padding: 18px 16px; }
}
/* The scenario player */
main { max-width: 1260px; }
.card > p, .card > ul, .card > ol { max-width: 780px; }
:root { --t1: #0f7486; --t1-bg: #d9eff2; --t2: #a35f00; --t2-bg: #f8ead2; --t3: #6b3fa0; --t3-bg: #efe6f8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --t1: #6fd3e0; --t1-bg: #163439; --t2: #f2b85c; --t2-bg: #3a2c14; --t3: #d1a3ff; --t3-bg: #2e2340; } }
:root[data-theme="dark"] { --t1: #6fd3e0; --t1-bg: #163439; --t2: #f2b85c; --t2-bg: #3a2c14; --t3: #d1a3ff; --t3-bg: #2e2340; }
.scenario { margin: 6px 0 0; }
.scn-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
.scn-beat { font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
.scn-beat .bn { color: var(--accent); margin-right: .5em; font-variant-numeric: tabular-nums; }
.scn-cogs { display: flex; flex-wrap: wrap; gap: 6px; }
.cog { font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: var(--chip-pat); background: var(--chip-pat-bg); border: 1px solid color-mix(in srgb, var(--chip-pat) 40%, transparent); white-space: nowrap; }
.scn-body { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; align-content: start; }
@media (max-width: 1100px) { .scn-body { grid-template-columns: minmax(0, 1fr); } }
.ed { position: relative; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 10px; }
.ed-tabs { border-radius: 10px 10px 0 0; overflow: hidden; }
.ed-tabs { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--rule); font-size: 12.5px; }
.ed-tab { background: var(--card); padding: 6px 14px; border-right: 1px solid var(--rule); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
.ed-run { color: var(--muted); padding: 0 12px; font-size: 12px; }
.ed-lines { padding: 8px 0 10px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; line-height: 1.75; overflow-x: auto; display: grid; grid-template-columns: 5px 34px max-content minmax(max-content, 1fr); }
.l { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; align-items: center; min-height: 1.75em; }
.l .no { color: var(--muted); text-align: right; padding-right: 12px; font-size: 11.5px; user-select: none; }
.l.held .no::before { content: "⏸ "; color: var(--t2); }
.l .code { white-space: pre; }
.l .ov { padding: 0 10px 0 8px; }
.gb { align-self: stretch; transition: background .3s; }
.gb.u-skip { background: repeating-linear-gradient(to bottom, var(--skip) 0 3px, transparent 3px 6px); opacity: .7; }
.gb.u-typed { background: var(--typed); }
.gb.u-T1 { background: var(--t1); } .gb.u-T2 { background: var(--t2); } .gb.u-T3 { background: var(--t3); }

<script type="text/markdown" id="talk-src"># Several readers, one symbol table

<p class="sub">How dotc's presentation compiler lets a hover, a background pass and the editor share one run, and the parts that keep it safe.</p>

Interactive mode serves several requests at once against one symbol table. Each request reads through a `Reader` of its own; edits arrive as write actions that run alone. Symbols still complete lazily, and a completion may be needed by a reader other than the one running it.

What follows is one IDE scenario, run for real on the compiler, with the code in the middle. Step through it with `,` and `.` or the buttons. Each cog lights up at the moment it does its job; a cog with a card links to it, where the cog is taken out to show what goes wrong without it.

## The scenario

### An IDE session, step by step

<div class="scenario"></div>

### The cogs

What each cog is for, the steps of the scenario where it fires, and its card.

<div class="gears"></div>

Batch compilation picks the single-reader mode once per `ContextBase` and runs the code it always ran: under 2% overhead. Interactively the overhead is minor, and the work scales well to four threads and more.

## The cogs, one at a time

Each card starts from the same file and takes one cog away: first the problem, then the mechanism, then the same moment with the cog in place.

### Claim on a completion root

<div class="scenario" data-card="claim"></div>

> A reader sees a symbol's info either finished, or as a lazy type it can wait on. It never sees another reader's half-built info, and never takes another reader's completion for a cycle.

### Publish, then release

<div class="scenario" data-card="publish"></div>

> A reader that finds a cached period current sees everything stored before it.

### Stamped cells

<div class="scenario" data-card="stamped"></div>

> A cache hit returns a value computed at the stamp it was read with.

### Publish once

<div class="scenario" data-card="once"></div>

> A structure that readers share is seen either not at all or whole, never while it is being filled.

### Write action and cancel

<div class="scenario" data-card="write"></div>

> Readers never see a write half done, and a writer waits only until each reader's next checkpoint.

### Owner cancelled mid-completion

<div class="scenario" data-card="unwound"></div>

> A released claim leaves its symbol finished, or marked so that the next reader to reach it starts over. No reader waits on work that nobody is doing.

### Wait-for cycles

<div class="scenario" data-card="cycles"></div>

> No two readers wait on each other forever. A cycle that someone can give way on is broken by that reader; a real cycle between signatures is reported, as one reader would report it.

### Epoch invalidation

<div class="scenario" data-card="epoch"></div>

> A cache computed from published scopes is used only while no published scope has changed since it was made.

### Result stamps

<div class="scenario" data-card="resultstamp"></div>

> A result goes to the editor only if no write action ran between the last lock its request left and its delivery.

        if (nx !== undefined) go(pos.i, nx, true);
        else if (pos.i < N - 1) go(pos.i + 1, 0, !timeline(pos.i + 1).reset);
      } else {
        const pv = [...tl.marks].reverse().find(x => x < pos.t);
        if (pv !== undefined) go(pos.i, pv, false);
        else if (pos.i > 0) go(pos.i - 1, Infinity, false);
      }
    }
    function toggle() {
      if (mode === 'play') { stop(); return; }
      if (pos.i >= N - 1 && pos.t >= timeline(pos.i).end) go(0, 0, false);
      start('play');
    }
    $('.play').onclick = toggle;
    $('.prev').onclick = prev;
    $('.next').onclick = () => { stop(); next(); };
    host.addEventListener('click', e => {
      const a = e.target.closest('a.cog[data-cog]'); if (!a) return;
      e.preventDefault(); const c = cardLink(a.dataset.cog); const i = cards.indexOf(c); if (i >= 0) setCurrent(i, true, true);
    });
    const p = { host, show: i => { stop(); go(i, Infinity, false); }, next: () => { stop(); next(); }, prev, sub, toggle,
      relayout: () => { reserveHeights(); placeThumb(); }, get k() { return pos.i; } };
    // The code in a lightbox over the page; the card's steps go on under it and light its lines.
    const lb = lbEl;
    function code(open) {
      if (!lb) return;
      lb.hidden = !open;
      document.body.classList.toggle('lb-open', open);
      if (open) showCode(sc.frames[pos.i].beat);
    }
    if (lb) {
      // fixed to the window: a card's own transforms would otherwise make it the box the overlay is fixed to
      document.body.appendChild(lb);
      $('.code-btn').onclick = () => code(true);
      lb.querySelector('.lb-close').onclick = () => code(false);
      lb.querySelector('.lb-prev').onclick = prev;
      lb.querySelector('.lb-next').onclick = () => { stop(); next(); };
      lb.addEventListener('click', e => { if (e.target === lb) code(false); });
    }
    p.code = code;
    p.codeOpen = () => !!lb && !lb.hidden;
    players.push(p);
    go(0, Infinity, false);
    reserveHeights();
    if (document.fonts) document.fonts.ready.then(() => { reserveHeights(); placeThumb(); });
    return p;
  }
  function motionOn() { return document.documentElement.classList.contains('motion'); }
  main.querySelectorAll('.scenario').forEach(h => buildPlayer(h, h.dataset.card ? cardScenarios[h.dataset.card] : scenario));
  let lastW = innerWidth;
  window.addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; players.forEach(p => p.relayout()); });
  window.scenarioPlayers = players; // for checks from the console
  setSpeed(speed);
  document.querySelectorAll('.speed button').forEach(b => { b.onclick = () => setSpeed(+b.dataset.s); });
  // The cogs: what each one is for, and the steps of the scenario where it fires.
  const GEARS = [
    ['write', 'Edits run alone. The writer raises a sticky cancel and waits for readers to leave; a body edit re-indexes one member.'],
    ['reader', 'Each request reads through its own Reader: its own typer scratch and its own view of what it is completing.'],
    ['claim', 'Before completing a root, a reader claims it. Until it is done, the info is an InProgress only the owner sees through.'],
    ['wait', 'Another reader that needs the info, or asks whether it is completing, waits on the claim instead of peeking.'],
    ['publish', 'The completed info is published before the claim is released, so a waiter wakes to a whole denotation.'],
    ['target', 'A request types only the statements on its path; the rest stay skipped for whoever needs them next.'],
    ['bodyedit', 'An edit inside one body keeps the run: only that member is entered again.'],
    ['cancel', 'A cancelled reader unwinds at its next checkpoint and releases what it holds.'],
    ['unwound', 'An owner that unwinds resets its roots. A Namer completion cannot run twice, so its waiter is pre-empted and the run is replaced.'],
    ['once', 'A structure that readers share is built in locals and stored once, as one immutable value: seen as nothing or as all of it.'],
    ['stamped', 'A cache value and the period it is valid for, in one immutable object held in one field: read and written whole.'],
    ['epoch', 'A change to a published scope moves one epoch; a cache records the epoch it was made at and is valid while it has not moved.'],
    ['resultstamp', 'A result carries the write count of the last lock its request left, and is served again if a write ran since.'],
    ['cycles', 'A wait that would close a cycle of claims: a reader that can give way does; a real cycle between signatures is reported as one reader would.']
  ];
  main.querySelectorAll('.gears').forEach(host => {
    host.innerHTML = GEARS.map(([id, text]) => {
      if (!id) { const [name, rest] = text.split(': '); return '<div class="gear off"><div class="gn">⚙ ' + esc(name) + '</div><div class="gd">' + esc(rest) + '</div></div>'; }
      const at = scenario.frames.map((f, i) => (f.cogs || []).includes(id) ? '<a href="#" data-frame="' + i + '">' + f.beat + '</a>' : null).filter(Boolean).join(' ');
      const card = cardLink(id) ? ' <a href="#" class="to-card" data-cog="' + id + '">card →</a>' : '';
      return '<div class="gear"><div class="gn">⚙ ' + esc(scenario.cogs[id]) + '</div><div class="gd">' + esc(text) + '</div><div class="ga">' + (at ? 'fires at ' + at : 'no moment of its own in the scenario') + card + '</div></div>';
    }).join('');
    host.addEventListener('click', e => {
      const c = e.target.closest('a.to-card');
      if (c) { e.preventDefault(); const i = cards.indexOf(cardLink(c.dataset.cog)); if (i >= 0) setCurrent(i, true, true); return; }
      const a = e.target.closest('a[data-frame]'); if (!a || !players.length) return;
      e.preventDefault(); const p = players[0]; p.show(+a.dataset.frame);
      const i = cards.indexOf(p.host.closest('.card')); if (i >= 0) setCurrent(i, true, true);
    });
  });

  // 6. Mermaid, themed to match; re-rendered on theme change.
  const mermaidBlocks = Array.from(main.querySelectorAll('pre.mermaid'));
  mermaidBlocks.forEach(b => { b.dataset.src = b.textContent; });
  function isDark() {
    const t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  async function renderMermaid() {
    mermaid.initialize({ startOnLoad: false, theme: isDark() ? 'dark' : 'neutral', securityLevel: 'strict',
      fontFamily: 'Inter, system-ui, sans-serif', flowchart: { htmlLabels: true, curve: 'basis' } });
    mermaidBlocks.forEach(b => { b.removeAttribute('data-processed'); b.innerHTML = ''; b.textContent = b.dataset.src; });
    try { await mermaid.run({ nodes: mermaidBlocks }); } catch (e) { console.error(e); }
  }
  // Mermaid measures label text; wait for the web fonts or the boxes are sized for the fallback font.
  const firstRender = (document.fonts ? document.fonts.ready : Promise.resolve()).then(renderMermaid);

  // 7. Navigation: current card, keyboard, focus mode, theme.
  let current = 0, suppressObserverUntil = 0;
  const counter = document.getElementById('counter');
  function setCurrent(i, scroll, smooth) {
    current = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach((c, j) => c.classList.toggle('current', j === current));
    counter.textContent = (current + 1) + ' / ' + cards.length;
    const id = cards[current].id;
    toc.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.target === id));
    if (scroll) {
      suppressObserverUntil = performance.now() + 1000;
      if (document.body.classList.contains('focus')) window.scrollTo(0, 0);
      else cards[current].scrollIntoView({ block: 'start', behavior: smooth ? 'smooth' : 'instant' });
      if (id) history.replaceState(null, '', '#' + id);
    }
  }
  const io = new IntersectionObserver(entries => {
    if (document.body.classList.contains('focus') || performance.now() < suppressObserverUntil) return;
    const visible = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if (visible.length) setCurrent(cards.indexOf(visible[0].target), false);
  }, { rootMargin: '0px 0px -60% 0px' });
  cards.forEach(c => io.observe(c));
  // Motion: a card's figures play when it comes into view, and again on re-entry.
  // Without reduced motion, an animated figure waits at its first frame until its card plays.
  const motion = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (motion) document.documentElement.classList.add('motion');
  function rewind(c) { c.querySelectorAll('figure.anim').forEach(f => { f._step = undefined; }); c.classList.remove('play'); c.classList.add('rewind'); void c.offsetWidth; c.classList.remove('rewind'); }
  function play(c) { rewind(c); c.classList.add('play'); }
  // A figure's steps: its animations grouped by start time, a start within 150 ms of the previous one joining
  // its group. A sweep or a blink runs alongside and does not delimit steps.
  function stepsOf(f) {
    const all = f.getAnimations({ subtree: true });
    const side = a => { const el = a.effect.target; return !!(el && el.classList && (el.classList.contains('a-sweep') || el.classList.contains('a-blink'))); };
    const timed = all.filter(a => !side(a)).map(a => { const st = a.effect.getTiming().delay || 0; return { a, st, end: st + (a.effect.getComputedTiming().activeDuration || 0) }; }).sort((x, y) => x.st - y.st);
    const steps = []; let prev = -Infinity;
    timed.forEach(s => { const last = steps[steps.length - 1]; if (last && s.st - prev < 150) { last.end = Math.max(last.end, s.end); last.members.push(s); } else steps.push({ st: s.st, end: s.end, members: [s] }); prev = s.st; });
    return { all, side, steps };
  }
  // Step k shows every animation of steps 0..k finished and every later one not yet started.
  function step(f, dir) {
    const c = f.closest('.card');
    if (!c.classList.contains('play')) play(c);
    const { all, side, steps } = stepsOf(f);
    if (!steps.length) return;
    const k = f._step === undefined ? (dir > 0 ? 0 : steps.length - 1) : Math.max(-1, Math.min(steps.length - 1, f._step + dir));
    f._step = k;
    all.forEach(a => a.pause());
    steps.forEach((s, i) => s.members.forEach(m => { m.a.currentTime = i <= k ? m.end : 0; }));
    const tm = k < 0 ? 0 : steps[k].end;
    all.filter(side).forEach(a => { a.currentTime = tm; });
  }
  const animated = cards.filter(c => c.querySelector('figure.anim'));
  // Watch the figures, not the cards: a card can be taller than the window, a figure is not.
  // A figure half in view plays its card; a card whose figures have all left the view rewinds.
  const playObs = new IntersectionObserver(entries => {
    if (document.body.classList.contains('focus')) return;
    entries.forEach(e => {
      const c = e.target.closest('.card');
      e.target.dataset.seen = e.isIntersecting ? '1' : '';
      if (e.isIntersecting && e.intersectionRatio >= 0.5) { if (!c.classList.contains('play')) play(c); }
      else if (!e.isIntersecting && c.classList.contains('play') && ![...c.querySelectorAll('figure.anim')].some(f => f.dataset.seen)) rewind(c);
    });
  }, { threshold: [0, 0.5] });
  animated.forEach(c => {
    c.querySelectorAll('figure.anim').forEach(f => playObs.observe(f));
    c.querySelectorAll('figure.anim').forEach(f => {
      const bar = document.createElement('div'); bar.className = 'replay';
      const mk = (label, title, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.title = title; b.onclick = fn; bar.appendChild(b); };
      mk('◀', 'step back', () => step(f, -1));
      mk('▶', 'step forward', () => step(f, +1));
      mk('↻', 'replay', () => play(c));
      f.appendChild(bar);
    });
  });
  const baseSetCurrent = setCurrent;
  setCurrent = function (i, scroll, smooth) {
    baseSetCurrent(i, scroll, smooth);
    if (document.body.classList.contains('focus')) { animated.forEach(c => c !== cards[current] && c.classList.contains('play') && rewind(c)); if (animated.includes(cards[current])) play(cards[current]); }
  };
  function toggleFocus() { document.body.classList.toggle('focus'); setCurrent(current, true); }
  function toggleTheme() {
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('dotc-concurrency-theme', next); } catch (e) {}
    renderMermaid();
  }
  try { const t = localStorage.getItem('dotc-concurrency-theme'); if (t) { document.documentElement.dataset.theme = t; renderMermaid(); } } catch (e) {}
  document.getElementById('btn-focus').onclick = toggleFocus;
  document.getElementById('btn-theme').onclick = toggleTheme;
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['j', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); setCurrent(current + 1, true, true); }
    else if (['k', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); setCurrent(current - 1, true, true); }
    else if (e.key === 'f') toggleFocus();
    else if (e.key === 't') toggleTheme();
    else if (e.key === 'Escape') { const open = players.find(q => q.codeOpen()); if (open) open.code(false); else document.body.classList.remove('focus'); }
    else if (e.key === 'c') { const c = cards[current], p = c && players.find(q => c.contains(q.host)); if (p && p.code) p.code(!p.codeOpen()); }
    else if (e.key === '[' || e.key === ']') nudgeSpeed(e.key === ']' ? 1 : -1);
    else if (['.', ',', '>', '<', 'p'].includes(e.key)) {
      const c = cards[current];
      const p = players.find(q => q.codeOpen()) || (c && players.find(q => c.contains(q.host)));
      if (p) { e.preventDefault(); ({ '.': p.next, ',': p.prev, '>': () => p.sub(1), '<': () => p.sub(-1), p: p.toggle })[e.key](); }
      else if (c && c.querySelector('figure.anim') && (e.key === '.' || e.key === ',')) step(c.querySelector('figure.anim'), e.key === '.' ? 1 : -1);
    }
  });
  toc.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    const i = cards.findIndex(c => c.id === a.dataset.target); if (i >= 0) { e.preventDefault(); setCurrent(i, true); }
  });
  main.addEventListener('click', e => {
    const a = e.target.closest('a.sref'); if (!a) return;
    const i = cards.findIndex(c => '#' + c.id === a.getAttribute('href')); if (i >= 0) { e.preventDefault(); setCurrent(i, true); }
  });
  const start = location.hash ? cards.findIndex(c => '#' + c.id === location.hash) : 0;
  setCurrent(start < 0 ? 0 : start, start > 0);
  firstRender.then(() => { if (start > 0) setCurrent(start, true); });
  // For screenshots: ?shot=<card>:<step>[&theme=dark][&code=1] shows that card alone, at that step.
  const shotQ = new URLSearchParams(location.search);
  if (shotQ.get('shot')) {
    const [cardId, stepNo] = shotQ.get('shot').split(':');
    const p = players.find(q => (q.host.dataset.card || 'l1') === cardId);
    if (shotQ.get('theme')) document.documentElement.dataset.theme = shotQ.get('theme');
    document.documentElement.classList.remove('motion');
    if (p) {
      document.body.classList.add('focus', 'shot');
      setCurrent(cards.indexOf(p.host.closest('.card')), false);
      if (shotQ.get('code') && p.code) p.code(true);
      p.show(+stepNo);
    }
  }
})();
</script>
</body>
